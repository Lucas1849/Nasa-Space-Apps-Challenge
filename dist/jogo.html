<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#070b18">
  <meta name="description" content="Space Mission Design Game: monte uma missão espacial com recursos limitados e descubra por que ela deu certo ou errado. NASA Space Apps Challenge 2026.">
  <title>Space Mission Design Game</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <style>
/* =========================================================
   Space Mission Design Game — tema visual
   Variáveis em :root; a equipe de UI troca cores aqui.
   ========================================================= */
:root {
  --bg: #070b18;
  --bg-2: #0d1430;
  --panel: rgba(255, 255, 255, 0.045);
  --panel-strong: rgba(255, 255, 255, 0.08);
  --line: rgba(255, 255, 255, 0.10);
  --fg: #e8edff;
  --muted: #8d97ba;
  --accent: #38bdf8;
  --accent-2: #818cf8;
  --amber: #fbbf24;
  --ok: #34d399;
  --danger: #fb7185;
  --radius: 14px;
  --radius-sm: 9px;
  --shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
  --font: 'Space Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --mono: 'JetBrains Mono', ui-monospace, Consolas, monospace;
}

* { box-sizing: border-box; }
body {
  margin: 0; min-height: 100vh; color: var(--fg); font-family: var(--font); line-height: 1.45;
  background: var(--bg);
  overflow-x: hidden;
}
/* Degradê do fundo numa camada fixa própria: não é redesenhado ao rolar a página
   (background-attachment: fixed forçava repintar a tela inteira a cada rolagem). */
body::before {
  content: ''; position: fixed; inset: 0; z-index: -1; pointer-events: none;
  background: radial-gradient(1200px 700px at 15% -10%, #1b2a6b 0%, transparent 60%),
              radial-gradient(900px 600px at 110% 20%, #3b1d6b 0%, transparent 55%),
              linear-gradient(180deg, var(--bg-2) 0%, var(--bg) 60%);
}

/* Campo de estrelas (CSS puro, sem imagens), estático, numa camada fixa só (body::after).
   Desempenho: as estrelas animadas repintavam a tela inteira a cada quadro (~16 fps com a tela parada).
   Estáticas, são desenhadas uma vez e o jogo roda a 60 fps. */
body::after {
  content: ''; position: fixed; inset: 0; z-index: -1; pointer-events: none; opacity: .6;
  background-image:
    radial-gradient(1px 1px at 20% 30%, #fff 50%, transparent 51%),
    radial-gradient(1px 1px at 60% 70%, #fff 50%, transparent 51%),
    radial-gradient(1.5px 1.5px at 80% 20%, #cfe3ff 50%, transparent 51%),
    radial-gradient(1px 1px at 35% 85%, #fff 50%, transparent 51%),
    radial-gradient(1px 1px at 90% 55%, #fff 50%, transparent 51%),
    radial-gradient(1.5px 1.5px at 10% 60%, #ffe9c4 50%, transparent 51%),
    radial-gradient(1px 1px at 50% 10%, #fff 50%, transparent 51%),
    radial-gradient(1px 1px at 70% 45%, #fff 50%, transparent 51%),
    radial-gradient(1px 1px at 15% 75%, rgba(255,255,255,.6) 50%, transparent 51%),
    radial-gradient(1px 1px at 75% 15%, rgba(255,255,255,.6) 50%, transparent 51%),
    radial-gradient(1px 1px at 45% 50%, rgba(255,255,255,.6) 50%, transparent 51%);
  background-size: 420px 420px, 420px 420px, 420px 420px, 420px 420px, 420px 420px, 420px 420px, 420px 420px, 420px 420px,
    260px 260px, 260px 260px, 260px 260px;
}

#app { position: relative; z-index: 1; max-width: 1180px; margin: 0 auto; padding: 20px 20px 60px; }

h1 { margin: 0; font-size: clamp(1.6rem, 3vw, 2.4rem); font-weight: 700; letter-spacing: -0.02em; }
h2 { font-size: .8rem; margin: 26px 0 10px; color: var(--muted); text-transform: uppercase; letter-spacing: .14em; font-weight: 600; }
h3 { font-size: 1rem; margin: 16px 0 8px; font-weight: 600; }
p { margin: 6px 0; }
.hint { color: var(--muted); font-size: .9rem; }
.eyebrow { color: var(--accent); text-transform: uppercase; font-size: .75rem; letter-spacing: .14em; font-weight: 600; margin: 0 0 6px; }
.num { font-family: var(--mono); font-variant-numeric: tabular-nums; }

/* ---------- Botões e inputs ---------- */
button {
  font: inherit; font-weight: 600; color: var(--fg); cursor: pointer;
  background: var(--panel-strong); border: 1px solid var(--line); border-radius: 999px;
  padding: 10px 18px; transition: transform .12s ease, border-color .12s ease, background .12s ease, box-shadow .12s ease;
}
button:hover:not(:disabled) { transform: translateY(-1px); border-color: rgba(56, 189, 248, 0.6); box-shadow: 0 6px 18px rgba(56, 189, 248, 0.15); }
button:active:not(:disabled) { transform: translateY(0); }
button:disabled { opacity: .4; cursor: not-allowed; }
button.primary { background: linear-gradient(135deg, var(--accent), var(--accent-2)); color: #06101f; border: 0; box-shadow: 0 8px 24px rgba(56, 189, 248, 0.25); }
button.primary:hover:not(:disabled) { box-shadow: 0 12px 30px rgba(56, 189, 248, 0.35); }
button.ghost { background: transparent; }
button.selected { border-color: var(--accent); background: rgba(56, 189, 248, 0.14); box-shadow: inset 0 0 0 1px var(--accent); }
button.small { padding: 7px 12px; font-size: .85rem; }
button.danger { color: var(--danger); }

input, select {
  font: inherit; color: var(--fg); background: var(--panel-strong); border: 1px solid var(--line);
  border-radius: var(--radius-sm); padding: 10px 12px; outline: none;
}
input:focus, select:focus { border-color: var(--accent); }
select option { background: #0f1736; }

.row { display: flex; gap: 10px; align-items: center; margin: 12px 0; flex-wrap: wrap; }
.row.wrap button { text-align: left; border-radius: var(--radius-sm); }
/* Sem backdrop-filter: o desfoque era recalculado a cada quadro sobre as estrelas em movimento.
   O fundo um pouco mais opaco dá o mesmo efeito de vidro escuro. */
.panel { background: rgba(16, 22, 46, 0.82); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px 18px; }
/* A entrada animada só acontece quando a TELA muda, não a cada clique (ver main.js). */
.screen.enter { animation: rise .25s ease both; }
@keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }

/* ---------- HUD (barra superior nas telas de jogo) ---------- */
.hud { position: sticky; top: 0; z-index: 5; display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
  padding: 10px 16px; margin: -8px -8px 18px; border-radius: var(--radius);
  background: rgba(7, 11, 24, 0.94); border: 1px solid var(--line); }
.hud .who { display: flex; align-items: center; gap: 10px; font-weight: 600; }
.avatar { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; color: #06101f; box-shadow: 0 0 0 3px rgba(255,255,255,0.08); }
.c0 { background: #38bdf8; } .c1 { background: #fbbf24; } .c2 { background: #34d399; } .c3 { background: #f472b6; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 5px 11px; border-radius: 999px; background: var(--panel-strong); border: 1px solid var(--line); font-size: .85rem; }
.chip .num { font-weight: 700; }
.hud .spacer { flex: 1; }
.hud .steps { display: flex; gap: 6px; font-size: .75rem; color: var(--muted); }
.hud .steps span { padding: 4px 9px; border-radius: 999px; border: 1px solid transparent; }
.hud .steps .on { color: var(--fg); border-color: var(--accent); background: rgba(56,189,248,.12); }

/* ---------- Setup ---------- */
.hero { display: grid; grid-template-columns: 1.2fr 1fr; gap: 28px; align-items: center; padding: 30px 0 10px; }
.hero h1 { font-size: clamp(2rem, 4.5vw, 3.4rem); line-height: 1.05; }
.hero h1 span { background: linear-gradient(90deg, var(--accent), var(--accent-2)); -webkit-background-clip: text; background-clip: text; color: transparent; }
.hero .lead { font-size: 1.1rem; color: #c3ccf0; max-width: 54ch; }
.hero-art { aspect-ratio: 4 / 3; }
.steps-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
.step { padding: 14px 16px; }
.step .n { font-family: var(--mono); color: var(--accent); font-size: .8rem; }
.step strong { display: block; margin: 4px 0 2px; }
.step p { color: var(--muted); font-size: .9rem; margin: 0; }

.mission-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 12px; }
.mission-card { text-align: left; border-radius: var(--radius); padding: 14px; display: flex; flex-direction: column; gap: 6px; align-items: flex-start; height: 100%; }
.mission-card .icon { font-size: 1.6rem; }
.mission-card strong { font-size: 1rem; }
.mission-card .diff { font-size: .72rem; text-transform: uppercase; letter-spacing: .1em; color: var(--muted); }
.mission-card .goal { color: var(--muted); font-size: .85rem; font-weight: 400; }
.mission-card.selected .diff { color: var(--accent); }

.player-row { display: grid; grid-template-columns: 44px 1fr; gap: 10px; align-items: center; margin: 10px 0; }
.player-row .avatar { width: 40px; height: 40px; }
.toggle { display: inline-flex; gap: 10px; align-items: center; color: var(--muted); cursor: pointer; padding: 8px 0; }
.toggle input { accent-color: var(--accent); width: 18px; height: 18px; }
.count-btns button { min-width: 44px; }

/* ---------- Tabuleiro em anel ---------- */
.board-layout { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(280px, 1fr); gap: 20px; align-items: start; }
.ring { display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(3, minmax(110px, auto)); gap: 10px; }
.tile { position: relative; padding: 12px; border-radius: var(--radius); background: var(--panel); border: 1px solid var(--line); min-height: 110px; display: flex; flex-direction: column; justify-content: space-between; transition: box-shadow .2s, transform .2s; }
.tile .t-icon { font-size: 1.4rem; }
.tile .t-label { font-weight: 600; font-size: .9rem; line-height: 1.2; }
.tile .t-sub { font-size: .75rem; color: var(--muted); }
.tile-funds { border-color: rgba(52, 211, 153, 0.35); } .tile-funds .t-sub { color: var(--ok); }
.tile-tax { border-color: rgba(251, 113, 133, 0.4); } .tile-tax .t-sub { color: var(--danger); }
.tile-event { border-color: rgba(251, 191, 36, 0.4); } .tile-event .t-sub { color: var(--amber); }
.tile-catchup { border-color: rgba(56, 189, 248, 0.4); } .tile-catchup .t-sub { color: var(--accent); }
.tile-start { border-color: rgba(255,255,255,0.3); }
.tile.active { box-shadow: 0 0 0 2px var(--accent), 0 0 30px rgba(56,189,248,.35); transform: translateY(-2px); }
.pawns { position: absolute; top: 8px; right: 8px; display: flex; gap: 4px; }
.pawn { width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; font-size: .7rem; font-weight: 700; color: #06101f; box-shadow: 0 2px 6px rgba(0,0,0,.4); animation: pop .3s ease; }
@keyframes pop { from { transform: scale(.4); } to { transform: scale(1); } }
.ring-center { grid-column: 2; grid-row: 2; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; text-align: center; padding: 12px; }
.die { font-size: 3rem; line-height: 1; filter: drop-shadow(0 6px 10px rgba(0,0,0,.5)); }
.die.rolling { animation: shake .5s ease; }
@keyframes shake { 0%,100% { transform: rotate(0); } 25% { transform: rotate(-20deg) scale(1.1); } 50% { transform: rotate(15deg); } 75% { transform: rotate(-10deg) scale(1.05); } }
.ring-center .label { font-size: .75rem; color: var(--muted); text-transform: uppercase; letter-spacing: .1em; }

.milestones { list-style: none; padding: 0; margin: 0; display: grid; gap: 8px; }
.milestones li { display: grid; grid-template-columns: 26px 1fr; gap: 10px; align-items: start; color: var(--muted); font-size: .9rem; }
.milestones li::before { content: '○'; color: var(--muted); font-size: 1.1rem; line-height: 1.2; }
.milestones li.done { color: var(--fg); }
.milestones li.done::before { content: '●'; color: var(--ok); }
.milestones strong { display: block; }
.milestones small { color: var(--muted); }

.log { font-size: .86rem; max-height: 260px; overflow: auto; }
.log ul { margin: 0; padding: 0; list-style: none; }
.log li { padding: 6px 0; border-bottom: 1px dashed var(--line); color: var(--muted); }
.log li:first-child { color: var(--fg); }

/* ---------- Oficina ---------- */
.workshop-grid { display: grid; grid-template-columns: minmax(0, 1.6fr) minmax(300px, 1fr); gap: 22px; align-items: start; }
.side { position: sticky; top: 76px; display: grid; gap: 12px; }
.spacecraft-box { position: relative; background: radial-gradient(ellipse at 50% 60%, rgba(56,189,248,.12) 0%, transparent 60%), rgba(0,0,0,.25); border: 1px solid var(--line); border-radius: var(--radius); padding: 8px; overflow: hidden; }
.spacecraft-box::after { content: ''; position: absolute; inset: 0; background: linear-gradient(transparent 0 96%, rgba(56,189,248,.06) 96%), repeating-linear-gradient(90deg, transparent 0 39px, rgba(255,255,255,.03) 39px 40px); pointer-events: none; }
.spacecraft { width: 100%; height: auto; display: block; max-height: 260px; }
.spacecraft-box .caption { position: absolute; left: 14px; bottom: 10px; font-size: .75rem; color: var(--muted); font-family: var(--mono); }

.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 12px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px; transition: border-color .15s, transform .15s; }
.card:hover { border-color: rgba(255,255,255,0.2); }
.card.owned { border-color: rgba(56,189,248,.45); background: rgba(56,189,248,.06); }
.card-head { display: flex; align-items: center; gap: 10px; }
.card .icon { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; font-size: 1.3rem; background: var(--panel-strong); border: 1px solid var(--line); flex-shrink: 0; }
.card-head strong { font-size: .95rem; line-height: 1.2; }
.badge { margin-left: auto; background: var(--accent); color: #06101f; border-radius: 999px; padding: 1px 9px; font-size: .78rem; font-weight: 700; font-family: var(--mono); }
.pills { display: flex; flex-wrap: wrap; gap: 5px; margin: 10px 0; }
.pill { font-size: .74rem; padding: 3px 8px; border-radius: 999px; border: 1px solid var(--line); font-family: var(--mono); }
.pill.gain { color: var(--ok); border-color: rgba(52,211,153,.35); background: rgba(52,211,153,.08); }
.pill.lose { color: var(--amber); border-color: rgba(251,191,36,.35); background: rgba(251,191,36,.08); }
.card .row { margin: 4px 0 0; }
.price { font-family: var(--mono); }

/* Medidores */
.gauges { display: grid; gap: 9px; }
.gauge { display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; align-items: baseline; font-size: .85rem; }
.gauge .g-label { color: var(--muted); }
.gauge .g-value { font-family: var(--mono); font-weight: 700; font-size: .85rem; }
.gauge .bar { grid-column: 1 / -1; height: 7px; border-radius: 999px; background: rgba(255,255,255,.08); overflow: hidden; position: relative; }
.gauge .fill { height: 100%; border-radius: 999px; background: var(--ok); transition: width .3s ease, background .3s; }
.gauge .mark { position: absolute; top: -2px; width: 2px; height: 11px; background: #fff; opacity: .7; }
.gauge.bad .fill { background: var(--danger); }
.gauge.bad .g-value { color: var(--danger); }
.gauge.warn .fill { background: var(--amber); }

.checklist { list-style: none; padding: 0; margin: 0; font-size: .86rem; display: grid; gap: 4px; }
.checklist li { display: grid; grid-template-columns: 18px 1fr; gap: 8px; padding: 6px 0; border-bottom: 1px solid var(--line); color: var(--muted); }
.checklist li.ok { color: #b9c3e6; }
.checklist li.bad { color: var(--danger); }
.checklist li.warn { color: var(--amber); }
.checklist li span:first-child { font-weight: 700; }

.glossary { font-size: .88rem; }
.glossary summary { cursor: pointer; color: var(--accent); font-weight: 600; }
.glossary dl { margin: 10px 0 0; }
.glossary dt { font-weight: 600; margin-top: 8px; }
.glossary dd { margin: 0 0 4px; color: var(--muted); }

/* ---------- Voo (evento) ---------- */
.flight { max-width: 900px; margin: 0 auto; text-align: center; padding-top: 30px; }
.flight .alarm { font-size: 4rem; animation: pulse 1.2s ease-in-out infinite; display: inline-block; }
@keyframes pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.08); } }
.flight h1 { color: var(--amber); }
.event-text { font-size: 1.1rem; max-width: 64ch; margin: 14px auto 0; color: #d6ddf7; }
.options { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 14px; margin-top: 20px; text-align: left; }
.option { display: flex; flex-direction: column; gap: 10px; cursor: pointer; }
.option:hover { transform: translateY(-2px); border-color: var(--accent); }
.option strong { font-size: 1.02rem; }
.option .consequence { color: var(--amber); font-size: .88rem; font-family: var(--mono); }

/* ---------- Relatório ---------- */
.report-head { display: grid; grid-template-columns: 1fr auto; gap: 20px; align-items: center; padding: 24px; position: relative; overflow: hidden; }
.report-head .stamp { position: absolute; right: -10px; top: -14px; font-size: 7rem; opacity: .08; transform: rotate(-12deg); pointer-events: none; }
.report.success .report-head { border-color: rgba(52,211,153,.5); background: linear-gradient(135deg, rgba(52,211,153,.12), transparent 60%); }
.report.failure .report-head { border-color: rgba(251,113,133,.5); background: linear-gradient(135deg, rgba(251,113,133,.12), transparent 60%); }
.report.success h1 { color: var(--ok); } .report.failure h1 { color: var(--danger); }
.score { text-align: center; padding: 10px 22px; border-radius: var(--radius); background: rgba(0,0,0,.25); border: 1px solid var(--line); }
.score .big { font-family: var(--mono); font-size: 2.6rem; font-weight: 700; line-height: 1; }
.score .label { font-size: .72rem; color: var(--muted); text-transform: uppercase; letter-spacing: .12em; }
.report-grid { display: grid; grid-template-columns: 3fr 2fr; gap: 20px; align-items: start; margin-top: 18px; }
.reasons { margin: 0; padding-left: 20px; }
.reasons li { margin: 8px 0; }
.lesson { border-left: 3px solid var(--accent); margin-top: 14px; }
.lesson p { margin: 4px 0; }

/* ---------- Overlay de lançamento ---------- */
.launch-overlay { cursor: pointer; position: fixed; inset: 0; z-index: 50; display: grid; place-items: center; background: radial-gradient(ellipse at 50% 100%, #1b2a6b 0%, var(--bg) 70%); animation: fadeIn .3s ease; }
.launch-overlay .rocket { font-size: 5rem; animation: liftoff 1.4s cubic-bezier(.4,0,.6,1) forwards; }
.launch-overlay .count { position: absolute; top: 18%; font-family: var(--mono); font-size: 4rem; font-weight: 700; color: var(--accent); animation: tick 1.4s steps(1) forwards; }
.launch-overlay .flame { position: absolute; bottom: 0; left: 50%; width: 40vw; height: 30vh; transform: translateX(-50%); background: radial-gradient(ellipse at 50% 100%, rgba(251,191,36,.6) 0%, rgba(251,113,133,.25) 40%, transparent 70%); animation: flame 1.4s ease-out forwards; }
@keyframes liftoff { 0% { transform: translateY(40vh) scale(.9); } 30% { transform: translateY(30vh) scale(1); } 100% { transform: translateY(-80vh) scale(.6); } }
@keyframes tick { 0% { content: '3'; } }
@keyframes flame { 0% { opacity: 0; } 20% { opacity: 1; } 100% { opacity: 0; transform: translateX(-50%) scaleY(2); } }
@keyframes fadeIn { from { opacity: 0; } }

.toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); z-index: 60; background: var(--danger); color: #06101f; padding: 10px 18px; border-radius: 999px; font-weight: 700; box-shadow: var(--shadow); animation: rise .25s ease; }
.banner { padding: 10px 14px; border-radius: var(--radius-sm); background: rgba(52,211,153,.12); border: 1px solid rgba(52,211,153,.4); }

/* ---------- IDEIA v2: anel de 16 casas, corrida, agência, voo em etapas ---------- */
.ring.ring-16 { grid-template-columns: repeat(5, minmax(0, 1fr)); grid-template-rows: repeat(5, minmax(92px, auto)); gap: 8px; }
.ring-16 .tile { min-height: 92px; padding: 9px; }
.ring-16 .tile .t-icon { font-size: 1.2rem; }
.ring-16 .tile .t-label { font-size: .78rem; }
.ring-16 .tile .t-sub { font-size: .68rem; }
.ring-16 .ring-center { grid-column: 2 / 5; grid-row: 2 / 5; }
.tile-tech { border-color: rgba(167, 139, 250, 0.45); } .tile-tech .t-sub { color: #c4b5fd; }
.tile-shop { border-color: rgba(52, 211, 153, 0.35); } .tile-shop .t-sub { color: var(--ok); }
.tile-hazard { border-color: rgba(251, 113, 133, 0.4); background: rgba(251, 113, 133, 0.05); } .tile-hazard .t-sub { color: var(--danger); }
.tile-repair { border-color: rgba(56, 189, 248, 0.4); } .tile-repair .t-sub { color: var(--accent); }
.tile-lot { border-style: dashed; }
.tile.owned { border-style: solid; border-width: 2px; }
.tile.owned.o0 { border-color: #38bdf8; } .tile.owned.o1 { border-color: #fbbf24; } .tile.owned.o2 { border-color: #34d399; } .tile.owned.o3 { border-color: #f472b6; }
.tile-decision { display: grid; gap: 8px; padding: 10px; border-radius: var(--radius-sm); background: rgba(0,0,0,.25); border: 1px solid var(--line); max-width: 420px; }
.side-stack { display: grid; gap: 12px; }
.chip.small { padding: 2px 8px; font-size: .75rem; }
.chip.year { border-color: var(--accent); }

.pbar { height: 8px; border-radius: 999px; background: rgba(255,255,255,.08); overflow: hidden; }
.pbar .fill { height: 100%; border-radius: 999px; background: var(--accent); transition: width .4s ease; }
.pbar.done .fill { background: var(--ok); }
.race-row { display: grid; gap: 6px; padding: 10px 0; border-bottom: 1px solid var(--line); }
.race-row:last-child { border-bottom: 0; }
.race-row.current strong { color: var(--accent); }

  state.winners = [];
  state.gameOver = false;
  state.lastRoll = null;

  if (state.sandbox) {
    state.players.forEach((p) => { p.funds = SANDBOX_FUNDS; p.tech = SANDBOX_TECH; });
    state.screen = 'workshop';
    pushLog(state, 'Modo sandbox: verba livre, tecnologia liberada, sem tabuleiro. Explore os trade-offs à vontade.');
    return null;
  }

  const sides = drawSides(state.players.length, rng);
  state.players.forEach((p, i) => assignSide(p, sides[i]));
  if (state.players.length === 1) state.players.push(createBot(state.players[0], rng));

  pushLog(state, `Começa a corrida espacial. A cada 3 rodadas passa um ano; a partida termina em ${yearOf(MAX_ROUNDS)}.`);
  state.players.forEach((p) => pushLog(state, `${p.name} joga pelo lado ${SIDES[p.side].name}.`));
  startTurn(state);
  state.screen = humans(state).length > 1 ? 'handoff' : 'board';
  return null;
}

function assignSide(p, sideId) {
  const side = SIDES[sideId];
  p.side = sideId;
  p.launcherTech = side.launcherTech;
  p.funds += side.startFunds;
  p.missionId = side.ladder[0];
}

// Bot do solo: o outro lado, cumprindo cada degrau no ano real (±1). Se o lado nunca cumpriu, nunca cumpre.
function createBot(human, rng) {
  const sideId = human.side === 'usa' ? 'ussr' : 'usa';
  const bot = createPlayer(1, `Agência rival (${SIDES[sideId].name})`);
  bot.bot = true;
  assignSide(bot, sideId);
  bot.schedule = ladderOf(bot).map((m) => {
    const real = REAL_HISTORY[m].sides[sideId];
    return real == null ? null : real + Math.floor(rng() * 3) - 1;
  });
  return bot;
}

// Início do turno. No "Ano novo" (1ª rodada de cada ano): verba e tecnologia.
function startTurn(state) {
  const p = currentPlayer(state);
  p.rolled = false;
  p.flightAdvanced = false;
  p.launchedThisTurn = false;
  state.dice = null;
  state.pendingTile = null;
  state.pendingDilemma = null;
  if (p.bot) return;
  if (isNewYear(state.round)) {
    const funds = YEARLY_BUDGET + SIDES[p.side].yearlyBonus + SPONSOR_FUNDS_PER_LEVEL * p.buildings.sponsor;
    const tech = TECH_PER_YEAR + p.buildings.lab;
    p.funds += funds;
    p.tech += tech;
    pushLog(state, `${p.name}: Ano novo! Orçamento +${funds} de verba, +${tech} de tecnologia (nível ${p.tech}).`, p.id);
  }
}

// Turno do bot: cumpre os degraus cujo ano chegou. Tudo privado (rival escondido).
function botTurn(state) {
  const bot = currentPlayer(state);
  const year = yearOf(state.round);
  const ladder = ladderOf(bot);
  while (bot.step < ladder.length && bot.schedule[bot.step] != null && year >= bot.schedule[bot.step]) {
    const missionId = ladder[bot.step];
    bot.completed.push({ missionId, year, science: 0 });
    bot.bestStage[missionId] = flightPlan(missionId).length;
    bot.step += 1;
    bot.missionId = ladder[bot.step] || null;
    pushLog(state, `${bot.name} cumpriu "${MISSIONS[missionId].name}".`, bot.id);
  }
}

function endTurn(state) {
  const p = currentPlayer(state);
  if (state.sandbox) {
    state.screen = p.flight ? 'flight' : 'workshop';
    return null;
  }
  if (!p.rolled) return 'Role os dados e ande antes de passar a vez.';
  if (state.pendingDilemma) return 'Resolva a carta de dilema antes de passar a vez.';
  if (p.flight?.pending) return 'Decida o imprevisto do voo antes de passar a vez.';
  if (p.flight && !p.flightAdvanced) return 'Sua nave está em voo: avance uma etapa antes de passar a vez.';
  advanceTurn(state);
  return null;
}

// Passa para o próximo jogador humano; o bot joga sozinho no caminho.
function advanceTurn(state) {
  for (;;) {
    state.turn = (state.turn + 1) % state.players.length;
    if (state.turn === 0) {
      endRound(state);
      if (state.gameOver) return;
      state.round += 1;
      if (isNewYear(state.round)) pushLog(state, `Começa o ano de ${yearOf(state.round)}.`);
    }
    startTurn(state);
    if (!currentPlayer(state).bot) break;
    botTurn(state);
  }
  state.screen = humans(state).length > 1 ? 'handoff' : 'board';
}

// Desempate: progresso na escada, depois degraus, depois ciência entregue, depois verba.
function rankKey(p) {
  const prog = ladderProgress(p);
  return [prog.pct, prog.steps, p.completed.reduce((s, c) => s + c.science, 0), p.funds];
}
function compareRank(a, b) {
  const ka = rankKey(a);
  const kb = rankKey(b);
  for (let i = 0; i < ka.length; i += 1) if (ka[i] !== kb[i]) return kb[i] - ka[i];
  return 0;
}

// Fim da rodada: termina antes de declarar vencedor, para todos jogarem o mesmo número de turnos.
function endRound(state) {
  const done = state.players.filter((p) => ladderProgress(p).done);
  const timeUp = state.round >= MAX_ROUNDS;
  if (!done.length && !timeUp) return;
  const pool = done.length ? done : state.players;
  const sorted = [...pool].sort(compareRank);
  state.winners = sorted.filter((p) => compareRank(p, sorted[0]) === 0).map((p) => p.id);
  state.gameOver = true;
  state.endReason = done.length ? 'ladder' : 'time';
  state.screen = 'gameover';
  const names = state.winners.map((id) => state.players[id].name).join(' e ');
  pushLog(state, done.length ? `${names} completou a escada de missões!` : `Fim de ${yearOf(state.round)}: vence quem subiu mais degraus (${names}).`);
}

// ---------------------------------------------------------------- tabuleiro

// Quem está em último na corrida recebe o choque do Sputnik e desconto no upgrade.
function isLastPlayer(state, player) {
  return state.players.every((p) => compareRank(player, p) >= 0);
}

// Rola 2 dados; o jogador escolhe qual usar (IDEIA.md v3: ainda tem sorte, mas ele sente que decidiu).
function rollDice(state, rng = Math.random) {
  const p = currentPlayer(state);
  if (state.sandbox) return 'No modo sandbox não há tabuleiro.';
  if (p.rolled || state.dice) return 'Você já rolou os dados neste turno.';
  state.dice = [rollDie(rng), rollDie(rng)];
  return null;
}

function moveBy(state, index, rng = Math.random) {
  const p = currentPlayer(state);
  if (!state.dice) return 'Role os dados primeiro.';
  const steps = state.dice[index];
  if (!steps) return 'Dado inválido.';
  state.dice = null;
  const moved = movePlayer(p, steps);
  const tile = TILES[moved.position];
  const { player, messages } = applyTile(moved, tile, { isLast: isLastPlayer(state, p) });
  Object.assign(p, player);
  p.rolled = true;
  state.lastRoll = steps;
  pushLog(state, `${p.name} andou ${steps} e parou em "${tile.label}".`, p.id);
  messages.forEach((m) => pushLog(state, `${p.name}: ${m}`, p.id));

  if (tile.type === 'lot') {
    const lot = state.lots[tile.id];
    if (!lot) state.pendingTile = { tileId: tile.id, kind: 'build' };
    else if (lot.ownerId !== p.id) state.pendingTile = { tileId: tile.id, kind: 'use' };
    else pushLog(state, `${p.name}: este terreno já é seu (${BUILDINGS[lot.buildingId].name}).`, p.id);
  }

  if (tile.type === 'spy') {
    if (state.players.length < 2) pushLog(state, `${p.name}: não há rivais para espionar.`, p.id);
    else if (p.lastSpyYear === yearOf(state.round)) pushLog(state, `${p.name}: o espião já trabalhou este ano.`, p.id);
    else state.pendingTile = { tileId: tile.id, kind: 'spy' };
  }

  // Evento: com a nave em voo vira imprevisto na próxima etapa; em solo, carta de dilema.
  if (tile.type === 'event') {
    if (p.flight) {
      const eventId = pickEvent(rng).id;
      p.flight.tileEvent = eventId;
      pushLog(state, `${p.name}: sua nave em voo vai enfrentar "${FLIGHT_EVENTS[eventId].title}" na próxima etapa.`, p.id);
    } else {
      state.pendingDilemma = { id: pickDilemma(p, rng).id };
    }
  }
  return null;
}

// Atalho: rola e anda com o primeiro dado (usado nos testes).
function rollAndMove(state, rng = Math.random) {
  return rollDice(state, rng) || moveBy(state, 0, rng);
}

function applyEffect(state, p, e, rng) {
  if (e.gamble) {
    const won = rng() < e.gamble.chance;
    pushLog(state, `${p.name}: ${won ? 'deu certo!' : 'deu errado.'}`, p.id);
    applyEffect(state, p, won ? e.gamble.win : e.gamble.lose, rng);
    return;
  }
  if (e.funds) p.funds = Math.max(0, p.funds + e.funds);
  if (e.tech) p.tech = Math.max(0, p.tech + e.tech);
  if (e.discount) p.discount = Math.max(p.discount, e.discount);
  if (e.shield) p.shields += e.shield;
  if (e.launchRisk) p.launchRisk = (p.launchRisk || 0) + e.launchRisk;
  if (e.rumor) spreadRumor(state, p, rng);
}

function chooseDilemma(state, index, rng = Math.random) {
  const p = currentPlayer(state);
  const card = DILEMMAS.find((d) => d.id === state.pendingDilemma?.id);
  if (!card) return 'Nenhuma carta de dilema pendente.';
  const option = card.options[index];
  if (!option) return 'Opção inválida.';
  state.pendingDilemma = null;
  pushLog(state, `${p.name} — ${card.title}: "${option.label}". ${option.lesson}`, p.id);
  applyEffect(state, p, option.effect, rng);
  return null;
}

// Boato: informação vaga sobre um rival, às vezes errada.
function spreadRumor(state, p, rng) {
  const rivals = state.players.filter((r) => r.id !== p.id);
  if (!rivals.length) return;
  const rival = rivals[Math.floor(rng() * rivals.length)];
  const total = ladderOf(rival).length;
  const truth = rng() < RUMOR_TRUTH;
  const shown = truth ? rival.step : Math.max(0, Math.min(total, rival.step + (rng() < 0.5 ? -1 : 1)));
  p.intel[rival.id] = { year: yearOf(state.round), rumor: true, steps: shown, total };
  pushLog(state, `Boato: dizem que ${rival.name} já cumpriu ${shown} de ${total} degraus. Pode não ser verdade.`, p.id);
}

// Espionagem: paga e vê o estado real de um rival (degrau atual e quanto a nave está pronta).
function spyOn(state, rivalId) {
  const p = currentPlayer(state);
  if (state.pendingTile?.kind !== 'spy') return 'Você não está na casa de espionagem.';
  const rival = state.players.find((r) => r.id === rivalId && r.id !== p.id);
  if (!rival) return 'Rival inválido.';
  if (p.funds < SPY_COST) return `Verba insuficiente: o espião custa ${SPY_COST}.`;
  p.funds -= SPY_COST;
  p.lastSpyYear = yearOf(state.round);
  p.intel[rival.id] = spyReport(state, rival);
  state.pendingTile = null;
  pushLog(state, `${p.name} pagou ${SPY_COST} ao espião para observar ${rival.name}.`, p.id);
  return null;
}

function spyReport(state, rival) {
  const ladder = ladderOf(rival);
  const report = {
    year: yearOf(state.round),
    rumor: false,
    steps: rival.step,
    total: ladder.length,
    mission: rival.missionId ? MISSIONS[rival.missionId].name : null,
  };
  if (rival.bot) return { ...report, note: 'Segue o próprio calendário; não dá para ver a oficina.' };
  if (rival.flight) {
    return { ...report, mission: MISSIONS[rival.flight.missionId].name, inFlight: true, stage: rival.flight.stageIndex, stages: rival.flight.plan.length };
  }
  const checks = checkDesign(rival).checks.filter((c) => c.hard);
  return { ...report, ready: checks.length ? checks.filter((c) => c.ok).length / checks.length : 0 };
}

// Terreno livre: constrói um prédio novo (nível 1). Upgrade depois é de qualquer lugar.
function buildOnLot(state, buildingId) {
  const p = currentPlayer(state);
  const pending = state.pendingTile;
  if (!pending || pending.kind !== 'build') return 'Você não está num terreno livre.';
  if (!BUILDINGS[buildingId]) return 'Prédio desconhecido.';
  if (p.buildings[buildingId] > 0) return `Você já tem ${BUILDINGS[buildingId].name}. Suba o nível no painel da agência.`;
  const cost = upgradeCost(0);
  if (p.funds < cost) return `Verba insuficiente: construir custa ${cost}.`;
  p.funds -= cost;
  p.buildings[buildingId] = 1;
  state.lots[pending.tileId] = { ownerId: p.id, buildingId };
  state.pendingTile = null;
  pushLog(state, `${p.name} construiu ${BUILDINGS[buildingId].name} num terreno.`);
  return null;
}

const useFeeFor = (level) => USE_FEE + 2 * (level - 1);

// Prédio de outro jogador: paga a taxa ao dono e recebe o efeito uma vez. Os dois ganham.
function useRivalBuilding(state) {
  const p = currentPlayer(state);
  const pending = state.pendingTile;
  if (!pending || pending.kind !== 'use') return 'Não há prédio de rival para usar aqui.';
  const lot = state.lots[pending.tileId];
  const owner = state.players[lot.ownerId];
  const building = BUILDINGS[lot.buildingId];
  const fee = useFeeFor(owner.buildings[lot.buildingId]);
  if (p.funds < fee) return `Verba insuficiente: a taxa é ${fee}.`;
  p.funds -= fee;
  owner.funds += fee;
  applyEffect(state, p, building.useEffect, Math.random);
  state.pendingTile = null;
  pushLog(state, `${p.name} pagou ${fee} a ${owner.name} para usar o ${building.name}.`);
  return null;
}

function skipTile(state) {
  state.pendingTile = null;
  return null;
}

function upgradeBuilding(state, buildingId) {
  const p = currentPlayer(state);
  if (state.sandbox) return 'Prédios não existem no modo sandbox.';
  const level = p.buildings[buildingId];
  if (!level) return 'Construa este prédio num terreno livre primeiro.';
  if (level >= MAX_LEVEL) return 'Este prédio já está no nível máximo.';
  const cost = upgradeCostFor(state, p, buildingId);
  if (p.funds < cost) return `Verba insuficiente: o upgrade custa ${cost}.`;
  p.funds -= cost;
  p.buildings[buildingId] = level + 1;
  pushLog(state, `${p.name} subiu ${BUILDINGS[buildingId].name} para o nível ${level + 1} por ${cost}.`, p.id);
  return null;
}

// Quem está em último paga metade no upgrade (freio contra bola de neve).
function upgradeCostFor(state, player, buildingId) {
  const base = upgradeCost(player.buildings[buildingId]);
  const behind = state.players.length > 1 && isLastPlayer(state, player);
  return behind ? Math.round(base * CATCHUP_UPGRADE_DISCOUNT) : base;
}

// Sem eliminação: com pouca verba, a agência pede socorro e perde tecnologia.
function requestBailout(state) {
  const p = currentPlayer(state);
  if (p.funds >= BAILOUT_LIMIT) return `Socorro só com menos de ${BAILOUT_LIMIT} de verba.`;
  p.funds += BAILOUT_FUNDS;
  p.tech = Math.max(0, p.tech - BAILOUT_TECH_COST);
  p.bailouts += 1;
  pushLog(state, `${p.name} pediu socorro de emergência: +${BAILOUT_FUNDS} de verba, −${BAILOUT_TECH_COST} de tecnologia.`, p.id);
  return null;
}

// ---------------------------------------------------------------- missão e oficina

// Só no sandbox: no jogo normal a missão é o degrau atual da escada.
function chooseMission(state, missionId) {
  const p = currentPlayer(state);
  if (!state.sandbox) return 'A missão é o próximo degrau da escada do seu lado.';
  if (!MISSIONS[missionId]) return 'Missão desconhecida.';
  if (p.flight) return 'Espere a nave em voo terminar a missão antes de trocar.';
  p.missionId = missionId;
  pushLog(state, `${p.name} escolheu a missão "${MISSIONS[missionId].name}".`, p.id);
  checkMilestones(state, p);
  return null;
}

function buyItem(state, itemId) {
  const p = currentPlayer(state);
  const item = CATALOG[itemId];
  if (isLocked(p, item)) return `${item.name} exige tecnologia ${requiredTech(p, item)} (você tem ${p.tech}).`;
  const price = priceFor(p, itemId);
  if (p.funds < price) return `Verba insuficiente: ${item.name} custa ${price}.`;
  p.funds -= price;
  const bucket = INSTRUMENTS[itemId] ? p.spacecraft.instruments : p.spacecraft.parts;
  bucket.push(itemId);
  pushLog(state, `${p.name} comprou ${item.name} por ${price}.`, p.id);
  p.discount = 0; // desconto de evento vale para uma compra (a Fábrica é permanente)
  checkMilestones(state, p);
  return null;
}

// Antes de voar, revende pelo valor cheio (regra do IDEIA.md).
function sellItem(state, itemId) {
  const p = currentPlayer(state);
  const bucket = INSTRUMENTS[itemId] ? p.spacecraft.instruments : p.spacecraft.parts;
  const idx = bucket.indexOf(itemId);
  if (idx === -1) return 'Item não está na espaçonave.';
  bucket.splice(idx, 1);
  p.funds += CATALOG[itemId].cost;
  pushLog(state, `${p.name} vendeu ${CATALOG[itemId].name} por ${CATALOG[itemId].cost}.`, p.id);
  return null;
}

function chooseLauncher(state, launcherId) {
  const p = currentPlayer(state);
  const launcher = LAUNCHERS[launcherId];
  if (isLocked(p, launcher)) return `${launcher.name} exige tecnologia ${requiredTech(p, launcher)} (você tem ${p.tech}).`;
  p.spacecraft.launcherId = launcherId;
  checkMilestones(state, p);
  return null;
}

function chooseOrbit(state, orbitId) {
  const p = currentPlayer(state);
  p.spacecraft.orbitId = orbitId;
  checkMilestones(state, p);
  return null;
}

// ---------------------------------------------------------------- degraus (milestones)

// Bônus só uma vez por missão (chave `${missionId}:${milestoneId}`). Efeitos: funds, discount, shield.
function grant(state, player, milestoneId, missionId = player.missionId) {
  const key = `${missionId}:${milestoneId}`;
  if (!missionId || player.milestones.includes(key)) return;
  const ms = MISSIONS[missionId].milestones.find((m) => m.id === milestoneId);
  player.milestones.push(key);
  if (ms.effect.type === 'funds') player.funds += ms.effect.value;
  if (ms.effect.type === 'discount') player.discount = Math.max(player.discount, ms.effect.value);
  if (ms.effect.type === 'shield') player.shields += ms.effect.value;
  pushLog(state, `${player.name} atingiu "${ms.name}" (${describeEffect(ms.effect)}).`, player.id);
}

function describeEffect(effect) {
  if (effect.type === 'funds') return `+${effect.value} de verba`;
  if (effect.type === 'discount') return `${effect.value}% de desconto na próxima compra`;
  return 'proteção contra uma falha';
}

function checkMilestones(state, player) {
  if (player.missionId && !player.flight && checkDesign(player).designOk) grant(state, player, 'design_ready');
}

// ---------------------------------------------------------------- voo em etapas

// Lança: paga o lançador, a nave sai da oficina e a SUBIDA é sorteada na hora (encerra o turno).
function launch(state, rng = Math.random) {
  const p = currentPlayer(state);
  if (!p.missionId) return state.sandbox ? 'Escolha uma missão antes de lançar.' : 'Sua escada já está completa.';
  if (p.flight) return 'Você já tem uma nave em voo.';
  if (!state.sandbox && !p.rolled) return 'Ande no tabuleiro antes de lançar.';
  if (!state.sandbox && p.launchedThisTurn) return 'Só um lançamento por turno.';
  const design = checkDesign(p);
  if (!design.ok) return 'O projeto ainda tem pendências: veja a checagem na oficina.';
  p.funds -= design.totals.launchCost;
  p.launches += 1;
  grant(state, p, 'launched');
  const missionId = p.missionId;
  p.flight = {
    missionId,
    plan: flightPlan(missionId),
    stageIndex: 0,
    craft: p.spacecraft,
    modifiers: { sciencePenalty: 0, lifetimeDelta: 0 },
    stages: [],
    pending: null,
    tileEvent: null,
    last: null,
  };
  // A oficina fica livre para montar a próxima nave (próximo degrau) enquanto esta voa.
  p.spacecraft = { ...emptySpacecraft(), launcherId: p.flight.craft.launcherId, orbitId: p.flight.craft.orbitId };
  if (!state.sandbox) p.missionId = ladderOf(p)[p.step + 1] || null;
  p.launchedThisTurn = true;
  p.flightAdvanced = true;
  pushLog(state, `${p.name} lançou a missão "${MISSIONS[missionId].name}".`, p.id);
  const stageId = p.flight.plan[0];
  const risk = stageRisk(flyer(p), stageId);
  p.launchRisk = 0; // o defeito ignorado só pesa nesta subida
  resolveStage(state, p, stageId, risk, { label: 'Lançamento' }, rng);
  return null;
}

// Prepara a próxima etapa: imprevisto da casa de evento onde o jogador parou (ou garantido nas chegadas).
function advanceFlight(state, rng = Math.random) {
  const p = currentPlayer(state);
  if (!p.flight) return 'Nenhuma nave em voo.';
  if (p.flight.pending) { state.screen = 'flight'; return null; }
  if (!state.sandbox) {
    if (!p.rolled) return 'Ande no tabuleiro primeiro: uma casa de evento pode trazer um imprevisto para o voo.';
    if (p.flightAdvanced) return 'O voo avança uma etapa por turno.';
  }
  const stageId = p.flight.plan[p.flight.stageIndex];
  let eventId = p.flight.tileEvent;
  if (!eventId && STAGES[stageId].guaranteedEvent) eventId = pickEvent(rng).id;
  p.flight.tileEvent = null;
  p.flight.pending = { stageId, eventId: eventId || null };
  p.flightAdvanced = true;
  state.screen = 'flight';
  return null;
}

const combinePenalty = (a, b) => 1 - (1 - a) * (1 - b);

// O jogador escolheu uma opção da etapa: aplica a consequência e sorteia o risco.
function chooseStageOption(state, index, rng = Math.random) {
  const p = currentPlayer(state);
  const pending = p.flight?.pending;
  if (!pending) return 'Nenhuma etapa aguardando decisão.';
  const option = stageOptions(p, pending)[index];
  if (!option) return 'Opção inválida.';
  if (option.disabled) return 'Verba insuficiente para esta opção.';
  const e = option.effect;
  if (e.funds) p.funds = Math.max(0, p.funds + e.funds);
  if (e.sciencePenalty) p.flight.modifiers.sciencePenalty = combinePenalty(p.flight.modifiers.sciencePenalty, e.sciencePenalty);
  if (e.lifetimeDelta) p.flight.modifiers.lifetimeDelta += e.lifetimeDelta;
  p.flight.pending = null;
  const event = pending.eventId ? FLIGHT_EVENTS[pending.eventId] : null;
  resolveStage(state, p, pending.stageId, option.risk, { event, label: option.label, lesson: option.lesson, effect: e }, rng);
  return null;
}

// Sorteia a etapa. Proteção absorve uma falha. Falha = nave perdida + dados de falha (+ consolação).
function resolveStage(state, p, stageId, risk, info, rng) {
  const stage = STAGES[stageId];
  let failed = rng() < risk.total;
  let usedShield = false;
  if (failed && p.shields > 0) {
    p.shields -= 1;
    usedShield = true;
    failed = false;
  }
  const record = {
    stageId,
