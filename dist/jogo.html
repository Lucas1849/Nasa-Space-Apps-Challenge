  font: 500 15px var(--display);
  color: var(--tinta);
  transition: background var(--rapido), padding var(--rapido);
}
.main-menu-item:last-child { border-bottom: 0; }
.main-menu-item .ic { color: var(--tinta-2); margin: 0; }
.main-menu-item .mm-label { flex: 1; text-align: left; }
.main-menu-item .mm-chev { opacity: 0; transform: translateX(-4px); transition: opacity var(--rapido), transform var(--rapido); color: var(--tinta-2); }
.main-menu-item:hover:not(:disabled), .main-menu-item:focus-visible { background: var(--superficie); padding-left: 12px; }
.main-menu-item:hover .mm-chev, .main-menu-item:focus-visible .mm-chev { opacity: 1; transform: none; }
.main-menu-foot { font: 400 11px var(--mono); color: var(--tinta-3); margin: 0; }
/* planetas em pixel do menu: miniatura em cada opção e um Júpiter ao lado do título */
.mm-planet { display: block; width: 34px; height: 34px; border-radius: 8px; background: #07080b; overflow: hidden; flex: none; }
.mm-planet .pixel-space, .mm-title-planet .pixel-space, .splash-only-art .pixel-space { width: 100%; height: 100%; display: block; }
:root[data-tema="escuro"] .mm-planet { box-shadow: 0 0 0 1px var(--linha-forte); }
.main-menu-title-row { display: flex; align-items: center; gap: 14px; }
.mm-title-planet { display: block; width: 58px; height: 58px; }
.credits-list { margin: 0; padding: 0; list-style: none; display: grid; gap: 10px; font-size: 13.5px; color: var(--tinta-2); }
.credits-list strong { display: block; font: 500 11px var(--mono); text-transform: uppercase; letter-spacing: 0.06em; color: var(--tinta-3); margin-bottom: 2px; }

/* Relógio do turno no topo (ui/turnClock.js): âmbar nos últimos 30 s, vermelho piscando nos últimos 10 */
.turn-clock {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  min-height: 34px;
  padding: 3px 11px 3px 9px;
  border-radius: 4px;
  background: var(--superficie-2);
  border: 1px solid var(--linha);
  color: var(--tinta);
}
.turn-clock .ic { color: var(--tinta-2); }
.turn-clock .tc-num { font: 500 17px/1 var(--mono); font-variant-numeric: tabular-nums; min-width: 3.2ch; }
.turn-clock .tc-bar { position: relative; width: 56px; height: 4px; background: var(--linha); overflow: hidden; }
.turn-clock .tc-fill { position: absolute; inset: 0 auto 0 0; background: var(--tinta); transition: width .25s linear; }
.turn-clock.warn { border-color: color-mix(in srgb, var(--ambar) 55%, var(--linha)); background: var(--ambar-fundo); }
.turn-clock.warn .tc-num, .turn-clock.warn .ic { color: var(--ambar); }
.turn-clock.warn .tc-fill { background: var(--ambar); }
.turn-clock.danger { border-color: var(--alerta); background: var(--alerta-fundo); animation: clockPulse 1s ease-in-out infinite; }
.turn-clock.danger .tc-num, .turn-clock.danger .ic { color: var(--alerta); }
.turn-clock.danger .tc-fill { background: var(--alerta); }
@keyframes clockPulse { 50% { box-shadow: 0 0 0 3px color-mix(in srgb, var(--alerta) 25%, transparent); } }

/* Cartões de opção da Nova Partida (como jogar, modo) */
.option-cards { display: grid; grid-template-columns: repeat(var(--cols, 2), minmax(0, 1fr)); gap: 8px; }
.option-card {
  height: auto;
  min-height: 72px;
  display: grid;
  grid-template-columns: auto 1fr;
  grid-template-rows: auto auto;
  column-gap: 8px;
  row-gap: 2px;
  align-content: start;
  justify-items: start;
  padding: 10px 12px;
  text-align: left;
  white-space: normal;
  background: var(--superficie);
  border: 1px solid var(--linha-forte);
  border-radius: 4px;
}
.option-card .ic { grid-row: 1; color: var(--tinta-3); margin: 0; }
.option-card strong { grid-row: 1; font-size: 13.5px; font-weight: 600; line-height: 1.2; }
.option-card small { grid-column: 1 / -1; font-size: 12px; font-weight: 400; color: var(--tinta-3); line-height: 1.35; }
.option-card[aria-pressed="true"] { border-color: var(--tinta); box-shadow: inset 0 0 0 1px var(--tinta); }
.option-card[aria-pressed="true"] .ic { color: var(--tinta); }
@media (max-width: 520px) { .option-cards { grid-template-columns: 1fr; } .option-card { min-height: 0; } }

/* ===== Barra fixa do turno (tabuleiro) e de lançamento (oficina) ===== */
.turn-dock, .launch-dock {
  position: sticky;
  bottom: calc(10px + env(safe-area-inset-bottom, 0px));
  z-index: 15;
  margin-top: 18px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px 16px;
  flex-wrap: wrap;
  padding: 9px 12px;
  border-radius: var(--radius);
  border: 1px solid var(--linha-forte);
  background: var(--superficie);
  box-shadow: var(--sombra-flutua);
}
.turn-dock .turn-steps { margin: 0; display: flex; gap: 4px; }
.turn-dock .turn-steps li { padding: 5px 8px; }
.turn-dock .turn-steps li:not(.now) .lbl { display: none; } /* só o passo atual tem nome: menos texto */
.dock-actions { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-left: auto; }
.dock-actions .action-bar { margin: 0; gap: 8px; }
.dock-note { color: var(--tinta-3); font-size: 13px; }
.dock-die { display: inline-block; width: 20px; height: 20px; }
.dock-die svg { width: 100%; height: 100%; display: block; }
button.reveal { animation: reveal .3s ease .5s both; }
@keyframes reveal { from { opacity: 0; transform: translateY(6px); } }
button.launch-ready { animation: readyGlow 1.6s ease-in-out infinite; }
@keyframes readyGlow { 50% { box-shadow: 0 0 0 4px color-mix(in srgb, var(--ok) 28%, transparent); } }
.launch-dock .dock-status { margin: 0; display: flex; align-items: center; gap: 8px; max-width: 70ch; font-size: 13px; }
.dock-status .ic { flex: none; }
.dock-status.ok { color: var(--ok); }
.dock-status.warn { color: var(--ambar); }
.dock-status.bad { color: var(--alerta); }
.launch-dock .dock-buttons { margin: 0 0 0 auto; gap: 8px; }
.launch-dock.ready { border-color: color-mix(in srgb, var(--ok) 45%, var(--linha)); }
.checks-ok summary { min-height: 24px; padding: 3px 0; cursor: pointer; color: var(--tinta-3); font-size: 12.5px; margin-top: 8px; }
.all-ok { display: flex; gap: 6px; align-items: center; color: var(--ok); margin: 0; }

/* ===== Dados clicáveis do tabuleiro: "?" antes de rolar, giram ao cair, um botão por dado ===== */
.gb-dice-row { display: flex; gap: 14px; justify-content: center; }
.board-gadget .ring-center button.gb-die-btn {
  height: auto;
  display: grid;
  justify-items: center;
  gap: 5px;
  padding: 4px;
  border: 0;
  border-radius: 8px;
  background: none;
  box-shadow: none;
  color: #f4f7ff;
  font: 700 11px var(--mono);
  text-transform: uppercase;
}
.board-gadget .ring-center button.gb-die-btn.pair { display: flex; gap: 12px; }
.board-gadget .ring-center button.gb-die-btn:hover:not(:disabled) { background: none; transform: none; }
.gb-die { display: block; width: 54px; height: 54px; filter: drop-shadow(0 3px 0 #12151f); transition: transform .12s ease; }
.gb-die svg { width: 100%; height: 100%; display: block; }
.gb-die-btn:hover .gb-die, .gb-die-btn:focus-visible .gb-die { transform: translateY(-3px) rotate(-4deg); }
.gb-die-btn.pair:hover .gb-die:last-child { transform: translateY(-3px) rotate(5deg); }
.gb-die.idle { animation: dieIdle 2.4s ease-in-out infinite; }
.gb-die.idle:last-child { animation-delay: .3s; }
.gb-die.tumble { animation: tumble .7s cubic-bezier(.2, .8, .3, 1) both; animation-delay: calc(var(--i, 0) * .09s); }
.gb-die.landed { animation: landed .35s ease both; }
@keyframes dieIdle { 50% { transform: translateY(-3px); } }
@keyframes tumble {
  0% { transform: translate(-46px, -34px) rotate(-280deg) scale(.6); opacity: 0; }
  60% { transform: translate(4px, 4px) rotate(16deg) scale(1.08); opacity: 1; }
  82% { transform: rotate(-5deg) scale(.97); }
  100% { transform: none; }
}
@keyframes landed { from { transform: scale(1.25) rotate(-10deg); } }
.board-gadget .tile.tile-preview { border-color: #fbd367; box-shadow: 0 0 0 3px #fbd367, 0 4px 0 #12151f; transform: translateY(-2px); z-index: 3; }
.gadget-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; }

/* ===== Animações que mostram o que mudou (ui/motion.js) ===== */
.hud .stat-num { display: inline-block; }
.stat.bump-up .stat-num { animation: bumpUp .5s ease; }
.stat.bump-down .stat-num { animation: bumpDown .5s ease; }
@keyframes bumpUp { 30% { transform: scale(1.25); color: var(--ok); } }
@keyframes bumpDown { 30% { transform: scale(.85); color: var(--alerta); } }
.float-delta { position: fixed; z-index: 70; pointer-events: none; transform: translate(-50%, 0); font: 600 15px var(--mono); animation: floatDown 1.2s ease-out forwards; }
.float-delta.up { color: var(--ok); }
.float-delta.down { color: var(--alerta); }
.float-delta.tech.up { color: var(--azul-texto); }
@keyframes floatDown {
  0% { opacity: 0; transform: translate(-50%, 4px) scale(.8); }
  15% { opacity: 1; transform: translate(-50%, 18px) scale(1.15); }
  100% { opacity: 0; transform: translate(-50%, 54px) scale(1); }
}
.gauge .fill.grow { animation: barGrow .5s cubic-bezier(.2, .8, .3, 1) both; }
@keyframes barGrow { from { width: var(--from); } }
.card.just-bought { animation: bought .5s cubic-bezier(.2, .9, .3, 1.3); }
@keyframes bought { 0% { transform: scale(.97); box-shadow: 0 0 0 0 color-mix(in srgb, var(--ok) 55%, transparent); } 100% { transform: none; box-shadow: 0 0 0 12px transparent; } }
.spacecraft-box.build-pulse svg { animation: buildPulse .55s ease; }
@keyframes buildPulse { 40% { transform: scale(1.04); } }

/* Voo: trajetória Terra → destino com a nave avançando etapa por etapa */
.trajectory { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 12px; max-width: 640px; margin: 16px auto 4px; color: var(--tinta-3); }
.traj-end { display: grid; place-items: center; width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--linha-forte); background: var(--superficie); }
.traj-end.earth { color: var(--azul-texto); }
.traj-end.dest { color: var(--ambar); }
.traj-line { position: relative; height: 4px; border-radius: 2px; background: repeating-linear-gradient(90deg, var(--linha-forte) 0 6px, transparent 6px 12px); }
.traj-done { position: absolute; left: 0; top: 0; bottom: 0; border-radius: inherit; width: calc(var(--to) * 100%); background: var(--ok); animation: trajGrow 1.1s ease-in-out both; }
@keyframes trajGrow { from { width: calc(var(--from) * 100%); } }
.trajectory.failed .traj-done { background: var(--alerta); }
.traj-mark { position: absolute; top: 50%; width: 12px; height: 12px; border-radius: 50%; transform: translate(-50%, -50%); background: var(--fundo); border: 2px solid var(--linha-forte); }
.traj-mark.ok { border-color: var(--ok); background: var(--ok); }
.traj-mark.bad { border-color: var(--alerta); background: var(--alerta); }
.traj-mark.now { border-color: var(--tinta); }
.traj-ship { position: absolute; top: 50%; left: calc(var(--to) * 100%); transform: translate(-50%, -50%) rotate(90deg); color: var(--tinta); animation: trajShip 1.1s ease-in-out both; }
@keyframes trajShip { from { left: calc(var(--from) * 100%); } }
.trajectory.failed .traj-ship { color: var(--alerta); transform: translate(-50%, -50%) rotate(150deg); }
.flight .alarm.burst { position: relative; color: var(--ok); animation: burstPop .5s cubic-bezier(.2, .9, .3, 1.4) both; }
@keyframes burstPop { from { transform: scale(.3); opacity: 0; } }
.report.success .report-head .stamp { animation: stampIn .5s cubic-bezier(.2, .9, .3, 1.3) .15s both; }
@keyframes stampIn { from { transform: rotate(-30deg) scale(2.2); opacity: 0; } to { transform: rotate(-12deg) scale(1); opacity: .08; } }
.report.failure .report-head { animation: failShake .5s ease .1s both; }
@keyframes failShake { 15%, 45%, 75% { transform: translateX(-6px); } 30%, 60%, 90% { transform: translateX(6px); } }

@media (max-width: 700px) {
  /* celular: a barra lateral vira uma faixa horizontal dentro do topo */
  .side-rail { position: static; width: 100%; order: 20; flex-direction: row; align-items: stretch; padding: 6px 0 0; border-right: 0; border-top: 1px solid var(--linha); overflow-x: auto; }
  .side-rail .rail-nav { flex-direction: row; }
  .rail-brand { display: none; }
  .rail-item { min-width: 58px; }
  body:has(.side-rail) #app { padding-left: max(20px, env(safe-area-inset-left, 0px)); }
  .turn-dock, .launch-dock { bottom: 0; }
  .dock-actions, .launch-dock .dock-buttons { margin-left: 0; width: 100%; }
  .dock-actions .action-bar { width: 100%; }
  .dock-actions button, .launch-dock .dock-buttons button { flex: 1 1 auto; }
}

/* =========================================================
   Tabuleiro: planta de engenharia (cianotipia). Referência: Space Race (2021), elogiado por assumir o visual
   de blueprint de engenheiro de foguetes. Um papel azul, traço branco fino e grade técnica; sem brilho,
   sem degradê, sem faixas coloridas. Cor só onde informa: a cor de cada jogador e um âmbar único para
   "você está aqui" e "o dado para aqui". Visual único nos dois temas (cores declaradas aqui).
   ========================================================= */
.board-screen .board-gadget {
  --bp-paper: #1f4579;
  --bp-deep: #193a67;
  --bp-ink: #f2f6ff;
  --bp-ink-2: rgba(242, 246, 255, 0.78);
  --bp-line: rgba(242, 246, 255, 0.42);
  --bp-faint: rgba(242, 246, 255, 0.12);
  --bp-mark: #ffc857;
  background-color: var(--bp-paper);
  background-image:
    linear-gradient(var(--bp-faint) 1px, transparent 1px),
    linear-gradient(90deg, var(--bp-faint) 1px, transparent 1px),
    linear-gradient(rgba(242, 246, 255, 0.05) 1px, transparent 1px),
    linear-gradient(90deg, rgba(242, 246, 255, 0.05) 1px, transparent 1px);
  background-size: 100px 100px, 100px 100px, 20px 20px, 20px 20px;
  border: 1px solid var(--bp-deep);
  border-radius: 2px;
  padding: 14px 16px 16px;
  box-shadow: none;
  color: var(--bp-ink);
}
/* moldura de prancha: filete duplo como numa folha de desenho técnico */
.board-screen .board-gadget .gadget-screen { background: transparent; border: 1px solid var(--bp-ink-2); outline: 1px solid var(--bp-line); outline-offset: 3px; border-radius: 0; box-shadow: none; }
.board-screen .board-gadget .gadget-map-svg rect { stroke: var(--bp-line); }
.board-screen .board-gadget .gadget-map-svg polyline { stroke: var(--bp-mark); }
/* carimbo da prancha (ano/rodada) e casa atual, como o quadro de legenda de um desenho técnico */
.board-screen .board-gadget .gadget-lcd-bezel { background: transparent; border: 0; padding: 0; box-shadow: none; }
.board-screen .board-gadget .gadget-lcd-screen, .board-screen .board-gadget .g-chip {
  background: transparent; border: 1px solid var(--bp-ink-2); border-radius: 0; box-shadow: none;
  color: var(--bp-ink); padding: 4px 10px; font: 500 11px var(--mono); letter-spacing: 0.08em;
}

/* casas: retângulos de traço, rótulo técnico, ícone de linha */
.board-screen .board-gadget .tile {
  background: #10284b;
  border: 1px solid rgba(242, 246, 255, 0.55);
  border-radius: 0;
  box-shadow: 3px 3px 0 rgba(8, 20, 40, 0.45);
  color: var(--bp-ink);
  transform: none;
}
.board-screen .board-gadget .tile:hover { border-color: var(--bp-ink); background: #142f57; }
.board-screen .board-gadget .tile.tile-corner { border-color: var(--bp-ink-2); }
.board-screen .board-gadget .tile .t-band {
  background: transparent;
  color: var(--bp-ink-2);
  border-bottom: 1px solid var(--bp-line);
  font: 500 11px var(--mono);
  letter-spacing: 0.1em;
}
.board-screen .board-gadget .tile .t-band-dir { color: var(--bp-ink-2); font-weight: 400; }
.board-screen .board-gadget .t-art-row { background: transparent; border-color: var(--bp-line); }
.t-art-ink { display: grid; place-items: center; width: 30px; height: 30px; color: var(--bp-ink); }
.t-art-ink svg { width: 100%; height: 100%; display: block; }
.board-screen .board-gadget .tile .t-label { color: var(--bp-ink); font-weight: 600; font-size: 13px; }
.board-screen .board-gadget .tile .t-sub { font-size: 11px; }
/* cantos: ícone maior, como as casas especiais de um tabuleiro impresso */
.board-screen .board-gadget .tile-corner .t-art-ink { width: 40px; height: 40px; }
.board-screen .board-gadget .tile-corner .t-label { font-size: 14px; }
.board-screen .board-gadget .tile .t-sub { color: var(--bp-ink-2); font-weight: 400; }
.board-screen .board-gadget .tile .t-icon { background: transparent; border: 1px solid var(--bp-ink-2); color: var(--bp-ink); box-shadow: none; }
.board-screen .board-gadget .tile.owned { border-style: solid; }
/* estados: você está aqui (âmbar cheio na borda) e onde cada dado para (âmbar tracejado) */
.board-screen .board-gadget .tile.active { background: #142f57; border: 2px solid var(--bp-mark); box-shadow: 3px 3px 0 rgba(8, 20, 40, 0.45); }
.board-screen .board-gadget .tile.tile-target, .board-screen .board-gadget .tile.tile-preview { border: 2px dashed var(--bp-mark); }
/* Faixa do topo por grupo de efeito (texto escuro). Paleta derivada da Okabe-Ito, segura para daltonismo:
   a menor diferença entre duas faixas é ΔE 24 na visão normal, 15 com deuteranopia e 23 com protanopia.
   Casas de mesmo efeito têm a mesma cor; a Oficina de montagem, onde se lança, é a única branca. */
.board-screen .board-gadget .tile .t-band { color: #10213d; border-bottom: 1px solid rgba(8, 20, 40, 0.5); font-weight: 600; }
.board-screen .board-gadget .tile .t-band-dir { color: #10213d; }
.board-screen .board-gadget .tile-workshop .t-band { background: #ffffff; }
.board-screen .board-gadget .tile-shop .t-band { background: #6aaee6; }
.board-screen .board-gadget .tile-event .t-band { background: #f6a04d; }
.board-screen .board-gadget .tile-lot .t-band { background: #b9bfcc; }
.board-screen .board-gadget .tile-funds .t-band, .board-screen .board-gadget .tile-tech .t-band, .board-screen .board-gadget .tile-catchup .t-band,
.board-screen .board-gadget .tile-repair .t-band, .board-screen .board-gadget .tile-start .t-band { background: #4fbf94; }
.board-screen .board-gadget .tile.tile-neg .t-band { background: #cf6f9e; }
.board-screen .board-gadget .tile-spy .t-band { background: #f3ea8f; }
/* terreno com prédio: a faixa ganha a cor do dono */
.board-screen .board-gadget .tile.owned.o0 .t-band { background: #8fb8f2; }
.board-screen .board-gadget .tile.owned.o1 .t-band { background: #f0cf7a; }
.board-screen .board-gadget .tile.owned.o2 .t-band { background: #8fdcb8; }
.board-screen .board-gadget .tile.owned.o3 .t-band { background: #f3a98a; }
/* Oficina de montagem: a casa mais importante ganha também a borda inteira em branco */
.board-screen .board-gadget .tile-workshop:not(.active):not(.tile-target) { border-color: #f2f6ff; }
.board-screen .board-gadget .t-target-pill { background: var(--bp-mark); color: #14233d; border: 0; border-radius: 0; box-shadow: none; }
.board-screen .board-gadget .pawn { border-width: 1px; box-shadow: 0 0 0 2px var(--bp-paper); }

/* miolo: diagrama orbital em traço, atrás dos dados */
.board-screen .board-gadget .ring-center { background: transparent; border: 1px solid var(--bp-line); border-radius: 0; box-shadow: none; }
.board-screen .board-gadget .ring-center > .center-orbits { position: absolute; inset: 0; z-index: 0; pointer-events: none; display: grid; place-items: center; color: var(--bp-ink); opacity: 0.32; }
.center-orbits svg { width: 100%; height: 100%; display: block; }
.board-screen .board-gadget .gadget-banner-plate {
  background: var(--bp-paper); color: var(--bp-ink); border: 1px solid var(--bp-ink-2); border-radius: 0;
  padding: 6px 12px; box-shadow: none; transform: none; letter-spacing: 0.1em; font-weight: 500;
}
.board-screen .board-gadget .ring-center .label { color: var(--bp-ink-2); }
.board-screen .board-gadget .court-deck { background: var(--bp-paper); border: 1px dashed var(--bp-ink-2); border-radius: 0; box-shadow: none; transform: rotate(-4deg); }
.board-screen .board-gadget .court-deck .deck-icon { background: transparent; border: 1px solid var(--bp-ink); color: var(--bp-ink); }
.board-screen .board-gadget .court-deck .deck-label { color: var(--bp-ink); }
.board-screen .board-gadget .gb-die { filter: none; }
.board-screen .board-gadget .ring-center button.gb-die-btn { color: var(--bp-ink); }

/* decisões no miolo: ficha branca de engenharia sobre a planta (texto escuro, leitura longa) */
.board-screen .board-gadget .tile-decision, .board-screen .board-gadget .outcome {
  background: #f4f6fa; color: #14233d; border: 1px solid #14233d; border-radius: 0; box-shadow: 4px 4px 0 rgba(10, 22, 44, 0.35);
}
.board-screen .board-gadget .tile-decision .hint, .board-screen .board-gadget .outcome .hint { color: #3c4a63; }
.board-screen .board-gadget .outcome-lesson { background: transparent; color: #3c4a63; }
.board-screen .board-gadget .ring-center button:not(.gb-die-btn) {
  background: #ffffff; color: #14233d; border: 1px solid #14233d; border-radius: 0; box-shadow: none;
  font: 500 12.5px var(--texto); text-transform: none;
}
.board-screen .board-gadget .ring-center button:not(.gb-die-btn):hover:not(:disabled) { background: #e6ecf7; transform: none; }
.board-screen .board-gadget .ring-center button.ghost:not(.gb-die-btn) { background: transparent; border-color: transparent; color: #3c4a63; }
.board-screen .board-gadget .gb-price { color: #835600; }

/* Cartas de decisão e de resultado flutuam centralizadas sobre o miolo, como uma carta posta na mesa:
   fora do fluxo, não esticam as casas do anel; se forem maiores que o miolo, rolam por dentro. */
.board-screen .board-gadget .ring-center { min-height: 0; }
.board-screen .board-gadget .ring-center > .tile-decision,
.board-screen .board-gadget .ring-center > .outcome {
  position: absolute;
  z-index: 3;
  inset: 10px;
  margin: auto;
  width: min(460px, calc(100% - 20px));
  height: fit-content;
  max-height: calc(100% - 20px);
  overflow: auto;
}

    pushLog(state, `${p.name}: Ano novo! Orçamento +${funds} de verba, +${tech} de tecnologia (nível ${p.tech}).`, p.id);
    // Registro estruturado da virada: a UI anima o calendário e mostra o que entrou (só para este jogador).
    state.yearChange = {
      playerId: p.id, round: state.round, year: yearOf(state.round),
      funds, tech, techLevel: p.tech, parts: income.parts, techParts: income.techParts,
    };
  }
}

// Turno do bot: cumpre os degraus cujo ano chegou. Tudo privado (rival escondido).
function botTurn(state) {
  const bot = currentPlayer(state);
  const year = yearOf(state.round);
  const ladder = ladderOf(bot);
  while (bot.step < ladder.length && bot.schedule[bot.step] != null && year >= bot.schedule[bot.step]) {
    const missionId = ladder[bot.step];
    bot.completed.push({ missionId, year, science: 0 });
    bot.bestStage[missionId] = flightPlan(missionId).length;
    bot.step += 1;
    bot.missionId = ladder[bot.step] || null;
    pushLog(state, `${bot.name} cumpriu "${MISSIONS[missionId].name}".`, bot.id);
  }
}

function endTurn(state) {
  const p = currentPlayer(state);
  if (state.sandbox) {
    state.screen = p.flight ? 'flight' : 'workshop';
    return null;
  }
  if (!p.rolled) return 'Role os dados e ande antes de passar a vez.';
  if (state.pendingDilemma) return 'Resolva a carta de dilema antes de passar a vez.';
  if (p.flight?.pending) return 'Decida o imprevisto do voo antes de passar a vez.';
  if (p.flight && !p.flightAdvanced) return 'Sua nave está em voo: avance uma etapa antes de passar a vez.';
  advanceTurn(state);
  return null;
}

// Passa para o próximo jogador humano; o bot joga sozinho no caminho.
function advanceTurn(state) {
  for (;;) {
    state.turn = (state.turn + 1) % state.players.length;
    if (state.turn === 0) {
      endRound(state);
      if (state.gameOver) return;
      state.round += 1;
      if (isNewYear(state.round)) pushLog(state, `Começa o ano de ${yearOf(state.round)}.`);
    }
    startTurn(state);
    if (!currentPlayer(state).bot) break;
    botTurn(state);
  }
  state.screen = humans(state).length > 1 ? 'handoff' : 'board';
}

// Desempate: progresso na escada, depois degraus, depois ciência entregue, depois verba.
function rankKey(p) {
  const prog = ladderProgress(p);
  return [prog.pct, prog.steps, p.completed.reduce((s, c) => s + c.science, 0), p.funds];
}
function compareRank(a, b) {
  const ka = rankKey(a);
  const kb = rankKey(b);
  for (let i = 0; i < ka.length; i += 1) if (ka[i] !== kb[i]) return kb[i] - ka[i];
  return 0;
}

// Fim da rodada: termina antes de declarar vencedor, para todos jogarem o mesmo número de turnos.
function endRound(state) {
  const done = state.players.filter((p) => ladderProgress(p).done);
  const timeUp = state.round >= MAX_ROUNDS;
  if (!done.length && !timeUp) return;
  const pool = done.length ? done : state.players;
  const sorted = [...pool].sort(compareRank);
  state.winners = sorted.filter((p) => compareRank(p, sorted[0]) === 0).map((p) => p.id);
  state.gameOver = true;
  state.endReason = done.length ? 'ladder' : 'time';
  state.screen = 'gameover';
  const names = state.winners.map((id) => state.players[id].name).join(' e ');
  pushLog(state, done.length ? `${names} completou a escada de missões!` : `Fim de ${yearOf(state.round)}: vence quem subiu mais degraus (${names}).`);
}

// ---------------------------------------------------------------- tabuleiro

// Quem está em último na corrida recebe o choque do Sputnik e desconto no upgrade.
function isLastPlayer(state, player) {
  return state.players.every((p) => compareRank(player, p) >= 0);
}

// Rola 2 dados; o jogador escolhe qual usar (IDEIA.md v3: ainda tem sorte, mas ele sente que decidiu).
function rollDice(state, rng = Math.random) {
  const p = currentPlayer(state);
  if (state.sandbox) return 'No modo sandbox não há tabuleiro.';
  if (p.rolled || state.dice) return 'Você já rolou os dados neste turno.';
  state.dice = [rollDie(rng), rollDie(rng)];
  return null;
}

function moveBy(state, index, rng = Math.random) {
  const p = currentPlayer(state);
  if (!state.dice) return 'Role os dados primeiro.';
  const steps = state.dice[index];
  if (!steps) return 'Dado inválido.';
  state.dice = null;
  const moved = movePlayer(p, steps);
  const tile = TILES[moved.position];
  const { player, messages } = applyTile(moved, tile, { isLast: isLastPlayer(state, p) });
  Object.assign(p, player);
  p.rolled = true;
  state.lastRoll = steps;
  pushLog(state, `${p.name} andou ${steps} e parou em "${tile.label}".`, p.id);
  messages.forEach((m) => pushLog(state, `${p.name}: ${m}`, p.id));

  // Retorno imediato: o que a casa deu (casas de decisão e de evento mostram a própria carta).
  if (messages.length) setOutcome(state, p, { title: `Parou em "${tile.label}"`, notes: messages });
  else state.outcome = null;

  if (tile.type === 'workshop') raiseTip(state, p, 'workshop');

  // Fornecedor: até 4 ofertas de blueprint (as do kit do degrau atual vêm primeiro); o jogador escolhe e paga (a 1ª é de graça).
  if (tile.type === 'shop') {
    const offers = makeOffers(p, rng);
    if (offers.length) state.pendingTile = { tileId: tile.id, kind: 'supplier', offers };
    else pushLog(state, `${p.name}: o fornecedor não tem nenhuma blueprint nova para você.`, p.id);
  }

  if (tile.type === 'lot') {
    const lot = state.lots[tile.id];
    if (!lot) state.pendingTile = { tileId: tile.id, kind: 'build' };
    else if (lot.ownerId !== p.id) state.pendingTile = { tileId: tile.id, kind: 'use' };
    else pushLog(state, `${p.name}: este terreno já é seu (${BUILDINGS[lot.buildingId].name}).`, p.id);
  }

  if (tile.type === 'spy') {
    if (state.players.length < 2) pushLog(state, `${p.name}: não há rivais para espionar.`, p.id);
    else if (p.lastSpyYear === yearOf(state.round)) pushLog(state, `${p.name}: o espião já trabalhou este ano.`, p.id);
    else state.pendingTile = { tileId: tile.id, kind: 'spy' };
  }

  // Evento: com a nave em voo vira imprevisto na próxima etapa; em solo, carta de dilema.
  if (tile.type === 'event') {
    if (p.flight) {
      const eventId = pickEvent(rng).id;
      p.flight.tileEvent = eventId;
      pushLog(state, `${p.name}: sua nave em voo vai enfrentar "${FLIGHT_EVENTS[eventId].title}" na próxima etapa.`, p.id);
    } else {
      state.pendingDilemma = { id: pickDilemma(p, rng).id };
    }
  }
  return null;
}

// Atalho: rola e anda com o primeiro dado (usado nos testes).
function rollAndMove(state, rng = Math.random) {
  return rollDice(state, rng) || moveBy(state, 0, rng);
}

// `notes` (opcional) recebe frases para o retorno imediato ao jogador (aposta, boato).
function applyEffect(state, p, e, rng, notes = []) {
  if (e.gamble) {
    const won = rng() < e.gamble.chance;
    pushLog(state, `${p.name}: ${won ? 'deu certo!' : 'deu errado.'}`, p.id);
    notes.push(won ? 'Deu certo!' : 'Deu errado.');
    applyEffect(state, p, won ? e.gamble.win : e.gamble.lose, rng, notes);
    return;
  }
  if (e.funds) p.funds = Math.max(0, p.funds + e.funds);
  if (e.tech) p.tech = Math.max(0, p.tech + e.tech);
  if (e.discount) p.discount = Math.max(p.discount, e.discount);
  if (e.shield) p.shields += e.shield;
  if (e.launchRisk) p.launchRisk = (p.launchRisk || 0) + e.launchRisk;
  if (e.rumor) spreadRumor(state, p, rng, notes);
}

function chooseDilemma(state, index, rng = Math.random) {
  const p = currentPlayer(state);
  const card = DILEMMAS.find((d) => d.id === state.pendingDilemma?.id);
  if (!card) return 'Nenhuma carta de dilema pendente.';
  const option = card.options[index];
  if (!option) return 'Opção inválida.';
  state.pendingDilemma = null;
  pushLog(state, `${p.name} — ${card.title}: "${option.label}". ${option.lesson}`, p.id);
  const before = statsOf(p);
  const notes = [];
  applyEffect(state, p, option.effect, rng, notes);
  const after = statsOf(p);
  setOutcome(state, p, {
    title: card.title,
    choice: option.label,
    changes: changesBetween(before, after),
    notes: [...notes, ...extrasBetween(before, after)],
    lesson: option.lesson,
  });
  return null;
}

// Boato: informação vaga sobre um rival, às vezes errada.
function spreadRumor(state, p, rng, notes = []) {
  const rivals = state.players.filter((r) => r.id !== p.id);
  if (!rivals.length) return;
  const rival = rivals[Math.floor(rng() * rivals.length)];
  const total = ladderOf(rival).length;
  const truth = rng() < RUMOR_TRUTH;
  const shown = truth ? rival.step : Math.max(0, Math.min(total, rival.step + (rng() < 0.5 ? -1 : 1)));
  p.intel[rival.id] = { year: yearOf(state.round), rumor: true, steps: shown, total };
  const text = `Boato: dizem que ${rival.name} já cumpriu ${shown} de ${total} degraus. Pode não ser verdade.`;
  pushLog(state, text, p.id);
  notes.push(text);
}

// Espionagem: paga e vê o estado real de um rival (degrau atual e quanto a nave está pronta).
// Sabotar em vez de observar (mesma casa, mesma ação anual). Contra um jogador arma uma "interferência na telemetria"
// que chega na etapa final do voo dele; contra o bot do solo atrasa o próximo degrau dele em 1 ano.
function sabotage(state, rivalId) {
  const p = currentPlayer(state);
  if (state.pendingTile?.kind !== 'spy') return 'Você não está na casa de espionagem.';
  const rival = state.players.find((r) => r.id === rivalId && r.id !== p.id);
  if (!rival) return 'Rival inválido.';
  if (p.funds < SABOTAGE_COST) return `Verba insuficiente: a sabotagem custa ${SABOTAGE_COST}.`;
  if (rival.interference) return `${rival.name} já tem uma sabotagem armada: espere ela chegar.`;
  if (rival.bot && (rival.step >= ladderOf(rival).length || rival.schedule[rival.step] == null)) return `${rival.name} não tem mais um degrau para atrasar.`;
  if (rival.bot && rival.delayedStep === rival.step) return `${rival.name} já foi atrasada neste degrau: sabotar de novo o adiaria sem fim.`;
  p.funds -= SABOTAGE_COST;
  p.lastSpyYear = yearOf(state.round);
  state.pendingTile = null;
  let note;
  if (rival.bot) {
    rival.schedule[rival.step] += 1;
    rival.delayedStep = rival.step; // só um atraso por degrau (senão, 1 sabotagem por ano o seguraria para sempre)
    note = `O próximo degrau de ${rival.name} atrasou 1 ano.`;
  } else {
    rival.interference = { fromId: p.id, year: yearOf(state.round) };
    note = `A interferência vai atingir a telemetria de ${rival.name} na etapa final do voo dele, se ele voar neste ano.`;
  }
  pushLog(state, `${p.name} pagou ${SABOTAGE_COST} ao espião para sabotar ${rival.name}.`, p.id);
  setOutcome(state, p, {
    title: `Sabotagem: ${rival.name}`,
    changes: [{ label: 'Verba', value: -SABOTAGE_COST }],
    notes: [note, 'Sabotar custa verba e uma ação de espião; o rival pode se proteger pagando a rede de reserva.'],
  });
  return null;
}

function spyOn(state, rivalId) {
  const p = currentPlayer(state);
  if (state.pendingTile?.kind !== 'spy') return 'Você não está na casa de espionagem.';
  const rival = state.players.find((r) => r.id === rivalId && r.id !== p.id);
  if (!rival) return 'Rival inválido.';
  if (p.funds < SPY_COST) return `Verba insuficiente: o espião custa ${SPY_COST}.`;
  p.funds -= SPY_COST;
  p.lastSpyYear = yearOf(state.round);
  p.intel[rival.id] = spyReport(state, rival);
  state.pendingTile = null;
  pushLog(state, `${p.name} pagou ${SPY_COST} ao espião para observar ${rival.name}.`, p.id);
  const r = p.intel[rival.id];
  const ship = r.inFlight ? `nave em voo (etapa ${r.stage + 1} de ${r.stages})` : r.ready != null ? `nave ${Math.round(r.ready * 100)}% pronta` : r.note || '';
  setOutcome(state, p, {
    title: `Espião: ${rival.name}`,
    changes: [{ label: 'Verba', value: -SPY_COST }],
    notes: [`${r.steps} de ${r.total} degraus cumpridos${r.mission ? `, mirando "${r.mission}"` : ''}${ship ? `; ${ship}` : ''}.`, 'O relatório fica guardado na aba Rivais.'],
  });
  return null;
}

function spyReport(state, rival) {
  const ladder = ladderOf(rival);
  const report = {
    year: yearOf(state.round),
    rumor: false,
    steps: rival.step,
    total: ladder.length,
    mission: rival.missionId ? MISSIONS[rival.missionId].name : null,
  };
  if (rival.bot) return { ...report, note: 'Segue o próprio calendário; não dá para ver a oficina.' };
  if (rival.flight) {
    return { ...report, mission: MISSIONS[rival.flight.missionId].name, inFlight: true, stage: rival.flight.stageIndex, stages: rival.flight.plan.length };
  }
  const checks = checkDesign(rival, { evaluate: true }).checks.filter((c) => c.hard); // o espião vê a verdade
  return { ...report, ready: checks.length ? checks.filter((c) => c.ok).length / checks.length : 0 };
}

// Terreno livre: constrói um prédio novo (nível 1). Upgrade depois é de qualquer lugar.
function buildOnLot(state, buildingId) {
  const p = currentPlayer(state);
  const pending = state.pendingTile;
  if (!pending || pending.kind !== 'build') return 'Você não está num terreno livre.';
  if (!BUILDINGS[buildingId]) return 'Prédio desconhecido.';
  if (p.buildings[buildingId] > 0) return `Você já tem ${BUILDINGS[buildingId].name}. Suba o nível no painel da agência.`;
  const cost = upgradeCost(0);
  if (p.funds < cost) return `Verba insuficiente: construir custa ${cost}.`;
  p.funds -= cost;
  p.buildings[buildingId] = 1;
  state.lots[pending.tileId] = { ownerId: p.id, buildingId };
  state.pendingTile = null;
  pushLog(state, `${p.name} construiu ${BUILDINGS[buildingId].name} num terreno.`);
  setOutcome(state, p, {
    title: `Construiu ${BUILDINGS[buildingId].name}`,
    changes: [{ label: 'Verba', value: -cost }],
    notes: [BUILDINGS[buildingId].effect, 'Suba o nível na aba Sua agência.'],
  });
  return null;
}

const useFeeFor = (level) => USE_FEE + 2 * (level - 1);

// Prédio de outro jogador: paga a taxa ao dono e recebe o efeito uma vez. Os dois ganham.
function useRivalBuilding(state, rng = Math.random) {
  const p = currentPlayer(state);
  const pending = state.pendingTile;
  if (!pending || pending.kind !== 'use') return 'Não há prédio de rival para usar aqui.';
  const lot = state.lots[pending.tileId];
  const owner = state.players[lot.ownerId];
  const building = BUILDINGS[lot.buildingId];
  const fee = useFeeFor(owner.buildings[lot.buildingId]);
  if (p.funds < fee) return `Verba insuficiente: a taxa é ${fee}.`;
  const before = statsOf(p);
  p.funds -= fee;
  owner.funds += fee;
  applyEffect(state, p, building.useEffect, rng); // `rng` injetável: o simulador (scripts/simulate.mjs) repete partidas
  state.pendingTile = null;
  pushLog(state, `${p.name} pagou ${fee} a ${owner.name} para usar o ${building.name}.`);
  const after = statsOf(p);
  setOutcome(state, p, {
    title: `Usou ${building.name} de ${owner.name}`,
    changes: changesBetween(before, after),
    notes: [...extrasBetween(before, after), `${owner.name} recebeu ${fee}: os dois saem ganhando.`],
  });
  return null;
}

function skipTile(state) {
  state.pendingTile = null;
  return null;
}

// Fornecedor: compra uma das ofertas da visita. A blueprint é pesquisa (paga uma vez, vale para sempre); a peça física
// ainda é paga na oficina. A PRIMEIRA blueprint da partida é de graça. A visita continua aberta até acabarem as ofertas
// ou o jogador seguir (skipTile).
function buyBlueprint(state, itemId) {
  const p = currentPlayer(state);
  const pending = state.pendingTile;
  if (!pending || pending.kind !== 'supplier') return 'Você não está num fornecedor.';
  if (!pending.offers.includes(itemId)) return 'Esse item não está nas ofertas desta visita.';
  const free = !p.freeBlueprintUsed;
  const price = blueprintCostFor(p, itemId);
  if (p.funds < price) return `Verba insuficiente: a blueprint custa ${price}.`;
  p.funds -= price;
  p.freeBlueprintUsed = true;
  discover(p, [itemId]);
  pending.offers = pending.offers.filter((id) => id !== itemId);
  if (!pending.offers.length) state.pendingTile = null;
  pushLog(state, `${p.name} conseguiu a blueprint de ${nameOf(itemId)}${free ? ' (a primeira é de graça)' : ` por ${price}`}.`, p.id);
  setOutcome(state, p, {
    title: `Blueprint: ${nameOf(itemId)}`,
    changes: price ? [{ label: 'Verba', value: -price }] : [],
    notes: [free ? 'A primeira blueprint é de graça.' : 'A blueprint vale para sempre.', 'Agora você pode comprar essa peça (ou escolher esse foguete) na oficina.'],
  });
  raiseTip(state, p, 'blueprint', itemId);
  return null;
}

function upgradeBuilding(state, buildingId) {
  const p = currentPlayer(state);
  if (state.sandbox) return 'Prédios não existem no modo sandbox.';
  const level = p.buildings[buildingId];
  if (!level) return 'Construa este prédio num terreno livre primeiro.';
  if (level >= MAX_LEVEL) return 'Este prédio já está no nível máximo.';
  const cost = upgradeCostFor(state, p, buildingId);
  if (p.funds < cost) return `Verba insuficiente: o upgrade custa ${cost}.`;
  p.funds -= cost;
  p.buildings[buildingId] = level + 1;
  pushLog(state, `${p.name} subiu ${BUILDINGS[buildingId].name} para o nível ${level + 1} por ${cost}.`, p.id);
  // Retorno imediato: o clique em "subir" mostra o custo e o que o novo nível rende.
  setOutcome(state, p, {
    title: `${BUILDINGS[buildingId].name}: nível ${level + 1} de ${MAX_LEVEL}`,
    changes: [{ label: 'Verba', value: -cost }],
    notes: [BUILDINGS[buildingId].effect, level + 1 >= MAX_LEVEL ? 'Nível máximo.' : `Próximo nível: ${upgradeCostFor(state, p, buildingId)} de verba.`],
  });
  return null;
}

// Quem está em último paga metade no upgrade (freio contra bola de neve).
function upgradeCostFor(state, player, buildingId) {
  const base = upgradeCost(player.buildings[buildingId]);
  const behind = state.players.length > 1 && isLastPlayer(state, player);
  return behind ? Math.round(base * CATCHUP_UPGRADE_DISCOUNT) : base;
}

// Sem eliminação: com pouca verba, a agência pede socorro e perde tecnologia.
function requestBailout(state) {
  const p = currentPlayer(state);
  if (p.funds >= BAILOUT_LIMIT) return `Socorro só com menos de ${BAILOUT_LIMIT} de verba.`;
  p.funds += BAILOUT_FUNDS;
  // Piso de tecnologia 1: toda peça exige pelo menos 1. Com a pesquisa básica de 2 em 2 anos, descer a 0 trancaria a
  // agência fora da oficina por até 2 anos, e o socorro de emergência não pode ser uma armadilha.
  const lost = Math.min(BAILOUT_TECH_COST, Math.max(0, p.tech - TECH_FLOOR));
  p.tech -= lost;
  p.bailouts += 1;
  pushLog(state, `${p.name} pediu socorro de emergência: +${BAILOUT_FUNDS} de verba${lost ? `, −${lost} de tecnologia` : ' (sem perder tecnologia: já está no mínimo)'}.`, p.id);
  return null;
}

// ---------------------------------------------------------------- missão e oficina

// Só no sandbox: no jogo normal a missão é o degrau atual da escada.
function chooseMission(state, missionId) {
  const p = currentPlayer(state);
  if (!state.sandbox) return 'A missão é o próximo degrau da escada do seu lado.';
  if (!MISSIONS[missionId]) return 'Missão desconhecida.';
  if (p.flight) return 'Espere a nave em voo terminar a missão antes de trocar.';
  p.missionId = missionId;
  pushLog(state, `${p.name} escolheu a missão "${MISSIONS[missionId].name}".`, p.id);
  checkMilestones(state, p);
  return null;
}

function buyItem(state, itemId) {
  const p = currentPlayer(state);
  const locked = inFlightLock(state, p) || workshopLock(state, p);
  if (locked) return locked;
  const item = CATALOG[itemId];
  if (!isDiscovered(p, item)) return `${item.name}: você ainda não tem a blueprint. Pare numa casa de Fornecedor do tabuleiro para consegui-la.`;
  if (isLocked(p, item)) return `${item.name} exige tecnologia ${requiredTech(p, item)} (você tem ${p.tech}).`;
  const price = priceFor(p, itemId);
  if (p.funds < price) return `Verba insuficiente: ${item.name} custa ${price}.`;
  p.funds -= price;
  const bucket = INSTRUMENTS[itemId] ? p.spacecraft.instruments : p.spacecraft.parts;
  bucket.push(itemId);
  pushLog(state, `${p.name} comprou ${item.name} por ${price}.`, p.id);
  raiseTip(state, p, 'part');
  p.discount = 0; // desconto de evento vale para uma compra (a Fábrica é permanente)
  checkMilestones(state, p);
  return null;
}

// Antes de voar, revende pelo valor cheio (regra do IDEIA.md).
function sellItem(state, itemId) {
  const p = currentPlayer(state);
  const locked = inFlightLock(state, p) || workshopLock(state, p);
  if (locked) return locked;
  const bucket = INSTRUMENTS[itemId] ? p.spacecraft.instruments : p.spacecraft.parts;
  const idx = bucket.indexOf(itemId);
  if (idx === -1) return 'Item não está na espaçonave.';
  bucket.splice(idx, 1);
  const refund = refundFor(itemId); // sucata: metade do custo base (sim/resources.js)
  p.funds += refund;
  pushLog(state, `${p.name} revendeu ${CATALOG[itemId].name} como sucata por ${refund}.`, p.id);
  return null;
}

function chooseLauncher(state, launcherId) {
  const p = currentPlayer(state);
  const locked = inFlightLock(state, p) || workshopLock(state, p);
  if (locked) return locked;
  const launcher = LAUNCHERS[launcherId];
  if (!isDiscovered(p, launcher)) return `${launcher.name}: você ainda não tem a blueprint. Pare numa casa de Fornecedor do tabuleiro para consegui-la.`;
  if (isLocked(p, launcher)) return `${launcher.name} exige tecnologia ${requiredTech(p, launcher)} (você tem ${p.tech}).`;
  p.spacecraft.launcherId = launcherId;
  checkMilestones(state, p);
  return null;
}

function chooseOrbit(state, orbitId) {
  const p = currentPlayer(state);
  const locked = inFlightLock(state, p) || workshopLock(state, p);
  if (locked) return locked;

// Bônus só uma vez por missão (chave `${missionId}:${milestoneId}`). Efeitos: funds, discount, shield.
function grant(state, player, milestoneId, missionId = player.missionId) {
  const key = `${missionId}:${milestoneId}`;
  if (!missionId || player.milestones.includes(key)) return;
  const ms = MISSIONS[missionId].milestones.find((m) => m.id === milestoneId);
  player.milestones.push(key);
  if (ms.effect.type === 'funds') player.funds += ms.effect.value;
  if (ms.effect.type === 'discount') player.discount = Math.max(player.discount, ms.effect.value);
  if (ms.effect.type === 'shield') player.shields += ms.effect.value;
  pushLog(state, `${player.name} atingiu "${ms.name}" (${describeEffect(ms.effect)}).`, player.id);
}

function describeEffect(effect) {
  if (effect.type === 'funds') return `+${effect.value} de verba`;
  if (effect.type === 'discount') return `${effect.value}% de desconto na próxima compra`;

    plan: flightPlan(missionId),

    tileEvent: null,

function chooseStageOption(state, index, rng = Math.random) {

  if (option.disabled) return 'Verba insuficiente para esta opção.';

// Sorteia a etapa. Proteção absorve uma falha. Falha = nave perdida + dados de falha (+ consolação).
function resolveStage(state, p, stageId, risk, info, rng) {
  const stage = STAGES[stageId];

  let usedShield = false;
  if (failed && p.shields > 0) {
    p.shields -= 1;
    usedShield = true;
    failed = false;
  }
  const record = {
    stageId,
    name: stage.name,
    risk: risk.total,
    riskText: describeRisk(risk),
    causes: risk.parts.filter((x, i) => i > 0 && x.value > 0).map((x) => x.text),
    success: !failed,
    usedShield,
    eventTitle: info.event?.title || null,
    choice: info.label,
    lesson: info.lesson || null,
    effect: info.effect || {},
  };
  p.flight.stages.push(record);
  p.flight.last = record;

  state.screen = 'flight';

    missionId: flight.missionId,

    else if (k === 'html') node.innerHTML = v;
    else node.setAttribute(k, v);
  }
  for (const child of [].concat(children)) {
    if (child == null || child === false) continue;
    node.appendChild(typeof child === 'string' || typeof child === 'number' ? document.createTextNode(String(child)) : child);
  }
  return node;
}

function button(label, onclick, opts = {}) {
  const b = el('button', { class: opts.class || '', onclick, title: opts.title }, label);
  if (opts.disabled) b.disabled = true;
  return b;
}

// Ícones por tipo visual de peça (ver campo `visual` em data/parts.js e data/instruments.js).
// Os nomes são chaves de ICONS em ui/icons.js.
const ITEM_ICONS = {
  camera: 'camera', camera_large: 'telescope', spectro: 'prism', boom: 'magnet', beacon: 'beacon',
  panel: 'solar', panel_large: 'sun', battery: 'battery', antenna: 'signal', dish: 'dish', thruster: 'flame', capsule: 'capsule',
};
const MISSION_ICONS = { first_satellite: 'satellite', living_being: 'paw', weather_watch: 'cloud', lunar_probe: 'moon', space_station: 'station', crewed_moon: 'helmet' };
const missionIcon = (id, opts) => icon(MISSION_ICONS[id] || 'rocket', opts);

function avatar(player, size) {
  return el('span', { class: `avatar c${player.id % 4}`, style: size ? `width:${size}px;height:${size}px` : null },
    player.bot ? icon('robot', { size: size ? Math.round(size * 0.6) : 20, label: 'Bot' }) : player.name[0].toUpperCase());

// Nome do lado como texto (para frases) e como selo com ícone (para a interface).
const sideLabel = (p) => SIDES[p.side]?.name || '';
const sideBadge = (p) => (SIDES[p.side] ? [icon(SIDES[p.side].icon, { size: 15 }), SIDES[p.side].name] : '');

// Interface enxuta no começo (menos informação de uma vez): vale enquanto o jogador ainda não cumpriu
// nenhum degrau e deixou as dicas ligadas. Cumprir o 1º degrau, desligar as dicas ou jogar o sandbox
// mostra tudo. Só muda o que aparece; nenhuma regra do jogo depende disso.
function simpleUi(state, player) {
  return !state.sandbox && guideOn() && player.step === 0 && player.completed.length === 0;
}

// Barra superior: ano, quem joga, lado, degrau, verba, tecnologia e em que etapa do ciclo está.
// Com `actions`, mostra também o botão que liga e desliga as dicas.
function hud(state, player, step, actions = null) {
  const simple = simpleUi(state, player);
  const mission = MISSIONS[player.flight?.missionId || player.missionId];
  const prog = ladderProgress(player);
  const steps = state.sandbox ? ['workshop', 'flight', 'report'] : ['board', 'workshop', 'flight', 'report'];
  const names = { board: 'Tabuleiro', workshop: 'Oficina', flight: 'Voo', report: 'Relatório' };
  const roundInYear = ((state.round - 1) % ROUNDS_PER_YEAR) + 1;
  // Recursos sempre à vista, em números grandes, com a previsão do próximo Ano novo (de onde vem o recurso).
  // Na interface enxuta a previsão fica só no balão, para não somar texto no começo.
  const roundsLeft = ROUNDS_PER_YEAR - ((state.round - 1) % ROUNDS_PER_YEAR);
  const income = state.sandbox || !player.side ? null : yearlyIncome(player, yearOf(state.round + roundsLeft)); // o próximo Ano novo
  const when = `em ${roundsLeft} ${roundsLeft === 1 ? 'rodada' : 'rodadas'}`;
  const stat = (cls, iconName, label, value, title, next = null) => el('div', { class: `stat ${cls}`, title }, [
    icon(iconName, { size: 22, label }),
    el('div', { class: 'stat-body' }, [
      el('span', { class: 'stat-num num' }, value),
      el('span', { class: 'stat-label' }, label),
      next && !simple ? el('small', { class: 'stat-next' }, next) : null,
    ]),
  ]);
  return el('div', { class: 'hud' }, [
    state.sandbox ? el('span', { class: 'chip' }, [icon('flask', { size: 15 }), 'sandbox'])
      : el('span', { class: 'chip year', title: `Rodada ${roundInYear} de ${ROUNDS_PER_YEAR} deste ano` }, [icon('calendar', { size: 15 }), el('span', { class: 'num' }, yearOf(state.round)), simple ? null : el('small', {}, `rodada ${roundInYear}/${ROUNDS_PER_YEAR}`)]),
    el('div', { class: 'who' }, [avatar(player), player.name]),
    player.side ? el('span', { class: 'chip' }, sideBadge(player)) : null,
    el('span', { class: 'chip' }, mission
      ? [missionIcon(mission.id, { size: 15 }), state.sandbox ? mission.name : `Degrau ${Math.min(prog.steps + 1, prog.total)}/${prog.total}: ${mission.name}`, player.flight ? ', em voo' : '']
      : state.sandbox ? [icon('target', { size: 15 }), 'escolhendo missão'] : [icon('flag', { size: 15 }), 'escada completa']),
    stat('funds', 'coins', 'Verba', player.funds,
      income ? `Verba. No próximo Ano novo entram +${income.funds} (${Object.entries({ orçamento: income.parts.base, lado: income.parts.side, Patrocinador: income.parts.sponsor }).filter(([, v]) => v).map(([k, v]) => `${k} ${v > 0 ? '+' : ''}${v}`).join(', ')}).` : 'Verba',
      income ? `+${income.funds} ${when}` : null),
    state.sandbox ? null : stat('tech', 'chip', 'Tecnologia', player.tech,
      income ? `Tecnologia: desbloqueia peças e foguetes melhores. No próximo Ano novo entram +${income.tech}${income.techParts.base ? '' : ' (a pesquisa básica vem de 2 em 2 anos: só o Laboratório rende)'}.` : 'Tecnologia: desbloqueia peças e foguetes melhores',
      income ? `+${income.tech} ${when}` : null),
    player.shields || (!simple && !state.sandbox) ? stat('shield', 'shield', 'Proteções', player.shields, 'Proteções contra falha: cada uma salva uma etapa do voo que falharia.') : null,
    actions ? turnClock(state) : null,
    el('span', { class: 'spacer' }),
    // Sem `actions` (tela só de leitura) a trilha de etapas fica no topo; com `actions` ela vira a navegação
    // da barra lateral.
    !actions && !simple ? el('div', { class: 'steps' }, steps.map((s) => el('span', { class: s === step ? 'on' : '' }, names[s]))) : null,
    actions ? sideRail(state, player, step, actions, steps, names, simple) : null,
  ]);
}

// Barra lateral fixa (padrão de aplicativos de trabalho: navegação em cima, utilidades embaixo).
// Em cima, as telas da partida (a atual marcada; Voo e Relatório só acendem quando a partida está neles).
// Embaixo: regras, dicas, tema e sair.
const RAIL_ICONS = { board: 'die', workshop: 'wrench', flight: 'rocket', report: 'clipboard' };
function sideRail(state, player, step, actions, steps, names, simple) {
  const item = (iconName, label, title, run, cls = '') => el('button', { type: 'button', class: `rail-item ${cls}`, title, onclick: run }, [icon(iconName, { size: 20 }), el('span', { class: 'rail-label' }, label)]);
  const canNavigate = !(step === 'flight' && player.flight?.pending); // decisão de voo pendente: resolva antes
  // Com a nave em voo a oficina fica fechada (sim/actions.js, inFlightLock): o atalho some da barra.
  const navSteps = steps.filter((s) => !(s === 'workshop' && player.flight && !state.sandbox && step !== 'workshop'));
  const nav = navSteps.map((s) => {
    const current = s === step;
    const b = item(RAIL_ICONS[s], names[s], names[s], () => { if (!current) actions.go(s); }, current ? 'on' : '');
    if (current) b.setAttribute('aria-current', 'page');
    else if (!canNavigate || s === 'flight' || s === 'report') b.disabled = true;
    return b;
  });
  const guide = item('compass', 'Dicas', guideOn() ? 'Dicas ligadas: orientação passo a passo e interface enxuta no começo. Clique para desligar.' : 'Ligar as orientações e a interface enxuta no começo', () => actions.toggleGuide(), `guide-toggle ${guideOn() ? 'on-soft' : ''}`);
  guide.setAttribute('aria-pressed', String(guideOn()));
  const theme = themeToggle();
  theme.className = 'rail-item theme-toggle';
  return el('nav', { class: 'side-rail', 'aria-label': 'Navegação da partida' }, [
    el('span', { class: 'rail-brand', 'aria-hidden': 'true' }, icon('rocket', { size: 20 })),
    // a classe `steps` (trilha de etapas) só entra fora da interface enxuta (test/ui-simple.test.mjs)
    el('div', { class: simple ? 'rail-nav' : 'rail-nav steps' }, nav),
    el('span', { class: 'rail-spacer' }),
    item('bulb', 'Regras', 'Como funciona: regras, lados e glossário', () => openRulesModal()),
    guide,
    theme,
    item('arrowLeft', 'Sair', 'Sair da partida e voltar à tela inicial', () => openExitDialog(actions), 'rail-exit'),
  ]);
}

// Sair da partida: confirmação própria (o navegador não mostra confirm() dentro do visualizador).
// Online, sai também da sala; se for o anfitrião, a partida termina para todos.
function openExitDialog(actions) {
  const close = () => { backdrop.remove(); document.removeEventListener('keydown', onKey); };
  const onKey = (e) => { if (e.key === 'Escape') close(); };
  const online = Boolean(actions.isOnline && actions.isOnline());
  const leave = () => {
    close();
    if (online) actions.lobby.leave();
    actions.newGame();
  };
  const backdrop = el('div', { class: 'modal-backdrop', onclick: close }, [
    el('div', { class: 'modal exit-dialog', role: 'dialog', 'aria-label': 'Sair da partida', onclick: (e) => e.stopPropagation() }, [
      el('h2', { class: 'modal-title' }, 'Sair da partida?'),
      el('p', {}, online
        ? 'Você sai da sala online e volta à tela inicial. Se for o anfitrião, a partida termina para todos.'
        : 'Você volta à tela inicial e o progresso desta partida é perdido.'),
      el('div', { class: 'row modal-actions' }, [
        button('Sair da partida', leave, { class: 'danger' }),
        button('Continuar jogando', close, { class: 'primary' }),
      ]),
    ]),
  ]);
  document.addEventListener('keydown', onKey);
  document.body.appendChild(backdrop);
}

// Modal "Como funciona": passos da partida, lados e escadas, glossário. Abre pela tela inicial e pelo menu.
function openRulesModal() {
  const close = () => backdrop.remove();
  const backdrop = el('div', { class: 'modal-backdrop', onclick: close }, [
    el('div', { class: 'modal rules-modal', onclick: (e) => e.stopPropagation() }, [
      el('div', { class: 'modal-head', style: 'justify-content:space-between' }, [
        el('h2', { class: 'modal-title' }, 'Como funciona a partida'),
        button(icon('x', { size: 16 }), close, { class: 'small ghost', title: 'Fechar' }),
      ]),
      el('div', { class: 'steps-grid', style: 'margin-top:12px' }, [
        el('div', { class: 'panel step' }, [el('span', { class: 'n' }, '01'), el('strong', { class: 'with-icon' }, [icon('die', { size: 16 }), 'Tabuleiro']), el('p', {}, `Role 2 dados e escolha 1. A cada ${ROUNDS_PER_YEAR} rodadas, um ano novo traz verba e tecnologia.`)]),
        el('div', { class: 'panel step' }, [el('span', { class: 'n' }, '02'), el('strong', { class: 'with-icon' }, [icon('wrench', { size: 16 }), 'Oficina']), el('p', {}, 'Monte a nave do próximo degrau respeitando massa, energia, dados e verba.')]),
        el('div', { class: 'panel step' }, [el('span', { class: 'n' }, '03'), el('strong', { class: 'with-icon' }, [icon('rocket', { size: 16 }), 'Voo']), el('p', {}, 'Avance uma etapa por turno. Se falhar, ainda resta uma missão de consolação.')]),
      ]),
      el('h3', { style: 'margin:18px 0 8px' }, 'Lados e escadas (sorteados no início)'),
      el('div', { class: 'cards sides' }, Object.values(SIDES).map((s) => el('div', { class: 'card' }, [
        el('div', { class: 'card-head' }, [el('span', { class: 'icon' }, icon(s.icon, { size: 20 })), el('strong', {}, s.name), el('small', { class: 'hint' }, s.focus)]),
        el('ol', { class: 'ladder compact' }, s.ladder.map((m) => el('li', { class: 'with-icon' }, [missionIcon(m, { size: 15 }), MISSIONS[m].name]))),
        el('small', { class: 'gain-text' }, `+ ${s.advantage}`),
        el('small', { class: 'lose-text' }, `− ${s.weakness}`),
      ]))),
      glossary(),
      el('p', { class: 'hint', style: 'margin-top:14px' }, 'Baseado no processo de design de missões da NASA (Need → Concept → Requirements → Design → Verify → Implement) e na atividade Marsbound do JPL. Datas históricas: NASA History. Os números do jogo são fictícios, criados para o aprendizado.'),
    ]),

// Botão que alterna entre o tema Claro (papel quente Íris) e Escuro (grafite neutro Íris).
function themeToggle() {
  const renderContent = (b) => {
    const dark = themeOf() === 'escuro';
    b.innerHTML = '';
    b.appendChild(icon(dark ? 'sun' : 'moon', { size: 15 }));
    b.appendChild(document.createTextNode(dark ? 'Claro' : 'Escuro'));
    b.setAttribute('aria-pressed', String(dark));
    b.title = dark ? 'Mudar para o tema claro (papel técnico)' : 'Mudar para o tema escuro (grafite)';
  };
  const b = el('button', {
    class: 'small ghost theme-toggle',
    onclick: () => { toggleTheme(); renderContent(b); },
  });
  renderContent(b);
  return b;
}

// Botão que liga e desliga as orientações (preferência salva no navegador).
function guideToggle(actions) {
  const on = guideOn();
  const b = button([icon('compass', { size: 16 }), on ? 'Dicas: ligadas' : 'Dicas: desligadas'], () => actions.toggleGuide(), {
    class: `small ghost guide-toggle ${on ? 'on' : ''}`,
    title: on ? 'Dicas ligadas: orientação passo a passo e interface enxuta no começo. Desligue para ver tudo.' : 'Ligar as orientações e a interface enxuta no começo',
  });
  b.setAttribute('aria-pressed', String(on));
  return b;
}

// Título de painel com ícone.
const panelTitle = (iconName, text) => el('h3', { class: 'panel-title' }, [icon(iconName, { size: 18 }), text]);

// Aba expansível da lateral: cabeçalho clicável (abre/fecha) + corpo. O estado fica salvo por `id`,
// então cada jogador escolhe o que deixa aberto. `hint` é um subtítulo curto, sempre visível.
// Como toda a tela é redesenhada a cada ação, o abrir/fechar guarda a preferência em vez de re-render.
function sidePanel(id, iconName, title, children, { defaultOpen = true, hint = null, extraClass = '' } = {}) {
  const d = el('details', { class: `panel collapsible ${extraClass}`.trim() }, [
    el('summary', { class: 'panel-head' }, [
      icon(iconName, { size: 18, className: 'head-icon' }),
      el('div', { class: 'head-text' }, [el('strong', {}, title), hint ? el('small', { class: 'hint' }, hint) : null]),
      icon('chevronDown', { size: 16, className: 'chev' }),
    ]),
    el('div', { class: 'panel-body' }, children),
  ]);
  if (panelOpen(id, defaultOpen)) d.open = true;
  d.addEventListener('toggle', () => setPanelOpen(id, d.open));
  return d;
}

function progressBar(fraction, status = 'ok') {
  return el('div', { class: `pbar ${status}` }, [el('div', { class: 'fill', style: `width:${Math.round(Math.max(0, Math.min(1, fraction)) * 100)}%` })]);
}

// Escada de missões do lado do jogador, com o ano em que o lado cumpriu cada degrau na história real.
function ladderPanel(state, player) {
  const ladder = ladderOf(player);
  const prog = ladderProgress(player);
  return sidePanel('ladder', SIDES[player.side]?.icon || 'ladder', `Escada ${sideLabel(player)}`, [
    progressBar(prog.pct, prog.done ? 'done' : 'ok'),
    el('ol', { class: 'ladder' }, ladder.map((m, i) => {
      const done = player.completed.find((c) => c.missionId === m);
      const real = REAL_HISTORY[m].sides[player.side];
      const flying = player.flight?.missionId === m;
      const cls = i < player.step ? 'done' : i === player.step ? 'now' : '';
      const status = done ? `cumprida em ${done.year}` : flying ? `em voo, etapa ${player.flight.stageIndex + 1}/${player.flight.plan.length}` : i === player.step ? 'degrau atual' : '';
      return el('li', { class: cls }, [
        el('span', { class: 'ladder-name' }, [done ? icon('check', { size: 16 }) : missionIcon(m, { size: 16 }), MISSIONS[m].name]),
        el('small', { class: 'hint' }, [status, status ? '. ' : '', `História real: ${real ?? 'nunca'}`]),
      ]);
    })),
    el('p', { class: 'hint' }, 'Cada degrau é uma nave nova. Tecnologia, prédios e verba continuam.'),
  ], { hint: `${prog.steps}/${prog.total} degraus cumpridos` });
}

// Rival escondido (IDEIA.md v3 seção 8): só aparece o que o espião ou os boatos revelaram.
function rivalsPanel(state, player) {
  const rivals = state.players.filter((r) => r.id !== player.id);
  if (!rivals.length) return null;
  return sidePanel('rivals', 'eye', 'Rivais', [
    ...rivals.map((r) => {
      const info = player.intel[r.id];
      let text = 'Estado desconhecido. Caia na Espionagem ou invista em boatos.';
      if (info?.rumor) text = `Boato de ${info.year}: ${info.steps}/${info.total} degraus. Pode estar errado.`;
      else if (info) {
        const ship = info.inFlight ? `nave em voo (etapa ${info.stage + 1}/${info.stages})`
          : info.ready != null ? `nave ${pct(info.ready)} pronta` : info.note || '';
        text = `Espião em ${info.year}: ${info.steps}/${info.total} degraus${info.mission ? `, mirando "${info.mission}"` : ''}; ${ship}.`;
      }
      return el('div', { class: 'race-row' }, [
        el('div', { class: 'row', style: 'margin:0;gap:8px' }, [avatar(r, 26), el('strong', {}, r.name), el('span', { class: 'chip small' }, sideBadge(r))]),
        el('small', { class: `hint ${info && !info.rumor ? 'intel' : ''}` }, text),
        // Público: o lançamento foi anunciado a todos. O resultado do voo e a nave por dentro continuam secretos.
        r.flight ? el('small', { class: 'hint flight-public' }, [icon('rocket', { size: 12 }), 'Nave em voo (anúncio público).']) : null,
      ]);
    }),
  ], { defaultOpen: rivals.some((r) => r.flight), hint: `${rivals.length} ${rivals.length === 1 ? 'rival' : 'rivais'} na corrida${rivals.some((r) => r.flight) ? ', com nave em voo' : ''}` });
}

// Faixa da agência, sempre visível sob o tabuleiro e os botões de ação: os 4 prédios em cartões (nível,
// o que dão e o botão de subir com o custo) e o socorro de emergência. Prédio não construído aparece
// esmaecido, para o jogador ver o que existe. Construir continua sendo num terreno livre do tabuleiro.
function agencyStrip(state, player, actions) {
  const cards = Object.values(BUILDINGS).map((b) => {
    const level = player.buildings[b.id] || 0;
    const built = level > 0;
    const maxed = level >= MAX_LEVEL;
    const cost = built && !maxed ? upgradeCostFor(state, player, b.id) : null;
    return el('div', { class: `building-card${built ? '' : ' not-built'}${maxed ? ' maxed' : ''}` }, [
      el('div', { class: 'bc-head' }, [el('span', { class: 'b-icon' }, icon(b.icon, { size: 22 })), el('strong', {}, b.name)]),
      el('div', { class: 'bc-level' }, built
        ? [el('span', { class: 'pips' }, Array.from({ length: MAX_LEVEL }, (_, i) => el('span', { class: `pip${i < level ? ' on' : ''}` }))), el('span', {}, `nível ${level}/${MAX_LEVEL}`)]
        : el('span', { class: 'hint' }, 'não construído')),
      el('small', { class: 'hint' }, built ? b.effect : `Construa num terreno livre por ${upgradeCost(0)}. ${b.effect}`),
      built && !maxed
        ? button([icon('arrowUp', { size: 14 }), 'Subir ', el('span', { class: 'num' }, cost)], () => actions.upgradeBuilding(b.id), {
          class: 'small upgrade', disabled: player.funds < cost,
          title: player.funds < cost ? `Faltam ${cost - player.funds} de verba para subir ao nível ${level + 1}` : `Subir para o nível ${level + 1} por ${cost}`,
        })
        : null,
      maxed ? el('span', { class: 'badge max' }, 'nível máximo') : null,
    ]);
  });
  return el('section', { class: 'panel agency-strip' }, [
    el('div', { class: 'strip-head' }, [
      panelTitle('building', 'Sua agência'),
      player.funds < BAILOUT_LIMIT
        ? button([icon('lifebuoy', { size: 16 }), `Socorro de emergência (+${BAILOUT_FUNDS} verba, −${BAILOUT_TECH_COST} tec)`], () => actions.requestBailout(), { class: 'small ghost' })
        : null,
    ]),
    el('div', { class: 'building-grid' }, cards),
  ]);
}

// Escolha de missão: só no modo sandbox (no jogo normal a missão é o degrau da escada).
function missionPicker(state, player, actions) {
  return el('div', { class: 'mission-grid' }, Object.values(MISSIONS).map((m) => button([
    el('span', { class: 'icon' }, missionIcon(m.id, { size: 26 })),
    el('strong', {}, m.name),
    el('span', { class: 'diff' }, `${m.difficulty} · ${flightPlan(m.id).length} etapas de voo`),

// Linha do tempo das etapas do voo.
function stageTrack(plan, stages, currentIndex) {
  return el('ol', { class: 'stage-track' }, plan.map((id, i) => {
    const rec = stages[i];
    const cls = rec ? (rec.success ? 'done' : 'fail') : i === currentIndex ? 'now' : '';
    const glyph = rec ? (rec.success ? 'check' : 'x') : STAGES[id].icon;
    return el('li', { class: cls }, [el('span', { class: 's-icon' }, icon(glyph, { size: 15 })), el('span', {}, STAGES[id].name)]);
  }));
}

// Retorno imediato: o que acabou de acontecer (escolha do dilema, o que a casa deu, espião, prédio).
// Fica no centro sem pedir confirmação e some no próximo turno (state.outcome, ver sim/actions.js).
function outcomeCard(state, p) {
  const o = state.outcome;
  if (!o || o.playerId !== p.id || state.pendingDilemma) return null;
  return el('div', { class: 'outcome' }, [
    el('strong', { class: 'decision-title' }, [icon('check', { size: 18 }), o.title]),
    o.choice ? el('small', { class: 'hint' }, `Você escolheu: ${o.choice}`) : null,
    o.changes.length ? el('div', { class: 'delta-row' }, o.changes.map((c) => el('span', { class: `delta ${c.value > 0 ? 'up' : 'down'}` }, [
      `${c.label} `, el('strong', { class: 'num' }, `${c.value > 0 ? '+' : ''}${c.value}`),
    ]))) : null,
    ...o.notes.map((n) => el('small', { class: 'hint' }, n)),
    o.lesson ? el('small', { class: 'outcome-lesson' }, [icon('bulb', { size: 14 }), o.lesson]) : null,
  ]);
}

// Largura de cada barra no desenho anterior: a barra nova cresce a partir dela (CSS .fill.grow),
// para o jogador ver o que a peça comprada mudou. Só visual.
const lastFill = {};

// Medidores: cada recurso contra o limite ou o mínimo, com barra e cor de alerta.
function gauges(player) {
  const t = effectiveTotals(player);

  { id: 'local', icon: 'die', label: 'Mesmo aparelho', desc: '2 a 4 agências revezando' },

// Tempo do relógio do turno: desligado ou 60/90/120/180 s (sim/turnTimer.js). Salvo no navegador e gravado
// na partida ao começar (main.js), para valer igual para todos no online.
function timerChoice(onChange) {
  return segmented('Tempo por turno', [0, 60, 90, 120, 180].map((n) => ({ value: n, label: n ? `${n} s` : 'Sem relógio' })), timerSeconds(), (v) => { setTimerSeconds(v); onChange(); });
}

// Cartões de opção (ícone, nome e uma linha do que é): escolha que precisa de explicação, não só um rótulo.
function optionCards(label, options, value, onPick) {
  return el('div', { class: 'option-cards', role: 'group', 'aria-label': label, style: `--cols:${options.length}` }, options.map((o) => el('button', {
    type: 'button', class: 'option-card', 'aria-pressed': String(o.value === value), onclick: () => onPick(o.value),
  }, [icon(o.icon, { size: 18 }), el('strong', {}, o.label), el('small', {}, o.desc)])));
}

// Botão que se desabilita enquanto a promessa da ação roda (criar/entrar na sala).
// Erros chegam por toast, tratados em main.js; a tela só chama actions.*.
function busyButton(label, busyLabel, run, attrs) {
  const b = button(label, async () => {
    b.disabled = true;
    const original = b.innerHTML; // preserva o ícone do rótulo
    b.textContent = busyLabel;
    try { await run(); } finally { b.disabled = false; b.innerHTML = original; }
  }, attrs);
  return b;
}

// Controle segmentado da Íris: um botão por opção, o escolhido com aria-pressed.
function segmented(label, options, value, onPick) {
  return el('div', { class: 'setup-seg', role: 'group', 'aria-label': label }, options.map((o) => el('button', {
    type: 'button',
    'aria-pressed': String(o.value === value),
    onclick: () => onPick(o.value),
  }, o.icon ? [icon(o.icon, { size: 14 }), o.label] : o.label)));
}

const rowLabel = (title, sub) => el('div', { class: 'setup-row-label' }, [
  el('strong', {}, title),

  if (draft.mode === 'online') return 'Cada agência no seu dispositivo, numa sala com link.';
  if (draft.sandbox) return 'Sem tabuleiro, com verba e tecnologia livres para testar projetos.';
  if (draft.mode === 'solo') return 'Você contra um bot que cumpre cada degrau no ano real (com um ano de variação).';
  return draft.localCount === 2
    ? '2 agências no mesmo aparelho, revezando. Cada uma joga escondida: use espionagem e boatos.'

// Qual tela do menu está aberta. Fica no módulo para sobreviver aos re-renders e à volta do lobby.
let view = 'splash'; // 'splash' | 'menu' | 'config' | 'settings' | 'credits'

function setupScreen(state, actions) {
  const host = el('div', { class: 'setup-host' });
  const go = (next) => {
    view = next;
    mount();
    if (typeof window !== 'undefined') window.scrollTo(0, 0);
  };
  const mount = () => {
    host.innerHTML = '';
    if (view === 'splash') host.appendChild(buildSplashView(() => go('menu')));
    else if (view === 'config') host.appendChild(renderConfigView(actions, () => go('menu')));
    else if (view === 'settings') host.appendChild(renderSettings(actions, go));
    else if (view === 'credits') host.appendChild(renderCredits(go));
    else host.appendChild(renderMainMenu(go));
  };
  mount();
  return host;
}

// Carta de dilema: sempre uma escolha, conforme a situação do jogador.
function dilemmaDecision(state, actions) {
  const card = DILEMMAS.find((d) => d.id === state.pendingDilemma?.id);
  if (!card) return null;
  return el('div', { class: `tile-decision dilemma ${hl(state, 'board', 'dilemma')}` }, [
    el('strong', { class: 'decision-title' }, [icon('card', { size: 18 }), card.title]),
    el('small', { class: 'hint' }, card.text),
    el('div', { class: 'row wrap', style: 'justify-content:center' }, card.options.map((o, i) => button(o.label, () => actions.chooseDilemma(i), { class: 'small' }))),
  ]);
}

// Decisão da casa onde o jogador parou: construir, usar o prédio do rival ou espionar.
function tileDecision(state, p, actions) {

  if (pending.kind === 'build') {
    const options = Object.values(BUILDINGS).filter((b) => !p.buildings[b.id]);
    if (!options.length) return el('p', { class: 'hint' }, 'Você já tem todos os prédios. Suba o nível no painel da agência.');
    return el('div', { class: cls }, [

      el('div', { class: 'row wrap', style: 'justify-content:center' }, [
        ...options.map((b) => button([icon(b.icon, { size: 16 }), b.name], () => actions.buildOnLot(b.id), { class: 'small', disabled: p.funds < upgradeCost(0), title: b.effect })),
        button('Seguir sem construir', () => actions.skipTile(), { class: 'small ghost' }),

      ...rivals.map((r) => button([`Observar ${r.name}, `, ...[].concat(sideBadge(r))], () => actions.spyOn(r.id), { class: 'gb-btn', disabled: p.funds < SPY_COST })),
      ...rivals.map((r) => button([`Sabotar ${r.name}, `, ...[].concat(sideBadge(r))], () => actions.sabotage(r.id), { class: 'gb-btn', disabled: p.funds < SABOTAGE_COST || Boolean(r.interference), title: r.bot ? 'Atrasa o próximo degrau dele em 1 ano.' : 'Arma uma interferência na etapa final do voo dele.' })),
      button('Seguir sem espionar', () => actions.skipTile(), { class: 'gb-btn ghost' }),
    ], cls);

  const owner = state.players[lot.ownerId];
  const b = BUILDINGS[lot.buildingId];
  const fee = useFeeFor(owner.buildings[lot.buildingId]);
  return el('div', { class: cls }, [
    el('strong', { class: 'decision-title' }, [icon(b.icon, { size: 18 }), `${b.name} de ${owner.name}`]),
    el('small', { class: 'hint' }, `Pague ${fee} a ${owner.name} e ganhe ${b.useText}. Os dois saem ganhando, mas você ajuda um rival.`),
    el('div', { class: 'row', style: 'justify-content:center' }, [
      button(`Usar por ${fee}`, () => actions.useRivalBuilding(), { class: 'small', disabled: p.funds < fee }),

// Monte de cartas de dilema no tapete central. Só aparece com o centro livre (sem decisão nem resultado),
// para não disputar espaço com o que o jogador precisa ler.
function dilemmaDeck(state, p) {
  if (state.pendingDilemma || state.pendingTile || (state.outcome && state.outcome.playerId === p.id)) return null;
  return el('div', { class: 'center-court-decks', 'aria-hidden': 'true' }, [
    el('div', { class: 'court-deck deck-dilemma' }, [el('span', { class: 'deck-icon' }, '?'), el('span', { class: 'deck-label' }, 'DILEMAS')]),

// Dados do miolo (função da equipe, 15/11, no visual do nosso console): antes de rolar, os dois dados

// Centro do anel: faixa de situação, dados e as decisões da casa.
function centerPanel(state, p, actions, rolling) {

    ? 'ESCOLHA UM DADO PARA AVANÇAR'
    : !p.rolled

// Bloco da missão atual (lateral), conforme a situação da nave.

// Barra fixa do turno: os passos à esquerda e, à direita, só as ações que fazem sentido agora.

    : !p.rolled ? 'Ande no tabuleiro antes de lançar.'
      : !inShop ? 'Só dá para lançar parado numa casa de Oficina do tabuleiro.'
      : design.ok ? 'Projeto pronto e verba suficiente.' : 'Resolva as pendências na oficina antes de lançar.';

    ? button([icon('wrench', { size: 18 }), 'Oficina'], () => actions.go('workshop'), { class: `ghost ${hl(state, 'board', 'workshop')}`, title: inShop ? 'Montar a nave: peças, foguete e o que falta para lançar.' : 'Planejar a nave: ver peças e risco. Para comprar e lançar, pare numa casa de Oficina.' })

    // não sobrou nada recomendado (voo avançado, lançou ou a escada acabou).
    const turnDone = !blocked && !deciding && (p.flight ? p.flightAdvanced : p.launchedThisTurn || !p.missionId);
    if (mustAdvance) after.push(button([icon('satellite', { size: 18 }), 'Avançar o voo'], () => actions.advanceFlight(), { class: `primary ${hl(state, 'board', 'advance')}` }));
    if (showWorkshop) after.push(button([icon('wrench', { size: 18 }), 'Oficina'], () => actions.go('workshop'), { class: `${!design.ok && !p.launchedThisTurn ? 'primary' : ''} ${hl(state, 'board', 'workshop')}` }));
    if (showLaunch && !p.flight) after.push(button([icon('rocket', { size: 18 }), 'Lançar'], () => actions.launch(), { disabled: !canLaunch, title: launchTitle, class: `${canLaunch ? 'primary launch-ready' : ''} ${hl(state, 'board', 'launch')}` }));
    after.push(button(['Passar a vez', icon('arrowRight', { size: 18 })], () => actions.endTurn(), { disabled: blocked, class: `${turnDone ? 'primary' : 'ghost'} ${hl(state, 'board', 'end')}`, title: blockedReason }));
  }

  return el('div', { class: 'turn-dock', role: 'region', 'aria-label': 'Ações do turno' }, [
    turnSteps(state, p, design),
    el('div', { class: 'dock-actions' }, [
      note ? el('span', { class: 'dock-note' }, note) : null,
      early,
      ...main,
      after.length ? el('div', { class: 'row action-bar' }, after) : null,
    ]),
  ]);

// Topo do console: visor com o ano e a rodada (dados reais da partida) e a casa atual.
function gadgetTopBar(state, p) {
  const roundInYear = ((state.round - 1) % ROUNDS_PER_YEAR) + 1;

    el('div', { class: 'gadget-lcd-bezel' }, [

  ]);
}

// Peão de cada agência: um foguete na cor do jogador (os mesmos tons dos avatares do topo), com contorno
// branco para aparecer sobre a casa. Com a nave em voo (lançar é público) o foguete ganha a chama acesa.

// Uma casa do tabuleiro. Exportada para a tela de espectador (ui/spectate.js) usar o mesmo tabuleiro.
// `current` é o jogador cuja casa fica destacada; `targetDice` marca a casa onde um dos dados para.

    style: `grid-row:${r};grid-column:${c}`,
    'data-tile': String(t.id),
    title: `${t.label}: ${tileSub(state, t)}`,
  }, [
    tileBoardArt(state, t, targetDice),
    // Lançar é público: o peão de quem está com a nave no ar ganha um marcador de foguete.

      class: `pawn gb-pawn rocket-pawn${pl.flight ? ' in-flight' : ''}`, 'data-pid': String(pl.id),
      role: 'img', 'aria-label': pl.flight ? `${pl.name}, nave em voo` : pl.name, title: pl.flight ? `${pl.name}: nave em voo` : pl.name,

      el('div', { class: 't-body', lang: 'pt-BR' }, [
        el('div', { class: 't-label' }, shortName(t)),
        // Na casa vai só o efeito curto (como em jogos de tabuleiro publicados); o texto completo fica no balão.
        el('div', { class: 't-sub' }, shortSub(state, t)),
      ]),
    ]),
  ]);
}

function boardScreen(state, actions) {
  const p = currentPlayer(state);
  const design = p.missionId ? checkDesign(p) : { ok: false };
  const rolling = state.lastRoll != null && state.lastRoll !== lastRollSeen && p.rolled;
  if (p.rolled) lastRollSeen = state.lastRoll;
  const simple = simpleUi(state, p);

  const from = lastPositions[p.id];

  const showLadder = !simple;

  const showRivals = !simple || Object.keys(p.intel).length > 0 || state.round > 3 || rivalFlying;

  const showStrip = !simple || Object.values(p.buildings).some(Boolean);

    hud(state, p, 'board', actions),
    guideCard(state, 'board'),
    el('div', { class: 'board-layout' }, [
      el('div', { class: 'board-gadget-wrap' }, [
        sinceCard(state),
        el('div', { class: 'board-gadget' }, [
          gadgetTopBar(state, p),
          // .gameboard: a faixa de prédios é irmã do tabuleiro, logo depois dele (test/year-strip.test.mjs)
          el('div', { class: 'gadget-screen gameboard' }, [
            boardMapLayer(state, p),
            el('div', { class: 'ring ring-16', style: RING_STYLE }, [...tiles, centerPanel(state, p, actions, rolling)]),
          ]),
          showStrip ? agencyStrip(state, p, actions) : null,
        ]),
      ]),
      el('div', { class: 'side-stack' }, [
        missionPanel(state, p, simple),
        showLadder ? ladderPanel(state, p) : null,
        showRivals ? rivalsPanel(state, p) : null,
        logPanel(state, p),
      ]),
    ]),
    turnDock(state, p, design, actions, simple),
  ]);

    }
