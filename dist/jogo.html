/* ===== Oficina fechada enquanto a nave voa ===== */
.panel.flight-wait { max-width: 640px; margin: 8px auto 0; display: grid; gap: 6px; }
.panel.flight-wait .panel-title { margin-bottom: 2px; }
.panel.flight-wait + .row { justify-content: center; }

/* ===== Virada de ano: cartão da Íris com calendário de mesa ===== */
.year-overlay {
  cursor: pointer;
  position: fixed;
  inset: 0;
  z-index: 55;
  display: grid;
  place-items: center;
  padding: 16px;
  background:
    radial-gradient(circle at 1px 1px, var(--pontinho) 1px, transparent 1.5px) 0 0 / 20px 20px,
    color-mix(in srgb, var(--fundo) 84%, transparent);
  animation: fadeIn .3s ease, yearFadeOut .5s ease 5.5s forwards; /* 5.5s + .5s = YEAR_OVERLAY_MS (ui/yearOverlay.js) */
}
.year-card {
  display: grid;
  justify-items: center;
  gap: 12px;
  width: min(460px, 100%);
  padding: 22px 26px 18px;
  border-radius: 6px;
  background: var(--superficie);
  box-shadow: 0 0 0 5px color-mix(in srgb, var(--superficie) 55%, transparent), 0 0 0 6px rgba(22, 23, 26, 0.05), var(--sombra-modal);
  animation: yearCardIn .5s cubic-bezier(.2, .7, .2, 1) both;
}
.year-calendar {
  position: relative;
  width: 168px;
  border-radius: 5px;
  overflow: hidden;
  background: var(--superficie);
  border: 1px solid var(--linha-forte);
  box-shadow: 0 1px 0 var(--linha), 0 10px 24px -8px rgba(22, 23, 26, 0.18);
}
/* Argolas do calendário de mesa */
.year-calendar::before, .year-calendar::after {
  content: '';
  position: absolute;
  top: 6px;
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: var(--superficie);
  box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.35);
  z-index: 1;
}
.year-calendar::before { left: 22px; }
.year-calendar::after { right: 22px; }
.year-calendar .cal-top {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  padding: 16px 8px 7px;
  background: var(--escuro);
  color: #ececee;
  font: 500 11px var(--mono);
  letter-spacing: 0.24em;
}
.year-calendar .cal-top .ic { color: #8b8b92; }
.year-calendar .cal-digits {
  position: relative;
  height: 84px;
  overflow: hidden;
  display: grid;
  place-items: center;
  background:
    linear-gradient(var(--linha), var(--linha)) 0 50% / 100% 1px no-repeat,
    radial-gradient(circle, color-mix(in srgb, var(--tinta) 9%, transparent) 1px, transparent 1.4px) 0 0 / 8px 8px,
    var(--superficie-2);
  font: 500 46px var(--mono);
  font-variant-numeric: tabular-nums;
  letter-spacing: -0.02em;
  color: var(--tinta);
}
.year-calendar .year-old, .year-calendar .year-new { position: absolute; }
.year-calendar .year-old { color: var(--tinta-3); animation: yearOut .7s ease .9s forwards; }
.year-calendar .year-new { animation: yearIn .7s ease .9s both; }
.year-overlay .year-card > .hint { font: 500 11.5px var(--mono); color: var(--tinta-3); }
.year-overlay .gains { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; min-height: 36px; }
.year-overlay .gain {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  height: 34px;
  padding: 0 12px;
  border-radius: 5px;
  font-size: 13px;
  border: 1px solid var(--linha);
  background: var(--superficie-2);
  color: var(--tinta-2);
  animation: gainPop .6s cubic-bezier(.2, .7, .2, 1) both;
}
.year-overlay .gain strong { font: 500 14px var(--mono); }
.year-overlay .gain.up { color: var(--ok); border-color: color-mix(in srgb, var(--ok) 35%, var(--linha)); background: var(--ok-fundo); }
.year-overlay .gain.down { color: var(--alerta); border-color: color-mix(in srgb, var(--alerta) 35%, var(--linha)); background: var(--alerta-fundo); }
.year-overlay .gain.part { color: var(--azul-texto); border-color: color-mix(in srgb, var(--azul-texto) 30%, var(--linha)); background: var(--azul-selo); }
.year-overlay .year-skip {
  margin-top: 2px;
  font: 400 11px var(--mono);
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--tinta-3);
  animation: splashBlink 2.2s ease-in-out infinite;
}
@keyframes yearOut { from { transform: translateY(0); opacity: 1; } to { transform: translateY(-100%); opacity: 0; } }
@keyframes yearIn { from { transform: translateY(100%); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
@keyframes yearCardIn { from { transform: translateY(6px) scale(.97); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes yearFadeOut { to { opacity: 0; } }
@keyframes gainPop { from { transform: translateY(6px) scale(.94); opacity: 0; } to { transform: none; opacity: 1; } }

/* "Fotos" 3D dos itens e dos foguetes na oficina (ui/itemArt.js) */
.card .item-photo { display: block; margin: -14px -16px 12px; height: 118px; overflow: hidden; border-radius: 6px 6px 0 0; background: #0d0e12; }
.card .item-photo svg { width: 100%; height: 100%; display: block; }
.card.locked .item-photo { filter: grayscale(1) brightness(.7); }
.card.owned .item-photo { box-shadow: inset 0 -3px 0 var(--ok); }
.card .card-head .icon { display: none; } /* a foto substitui o ícone pequeno */
.choice .row.wrap button:has(.choice-photo) { display: grid; grid-template-columns: 72px 1fr; align-items: center; gap: 10px; padding: 6px 12px 6px 6px; }
.choice-photo { display: block; width: 72px; height: 45px; border-radius: 4px; overflow: hidden; background: #0d0e12; }
.choice-photo svg { width: 100%; height: 100%; display: block; }

/* ===== Como funciona: fluxo do turno, escadas como linha do tempo, glossário em lista ===== */
.modal.rules-modal { width: min(760px, 100%); padding: 28px 30px 24px; border-radius: 22px; display: grid; gap: 14px; }
.rm-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; }
.rm-head .modal-title { font-size: 24px; font-weight: 600; letter-spacing: -0.02em; }
.rm-lead { margin: 6px 0 0; color: var(--tinta-2); font-size: 14.5px; max-width: 56ch; }
.rm-label { margin: 10px 0 0; font: 500 12px var(--mono); text-transform: uppercase; letter-spacing: 0.08em; color: var(--tinta-3); }
.rm-flow { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 0; }
.rm-step { position: relative; display: grid; justify-items: start; gap: 6px; padding: 0 18px 0 0; }
.rm-step + .rm-step { padding-left: 18px; border-left: 1px solid var(--linha); }
.rm-step-art { display: grid; place-items: center; width: 52px; height: 52px; border-radius: 14px; background: var(--superficie-2); border: 1px solid var(--linha); color: var(--tinta); }
.rm-step-art svg { width: 30px; height: 30px; }
.rm-step strong { font-size: 15px; font-weight: 600; }
.rm-step small { font-size: 13px; line-height: 1.45; color: var(--tinta-2); }
.rm-step:not(:last-child)::after {
  content: "→"; position: absolute; right: -7px; top: 15px; z-index: 1; width: 14px; height: 20px;
  display: grid; place-items: center; background: var(--superficie); color: var(--tinta-3); font-size: 14px;
}
.rm-sides { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 24px; }
.rm-side { display: grid; gap: 12px; align-content: start; }
.rm-side-head { display: flex; align-items: center; gap: 10px; }
.rm-side-head strong { display: block; font-size: 16px; font-weight: 600; }
.rm-side-head small { color: var(--tinta-3); font-size: 12.5px; }
.rm-side-ic { display: grid; place-items: center; width: 36px; height: 36px; border-radius: 10px; background: var(--superficie-2); border: 1px solid var(--linha); color: var(--tinta); }
.rm-ladder { list-style: none; margin: 0; padding: 0 0 0 4px; display: grid; gap: 0; }
.rm-ladder li { position: relative; display: flex; align-items: center; gap: 10px; padding: 7px 0 7px 22px; font-size: 14px; color: var(--tinta); }
.rm-ladder li::before { content: ""; position: absolute; left: 3px; top: 50%; width: 9px; height: 9px; margin-top: -4.5px; border-radius: 50%; background: var(--superficie); border: 2px solid var(--tinta-3); }
.rm-ladder li:not(:last-child)::after { content: ""; position: absolute; left: 7.5px; top: calc(50% + 6px); bottom: calc(-50% + 6px); width: 1px; background: var(--linha-forte); }
.rm-ladder li.goal::before { background: var(--tinta); border-color: var(--tinta); }
.rm-ladder li.goal span { font-weight: 600; }
.rm-ladder li .ic { color: var(--tinta-2); }
.rm-traits { list-style: none; margin: 0; padding: 10px 0 0; display: grid; gap: 6px; border-top: 1px solid var(--linha); }
.rm-traits li { display: flex; align-items: flex-start; gap: 8px; font-size: 13px; line-height: 1.4; color: var(--tinta-2); }
.rm-traits li .ic { margin-top: 2px; flex: none; }
.rm-traits li.plus .ic { color: var(--ok); }
.rm-traits li.minus .ic { color: var(--ambar); }
.rules-modal .glossary { margin: 6px 0 0; padding: 0; border: 0; background: transparent; box-shadow: none; border-top: 1px solid var(--linha); border-radius: 0; }
.rules-modal .glossary summary { padding: 14px 0 0; }
.rules-modal .glossary dl { margin: 6px 0 0; display: grid; gap: 0; }
.rules-modal .glossary dt { margin: 0; padding: 10px 0 2px; border-top: 1px solid var(--linha); font-size: 14px; }
.rules-modal .glossary dt:first-child { border-top: 0; }
.rules-modal .glossary dd { padding-bottom: 8px; font-size: 13px; color: var(--tinta-2); }
.rm-foot { margin: 4px 0 0; font-size: 12px; color: var(--tinta-3); }
@media (max-width: 640px) {
  .rm-flow, .rm-sides { grid-template-columns: 1fr; }
  .rm-step, .rm-step + .rm-step { padding: 12px 0 0; border-left: 0; }
  .rm-step + .rm-step { border-top: 1px solid var(--linha); }
  .rm-step:not(:last-child)::after { display: none; }
}

/* Créditos: um nome da equipe por linha, no mesmo formato das outras entradas */
.credits-list .credits-name { display: block; }

/* ===== Barra lateral fixa: navegação em cima, utilidades embaixo ===== */
.side-rail {
  position: fixed;
  inset: 0 auto 0 0;
  z-index: 20;
  width: 68px;
  display: flex;
  flex-direction: column;
  gap: 2px;
  padding: calc(10px + env(safe-area-inset-top, 0px)) 6px calc(10px + env(safe-area-inset-bottom, 0px)) calc(6px + env(safe-area-inset-left, 0px));
  background: var(--superficie);
  border-right: 1px solid var(--linha);
}
.side-rail .rail-nav { display: flex; flex-direction: column; gap: 2px; }
.rail-brand { display: grid; place-items: center; height: 40px; margin-bottom: 8px; color: var(--tinta); border-bottom: 1px solid var(--linha); }
.rail-spacer { flex: 1; }
.rail-item {
  width: 100%;
  height: auto;
  min-height: 50px;
  flex-direction: column;
  gap: 3px;
  padding: 6px 2px;
  border: 0;
  border-radius: 4px;
  background: transparent;
  color: var(--tinta-2);
  font: 500 11px/1.2 var(--texto);
  white-space: normal;
}
.rail-item .ic { margin: 0; }
.rail-item:hover:not(:disabled) { background: var(--trilho-seg); color: var(--tinta); }
.rail-item.on { background: var(--trilho-seg); color: var(--tinta); box-shadow: inset 2px 0 0 var(--tinta); }
.rail-item.on-soft { color: var(--tinta); }
.rail-item.on-soft .ic { color: var(--ok); }
.rail-item:disabled { opacity: 0.38; }
.rail-item.rail-exit:hover:not(:disabled) { color: var(--alerta); background: var(--alerta-fundo); }
body:has(.side-rail) #app { padding-left: max(88px, calc(88px + env(safe-area-inset-left, 0px))); }
.exit-dialog { width: min(420px, 100%); display: grid; gap: 10px; }
.exit-dialog p { margin: 0; color: var(--tinta-2); }
.exit-dialog .modal-actions { margin: 6px 0 0; justify-content: flex-end; }

/* ===== Menu principal (entre a capa e a Nova Partida) ===== */
.main-menu { position: relative; min-height: calc(100vh - 44px); display: grid; place-items: center; }
.main-menu-bar { position: absolute; top: 0; left: 0; right: 0; z-index: 1; }
.main-menu-box { position: relative; z-index: 1; width: min(420px, 100%); display: grid; gap: 22px; }
.main-menu-head { display: grid; gap: 8px; justify-items: start; }
.main-menu-title { font: 600 clamp(2.4rem, 5vw, 3.4rem)/1 var(--display); letter-spacing: -0.04em; margin: 0; }
.main-menu-sub { color: var(--tinta-2); font-size: 14px; margin: 0; }
.main-menu-list { display: grid; border-top: 1px solid var(--linha); border-bottom: 1px solid var(--linha); }
.main-menu-primary { width: 100%; height: 48px; font-size: 15px; gap: 8px; }
.main-menu-item {
  width: 100%;
  height: 48px;
  justify-content: flex-start;
  gap: 12px;
  padding: 0 8px;
  border: 0;
  border-bottom: 1px solid var(--linha);
  border-radius: 0;
  background: transparent;
  font: 500 15px var(--display);
  color: var(--tinta);
  transition: background var(--rapido), padding var(--rapido);
}
.main-menu-item:last-child { border-bottom: 0; }
.main-menu-item .ic { color: var(--tinta-2); margin: 0; }
.main-menu-item .mm-label { flex: 1; text-align: left; }
.main-menu-item .mm-chev { opacity: 0; transform: translateX(-4px); transition: opacity var(--rapido), transform var(--rapido); color: var(--tinta-2); }
.main-menu-item:hover:not(:disabled), .main-menu-item:focus-visible { background: var(--superficie); padding-left: 12px; }
.main-menu-item:hover .mm-chev, .main-menu-item:focus-visible .mm-chev { opacity: 1; transform: none; }
.main-menu-foot { font: 400 11px var(--mono); color: var(--tinta-3); margin: 0; }
/* planetas em pixel do menu: miniatura em cada opção e um Júpiter ao lado do título */
.mm-planet { display: block; width: 34px; height: 34px; border-radius: 8px; background: #07080b; overflow: hidden; flex: none; }
.mm-planet .pixel-space, .mm-title-planet .pixel-space, .splash-only-art .pixel-space { width: 100%; height: 100%; display: block; }
:root[data-tema="escuro"] .mm-planet { box-shadow: 0 0 0 1px var(--linha-forte); }
.main-menu-title-row { display: flex; align-items: center; gap: 14px; }
.mm-title-planet { display: block; width: 58px; height: 58px; }
.credits-list { margin: 0; padding: 0; list-style: none; display: grid; gap: 10px; font-size: 13.5px; color: var(--tinta-2); }
.credits-list strong { display: block; font: 500 11px var(--mono); text-transform: uppercase; letter-spacing: 0.06em; color: var(--tinta-3); margin-bottom: 2px; }

/* Relógio do turno no topo (ui/turnClock.js): âmbar nos últimos 30 s, vermelho piscando nos últimos 10 */
.turn-clock {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  min-height: 34px;
  padding: 3px 11px 3px 9px;
  border-radius: 4px;
  background: var(--superficie-2);
  border: 1px solid var(--linha);
  color: var(--tinta);
}
.turn-clock .ic { color: var(--tinta-2); }
.turn-clock .tc-num { font: 500 17px/1 var(--mono); font-variant-numeric: tabular-nums; min-width: 3.2ch; }
.turn-clock .tc-bar { position: relative; width: 56px; height: 4px; background: var(--linha); overflow: hidden; }
.turn-clock .tc-fill { position: absolute; inset: 0 auto 0 0; background: var(--tinta); transition: width .25s linear; }
.turn-clock.warn { border-color: color-mix(in srgb, var(--ambar) 55%, var(--linha)); background: var(--ambar-fundo); }
.turn-clock.warn .tc-num, .turn-clock.warn .ic { color: var(--ambar); }
.turn-clock.warn .tc-fill { background: var(--ambar); }
.turn-clock.danger { border-color: var(--alerta); background: var(--alerta-fundo); animation: clockPulse 1s ease-in-out infinite; }
.turn-clock.danger .tc-num, .turn-clock.danger .ic { color: var(--alerta); }
.turn-clock.danger .tc-fill { background: var(--alerta); }
@keyframes clockPulse { 50% { box-shadow: 0 0 0 3px color-mix(in srgb, var(--alerta) 25%, transparent); } }

/* Cartões de opção da Nova Partida (como jogar, modo) */
.option-cards { display: grid; grid-template-columns: repeat(var(--cols, 2), minmax(0, 1fr)); gap: 8px; }
.option-card {
  height: auto;
  min-height: 52px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  padding: 10px 12px;
  text-align: center;
  white-space: normal;
  background: var(--superficie);
  border: 1px solid var(--linha-forte);
  border-radius: 4px;
}
.option-card .ic { color: var(--tinta-3); margin: 0; }
.option-card strong { font-size: 14px; font-weight: 600; line-height: 1.2; }
.option-card[aria-pressed="true"] { border-color: var(--tinta); box-shadow: inset 0 0 0 1px var(--tinta); }
.option-card[aria-pressed="true"] .ic { color: var(--tinta); }
@media (max-width: 520px) { .option-cards { grid-template-columns: 1fr; } .option-card { min-height: 0; } }

/* ===== Barra fixa do turno (tabuleiro) e de lançamento (oficina) ===== */
.turn-dock, .launch-dock {
  position: sticky;
  bottom: calc(10px + env(safe-area-inset-bottom, 0px));
  z-index: 15;
  margin-top: 18px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px 16px;
  flex-wrap: wrap;
  padding: 9px 12px;
  border-radius: var(--radius);
  border: 1px solid var(--linha-forte);
  background: var(--superficie);
  box-shadow: var(--sombra-flutua);
}
.turn-dock .turn-steps { margin: 0; display: flex; gap: 4px; }
.turn-dock .turn-steps li { padding: 5px 8px; }
.turn-dock .turn-steps li:not(.now) .lbl { display: none; } /* só o passo atual tem nome: menos texto */
.dock-actions { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-left: auto; }
.dock-actions .action-bar { margin: 0; gap: 8px; }
.dock-note { color: var(--tinta-3); font-size: 13px; }
.dock-die { display: inline-block; width: 20px; height: 20px; }
.dock-die svg { width: 100%; height: 100%; display: block; }
button.reveal { animation: reveal .3s ease .5s both; }
@keyframes reveal { from { opacity: 0; transform: translateY(6px); } }
button.launch-ready { animation: readyGlow 1.6s ease-in-out infinite; }
@keyframes readyGlow { 50% { box-shadow: 0 0 0 4px color-mix(in srgb, var(--ok) 28%, transparent); } }
.launch-dock .dock-status { margin: 0; display: flex; align-items: center; gap: 8px; max-width: 70ch; font-size: 13px; }
.dock-status .ic { flex: none; }
.dock-status.ok { color: var(--ok); }
.dock-status.warn { color: var(--ambar); }
.dock-status.bad { color: var(--alerta); }
.launch-dock .dock-buttons { margin: 0 0 0 auto; gap: 8px; }
.launch-dock.ready { border-color: color-mix(in srgb, var(--ok) 45%, var(--linha)); }
.checks-ok summary { min-height: 24px; padding: 3px 0; cursor: pointer; color: var(--tinta-3); font-size: 12.5px; margin-top: 8px; }
.all-ok { display: flex; gap: 6px; align-items: center; color: var(--ok); margin: 0; }

/* ===== Dados clicáveis do tabuleiro: "?" antes de rolar, giram ao cair, um botão por dado ===== */
.gb-dice-row { display: flex; gap: 14px; justify-content: center; }
.board-gadget .ring-center button.gb-die-btn {
  height: auto;
  display: grid;
  justify-items: center;
  gap: 5px;
  padding: 4px;
  border: 0;
  border-radius: 8px;
  background: none;
  box-shadow: none;
  color: #f4f7ff;
  font: 700 11px var(--mono);
  text-transform: uppercase;
}
.board-gadget .ring-center button.gb-die-btn.pair { display: flex; gap: 12px; }
.board-gadget .ring-center button.gb-die-btn:hover:not(:disabled) { background: none; transform: none; }
.gb-die { display: block; width: 54px; height: 54px; filter: drop-shadow(0 3px 0 #12151f); transition: transform .12s ease; }
.gb-die svg { width: 100%; height: 100%; display: block; }
.gb-die-btn:hover .gb-die, .gb-die-btn:focus-visible .gb-die { transform: translateY(-3px) rotate(-4deg); }
.gb-die-btn.pair:hover .gb-die:last-child { transform: translateY(-3px) rotate(5deg); }
.gb-die.idle { animation: dieIdle 2.4s ease-in-out infinite; }
.gb-die.idle:last-child { animation-delay: .3s; }
.gb-die.tumble { animation: tumble .7s cubic-bezier(.2, .8, .3, 1) both; animation-delay: calc(var(--i, 0) * .09s); }
.gb-die.landed { animation: landed .35s ease both; }
@keyframes dieIdle { 50% { transform: translateY(-3px); } }
@keyframes tumble {
  0% { transform: translate(-46px, -34px) rotate(-280deg) scale(.6); opacity: 0; }
  60% { transform: translate(4px, 4px) rotate(16deg) scale(1.08); opacity: 1; }
  82% { transform: rotate(-5deg) scale(.97); }
  100% { transform: none; }
}
@keyframes landed { from { transform: scale(1.25) rotate(-10deg); } }
.board-gadget .tile.tile-preview { border-color: #fbd367; box-shadow: 0 0 0 3px #fbd367, 0 4px 0 #12151f; transform: translateY(-2px); z-index: 3; }
.gadget-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; }

/* ===== Animações que mostram o que mudou (ui/motion.js) ===== */
.hud .stat-num { display: inline-block; }
.stat.bump-up .stat-num { animation: bumpUp .5s ease; }
.stat.bump-down .stat-num { animation: bumpDown .5s ease; }
@keyframes bumpUp { 30% { transform: scale(1.25); color: var(--ok); } }
@keyframes bumpDown { 30% { transform: scale(.85); color: var(--alerta); } }
.float-delta { position: fixed; z-index: 70; pointer-events: none; transform: translate(-50%, 0); font: 600 15px var(--mono); animation: floatDown 1.2s ease-out forwards; }
.float-delta.up { color: var(--ok); }
.float-delta.down { color: var(--alerta); }
.float-delta.tech.up { color: var(--azul-texto); }
@keyframes floatDown {
  0% { opacity: 0; transform: translate(-50%, 4px) scale(.8); }
  15% { opacity: 1; transform: translate(-50%, 18px) scale(1.15); }
  100% { opacity: 0; transform: translate(-50%, 54px) scale(1); }
}
.gauge .fill.grow { animation: barGrow .5s cubic-bezier(.2, .8, .3, 1) both; }
@keyframes barGrow { from { width: var(--from); } }
.card.just-bought { animation: bought .5s cubic-bezier(.2, .9, .3, 1.3); }
@keyframes bought { 0% { transform: scale(.97); box-shadow: 0 0 0 0 color-mix(in srgb, var(--ok) 55%, transparent); } 100% { transform: none; box-shadow: 0 0 0 12px transparent; } }
.spacecraft-box.build-pulse svg { animation: buildPulse .55s ease; }
@keyframes buildPulse { 40% { transform: scale(1.04); } }

/* Voo: trajetória Terra → destino com a nave avançando etapa por etapa */
.trajectory { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 12px; max-width: 640px; margin: 16px auto 4px; color: var(--tinta-3); }
.traj-end { display: grid; place-items: center; width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--linha-forte); background: var(--superficie); }
.traj-end.earth { color: var(--azul-texto); }
.traj-end.dest { color: var(--ambar); }
.traj-line { position: relative; height: 4px; border-radius: 2px; background: repeating-linear-gradient(90deg, var(--linha-forte) 0 6px, transparent 6px 12px); }
.traj-done { position: absolute; left: 0; top: 0; bottom: 0; border-radius: inherit; width: calc(var(--to) * 100%); background: var(--ok); animation: trajGrow 1.1s ease-in-out both; }
@keyframes trajGrow { from { width: calc(var(--from) * 100%); } }
.trajectory.failed .traj-done { background: var(--alerta); }
.traj-mark { position: absolute; top: 50%; width: 12px; height: 12px; border-radius: 50%; transform: translate(-50%, -50%); background: var(--fundo); border: 2px solid var(--linha-forte); }
.traj-mark.ok { border-color: var(--ok); background: var(--ok); }
.traj-mark.bad { border-color: var(--alerta); background: var(--alerta); }
.traj-mark.now { border-color: var(--tinta); }
.traj-ship { position: absolute; top: 50%; left: calc(var(--to) * 100%); transform: translate(-50%, -50%) rotate(90deg); color: var(--tinta); animation: trajShip 1.1s ease-in-out both; }
@keyframes trajShip { from { left: calc(var(--from) * 100%); } }
.trajectory.failed .traj-ship { color: var(--alerta); transform: translate(-50%, -50%) rotate(150deg); }
.flight .alarm.burst { position: relative; color: var(--ok); animation: burstPop .5s cubic-bezier(.2, .9, .3, 1.4) both; }
@keyframes burstPop { from { transform: scale(.3); opacity: 0; } }
.report.success .report-head .result-seal { animation: stampIn .5s cubic-bezier(.2, .9, .3, 1.3) .15s both; }
@keyframes stampIn { from { transform: rotate(-30deg) scale(1.8); opacity: 0; } to { transform: none; opacity: 1; } }
.report.failure .report-head { animation: failShake .5s ease .1s both; }
@keyframes failShake { 15%, 45%, 75% { transform: translateX(-6px); } 30%, 60%, 90% { transform: translateX(6px); } }

@media (max-width: 700px) {
  /* celular: a barra lateral vira uma faixa horizontal dentro do topo */
  .side-rail { position: static; width: 100%; order: 20; flex-direction: row; align-items: stretch; padding: 6px 0 0; border-right: 0; border-top: 1px solid var(--linha); overflow-x: auto; }
  .side-rail .rail-nav { flex-direction: row; }
  .rail-brand { display: none; }
  .rail-item { min-width: 58px; }
  body:has(.side-rail) #app { padding-left: max(20px, env(safe-area-inset-left, 0px)); }
  .turn-dock, .launch-dock { bottom: 0; }
  .dock-actions, .launch-dock .dock-buttons { margin-left: 0; width: 100%; }
  .dock-actions .action-bar { width: 100%; }
  .dock-actions button, .launch-dock .dock-buttons button { flex: 1 1 auto; }
}

/* =========================================================
   Tabuleiro: planta de engenharia (cianotipia). Referência: Space Race (2021), elogiado por assumir o visual
   de blueprint de engenheiro de foguetes. Um papel azul, traço branco fino e grade técnica; sem brilho,
   sem degradê, sem faixas coloridas. Cor só onde informa: a cor de cada jogador e um âmbar único para
   "você está aqui" e "o dado para aqui". Visual único nos dois temas (cores declaradas aqui).
   ========================================================= */
.board-screen .board-gadget {
  --bp-paper: #1f4579;
  --bp-deep: #193a67;
  --bp-ink: #f2f6ff;
  --bp-ink-2: rgba(242, 246, 255, 0.78);
  --bp-line: rgba(242, 246, 255, 0.42);
  --bp-faint: rgba(242, 246, 255, 0.12);
  --bp-mark: #ffc857;
  background-color: var(--bp-paper);
  background-image:
    linear-gradient(var(--bp-faint) 1px, transparent 1px),
    linear-gradient(90deg, var(--bp-faint) 1px, transparent 1px),
    linear-gradient(rgba(242, 246, 255, 0.05) 1px, transparent 1px),
    linear-gradient(90deg, rgba(242, 246, 255, 0.05) 1px, transparent 1px);
  background-size: 100px 100px, 100px 100px, 20px 20px, 20px 20px;
  border: 1px solid var(--bp-deep);
  border-radius: 2px;
  padding: 14px 16px 16px;
  box-shadow: none;
  color: var(--bp-ink);
}
/* moldura de prancha: filete duplo como numa folha de desenho técnico */
.board-screen .board-gadget .gadget-screen { background: transparent; border: 1px solid var(--bp-ink-2); outline: 1px solid var(--bp-line); outline-offset: 3px; border-radius: 0; box-shadow: none; }
.board-screen .board-gadget .gadget-map-svg rect { stroke: var(--bp-line); }
.board-screen .board-gadget .gadget-map-svg polyline { stroke: var(--bp-mark); }
/* carimbo da prancha (ano/rodada) e casa atual, como o quadro de legenda de um desenho técnico */
.board-screen .board-gadget .gadget-lcd-bezel { background: transparent; border: 0; padding: 0; box-shadow: none; }
.board-screen .board-gadget .gadget-lcd-screen, .board-screen .board-gadget .g-chip {
  background: transparent; border: 1px solid var(--bp-ink-2); border-radius: 0; box-shadow: none;
  color: var(--bp-ink); padding: 4px 10px; font: 500 11px var(--mono); letter-spacing: 0.08em;
}

/* casas: retângulos de traço, rótulo técnico, ícone de linha */
.board-screen .board-gadget .tile {
  background: #10284b;
  border: 1px solid rgba(242, 246, 255, 0.55);
  border-radius: 0;
  box-shadow: 3px 3px 0 rgba(8, 20, 40, 0.45);
  color: var(--bp-ink);
  transform: none;
}
.board-screen .board-gadget .tile:hover { border-color: var(--bp-ink); background: #142f57; }
.board-screen .board-gadget .tile.tile-corner { border-color: var(--bp-ink-2); }
.board-screen .board-gadget .tile .t-band {
  background: transparent;
  color: var(--bp-ink-2);
  border-bottom: 1px solid var(--bp-line);
  font: 500 11px var(--mono);
  letter-spacing: 0.1em;
}
.board-screen .board-gadget .tile .t-band-dir { color: var(--bp-ink-2); font-weight: 400; }
.board-screen .board-gadget .t-art-row { background: transparent; border-color: var(--bp-line); }
.t-art-ink { display: grid; place-items: center; width: 30px; height: 30px; color: var(--bp-ink); }
.t-art-ink svg { width: 100%; height: 100%; display: block; }
.board-screen .board-gadget .tile .t-label { color: var(--bp-ink); font-weight: 600; font-size: 13px; }
.board-screen .board-gadget .tile .t-sub { font-size: 11px; }
/* cantos: ícone maior, como as casas especiais de um tabuleiro impresso */
.board-screen .board-gadget .tile-corner .t-art-ink { width: 40px; height: 40px; }
.board-screen .board-gadget .tile-corner .t-label { font-size: 14px; }
.board-screen .board-gadget .tile .t-sub { color: var(--bp-ink-2); font-weight: 400; }
.board-screen .board-gadget .tile .t-icon { background: transparent; border: 1px solid var(--bp-ink-2); color: var(--bp-ink); box-shadow: none; }
.board-screen .board-gadget .tile.owned { border-style: solid; }
/* estados: você está aqui (âmbar cheio na borda) e onde cada dado para (âmbar tracejado) */
.board-screen .board-gadget .tile.active { background: #142f57; border: 2px solid var(--bp-mark); box-shadow: 3px 3px 0 rgba(8, 20, 40, 0.45); }
.board-screen .board-gadget .tile.tile-target, .board-screen .board-gadget .tile.tile-preview { border: 2px dashed var(--bp-mark); }
/* Faixa do topo por grupo de efeito (texto escuro). Paleta derivada da Okabe-Ito, segura para daltonismo:
   a menor diferença entre duas faixas é ΔE 24 na visão normal, 15 com deuteranopia e 23 com protanopia.
   Casas de mesmo efeito têm a mesma cor; a Oficina de montagem, onde se lança, é a única branca. */
.board-screen .board-gadget .tile .t-band { color: #10213d; border-bottom: 1px solid rgba(8, 20, 40, 0.5); font-weight: 600; }
.board-screen .board-gadget .tile .t-band-dir { color: #10213d; }
.board-screen .board-gadget .tile-workshop .t-band { background: #ffffff; }
.board-screen .board-gadget .tile-shop .t-band { background: #6aaee6; }
.board-screen .board-gadget .tile-event .t-band { background: #f6a04d; }
.board-screen .board-gadget .tile-lot .t-band { background: #b9bfcc; }
.board-screen .board-gadget .tile-funds .t-band, .board-screen .board-gadget .tile-tech .t-band, .board-screen .board-gadget .tile-catchup .t-band,
.board-screen .board-gadget .tile-repair .t-band, .board-screen .board-gadget .tile-start .t-band { background: #4fbf94; }
.board-screen .board-gadget .tile.tile-neg .t-band { background: #cf6f9e; }
.board-screen .board-gadget .tile-spy .t-band { background: #f3ea8f; }
/* terreno com prédio: a faixa ganha a cor do dono */
.board-screen .board-gadget .tile.owned.o0 .t-band { background: #8fb8f2; }
.board-screen .board-gadget .tile.owned.o1 .t-band { background: #f0cf7a; }
.board-screen .board-gadget .tile.owned.o2 .t-band { background: #8fdcb8; }
.board-screen .board-gadget .tile.owned.o3 .t-band { background: #f3a98a; }
/* Oficina de montagem: a casa mais importante ganha também a borda inteira em branco */
.board-screen .board-gadget .tile-workshop:not(.active):not(.tile-target) { border-color: #f2f6ff; }
.board-screen .board-gadget .t-target-pill { background: var(--bp-mark); color: #14233d; border: 0; border-radius: 0; box-shadow: none; }
.board-screen .board-gadget .pawn { border-width: 1px; box-shadow: 0 0 0 2px var(--bp-paper); }

/* miolo: diagrama orbital em traço, atrás dos dados */
.board-screen .board-gadget .ring-center { background: transparent; border: 1px solid var(--bp-line); border-radius: 0; box-shadow: none; }
.board-screen .board-gadget .ring-center > .center-orbits { position: absolute; inset: 0; z-index: 0; pointer-events: none; display: grid; place-items: center; color: var(--bp-ink); opacity: 0.32; }
.center-orbits svg { width: 100%; height: 100%; display: block; }
.board-screen .board-gadget .gadget-banner-plate {
  background: var(--bp-paper); color: var(--bp-ink); border: 1px solid var(--bp-ink-2); border-radius: 0;
  padding: 6px 12px; box-shadow: none; transform: none; letter-spacing: 0.1em; font-weight: 500;
}
.board-screen .board-gadget .ring-center .label { color: var(--bp-ink-2); }
.board-screen .board-gadget .court-deck { background: var(--bp-paper); border: 1px dashed var(--bp-ink-2); border-radius: 0; box-shadow: none; transform: rotate(-4deg); }
.board-screen .board-gadget .court-deck .deck-icon { background: transparent; border: 1px solid var(--bp-ink); color: var(--bp-ink); }
.board-screen .board-gadget .court-deck .deck-label { color: var(--bp-ink); }
.board-screen .board-gadget .gb-die { filter: none; }
.board-screen .board-gadget .ring-center button.gb-die-btn { color: var(--bp-ink); }

/* decisões no miolo: ficha branca de engenharia sobre a planta (texto escuro, leitura longa) */
.board-screen .board-gadget .tile-decision, .board-screen .board-gadget .outcome {
  background: #f4f6fa; color: #14233d; border: 1px solid #14233d; border-radius: 0; box-shadow: 4px 4px 0 rgba(10, 22, 44, 0.35);
}
.board-screen .board-gadget .tile-decision .hint, .board-screen .board-gadget .outcome .hint { color: #3c4a63; }
.board-screen .board-gadget .outcome-lesson { background: transparent; color: #3c4a63; }
.board-screen .board-gadget .ring-center button:not(.gb-die-btn) {
  background: #ffffff; color: #14233d; border: 1px solid #14233d; border-radius: 0; box-shadow: none;
  font: 500 12.5px var(--texto); text-transform: none;
}
.board-screen .board-gadget .ring-center button:not(.gb-die-btn):hover:not(:disabled) { background: #e6ecf7; transform: none; }
.board-screen .board-gadget .ring-center button.ghost:not(.gb-die-btn) { background: transparent; border-color: transparent; color: #3c4a63; }
.board-screen .board-gadget .gb-price { color: #835600; }

/* Cartas de decisão e de resultado flutuam centralizadas sobre o miolo, como uma carta posta na mesa:
   fora do fluxo, não esticam as casas do anel; se forem maiores que o miolo, rolam por dentro. */
.board-screen .board-gadget .ring-center { min-height: 0; }
.board-screen .board-gadget .ring-center > .center-cards {
  position: absolute;
  z-index: 3;
  inset: 10px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: safe center;
  gap: 10px;
  overflow: auto;
}
.board-screen .board-gadget .center-cards > .tile-decision,
.board-screen .board-gadget .center-cards > .outcome { position: relative; width: min(460px, 100%); max-width: none; flex: none; }
/* com aviso e decisão juntos, o aviso fica compacto em cima */
.board-screen .board-gadget .center-cards > .outcome:not(:only-child) { padding: 8px 40px 8px 12px; gap: 2px; }
.board-gadget .outcome .card-close {
  position: absolute; top: 6px; right: 6px; width: 28px; height: 28px; padding: 0;
  border: 0; border-radius: 4px; background: transparent; color: inherit; opacity: .75;
}
.board-gadget .outcome .card-close:hover:not(:disabled) { opacity: 1; background: rgba(20, 35, 61, .08); }
.board-screen .board-gadget .ring-center:has(> .center-cards) > .dice-choice { opacity: 0.25; }
.board-screen .board-gadget .ring-center:has(> .center-cards) > .gadget-banner,
.board-screen .board-gadget .ring-center:has(> .center-cards) > .dice-choice .label { visibility: hidden; }

/* baia da agência: mesma planta */
.board-screen .board-gadget .agency-strip { background: transparent; background-image: none; border: 1px solid var(--bp-line); border-radius: 0; box-shadow: none; }
.board-screen .board-gadget .agency-strip .panel-title { color: var(--bp-ink-2); }
.board-screen .board-gadget .agency-strip .panel-title .ic { color: var(--bp-ink); }
.board-screen .board-gadget .agency-strip .strip-head button { background: transparent; border: 1px solid var(--bp-ink); color: var(--bp-ink); border-radius: 0; box-shadow: none; }
.board-screen .board-gadget .building-card { background: rgba(25, 58, 103, 0.55); border: 1px solid var(--bp-line); border-radius: 0; box-shadow: none; color: var(--bp-ink); }
.board-screen .board-gadget .building-card .bc-head strong { color: var(--bp-ink); }
.board-screen .board-gadget .building-card .b-icon { background: transparent; border: 1px solid var(--bp-ink-2); color: var(--bp-ink); box-shadow: none; }
.board-screen .board-gadget .building-card .bc-level, .board-screen .board-gadget .building-card .bc-level .hint, .board-screen .board-gadget .building-card .hint { color: var(--bp-ink-2); }
.board-screen .board-gadget .building-card.not-built { background: transparent; border: 1px dashed var(--bp-line); opacity: 1; }
.board-screen .board-gadget .building-card.not-built .b-icon { border-style: dashed; color: var(--bp-ink-2); }
.board-screen .board-gadget .building-card.maxed { border-color: var(--bp-ink); }
.board-screen .board-gadget .building-card .pip { border: 0; height: 4px; background: var(--bp-line); border-radius: 0; }
.board-screen .board-gadget .building-card .pip.on { background: var(--bp-ink); }
.board-screen .board-gadget .building-card .upgrade { background: transparent; border: 1px solid var(--bp-mark); color: var(--bp-mark); border-radius: 0; box-shadow: none; }
.board-screen .board-gadget .building-card .upgrade:hover:not(:disabled) { background: rgba(255, 200, 87, 0.12); transform: none; }
.board-screen .board-gadget .building-card .upgrade:disabled { background: transparent; border-color: var(--bp-line); color: var(--bp-ink-2); }
.board-screen .board-gadget .building-card .badge.max { border: 1px solid var(--bp-ink); background: transparent; color: var(--bp-ink); border-radius: 0; }

/* Peões em forma de foguete (cor do jogador, contorno branco) */
.board-gadget .pawns { gap: 2px; top: auto; bottom: 6px; right: 6px; width: 40px; flex-wrap: wrap; justify-content: flex-end; align-content: flex-end; }
/* com peão na casa, o texto deixa a faixa da direita livre para os foguetes */
.board-gadget .tile:has(.pawns > .pawn) .t-main-row { padding-right: 48px; }
.board-gadget .pawn.rocket-pawn { width: 18px; height: 27px; display: block; background: none; border: 0; border-radius: 0; box-shadow: none; filter: drop-shadow(0 2px 0 rgba(8, 20, 40, 0.6)); }
.board-gadget .pawn.rocket-pawn svg { width: 100%; height: 100%; display: block; }
.board-gadget .tile.active .pawn.rocket-pawn { animation: pawnHover 2.4s ease-in-out infinite; }
@keyframes pawnHover { 50% { transform: translateY(-2px); } }
@media (max-width: 600px) { .board-gadget .pawn.rocket-pawn { width: 13px; height: 20px; } }

/* ===== Animações do tabuleiro (só visual; tudo para com "reduzir movimento") ===== */
/* chama do foguete: acesa em voo e enquanto anda */
.rocket-pawn .rk-flame { display: none; transform-origin: 10px 23.5px; }
.rocket-pawn .rk-flame.on, .pawn-ghost .rk-flame { display: block; animation: flameFlicker .12s steps(2) infinite; }
@keyframes flameFlicker { 50% { transform: scaleY(1.35) scaleX(.85); } }
.pawn-ghost { filter: drop-shadow(0 0 6px rgba(255, 200, 87, .55)); }
/* partículas de pixel: fumaça do rastro, poeira do pouso, fumaça da decolagem */
.px-particle { position: fixed; z-index: 44; width: 4px; height: 4px; pointer-events: none; animation: pxFade .8s ease-out forwards; }
.smoke-puff { background: rgba(225, 230, 240, .75); }
.land-puff { background: #ffc857; width: 3px; height: 3px; }
.launch-smoke { z-index: 52; width: 8px; height: 8px; background: rgba(230, 232, 238, .85); animation-duration: 1.2s; }
@keyframes pxFade { to { opacity: 0; transform: translate(var(--dx), var(--dy)) scale(.4); } }
/* pouso: a casa pisca uma vez */
.board-screen .board-gadget .tile.tile-landed { animation: tileLand .6s ease-out; }
@keyframes tileLand { 0% { box-shadow: 0 0 0 0 rgba(255, 200, 87, .9); } 100% { box-shadow: 0 0 0 14px rgba(255, 200, 87, 0); } }
/* dados com peso: caem quicando */
@keyframes tumble {
  0% { transform: translate(-60px, -48px) rotate(-300deg) scale(.6); opacity: 0; }
  45% { transform: translate(4px, 6px) rotate(14deg) scale(1.05); opacity: 1; }
  60% { transform: translate(0, -10px) rotate(-6deg); }
  74% { transform: translate(0, 2px) rotate(3deg); }
  86% { transform: translate(0, -3px); }
  100% { transform: none; }
}
.gb-die.tumble { animation-duration: .9s; }
/* casas-alvo: a borda tracejada corre, como formigas marchando */
.board-screen .board-gadget .tile.tile-target, .board-screen .board-gadget .tile.tile-preview { border-color: rgba(255, 200, 87, .35); border-style: solid; }
.board-screen .board-gadget .tile.tile-target::after, .board-screen .board-gadget .tile.tile-preview::after {
  content: ""; position: absolute; inset: -2px; pointer-events: none; z-index: 4;
  background:
    linear-gradient(90deg, #ffc857 50%, transparent 0) top / 12px 2px repeat-x,
    linear-gradient(90deg, #ffc857 50%, transparent 0) bottom / 12px 2px repeat-x,
    linear-gradient(0deg, #ffc857 50%, transparent 0) left / 2px 12px repeat-y,
    linear-gradient(0deg, #ffc857 50%, transparent 0) right / 2px 12px repeat-y;
  animation: ants .7s linear infinite;
}
@keyframes ants { to { background-position: 12px 0, -12px 100%, 0 -12px, 100% 12px; } }
/* caminho do dado pela trilha */
.route-preview { fill: none; stroke: #ffc857; stroke-width: 3; stroke-dasharray: 2 7; stroke-linecap: round; animation: routeDash .6s linear infinite; }
@keyframes routeDash { to { stroke-dashoffset: -18; } }
/* carta saindo do baralho e virando */
.board-screen .board-gadget .center-cards > .deal-in { animation: dealIn .6s cubic-bezier(.2, .8, .3, 1) both; }
@keyframes dealIn {
  0% { transform: translate(-36%, 34%) rotate(-10deg) scale(.32) rotateY(180deg); opacity: .4; }
  55% { transform: translate(-6%, 6%) rotate(-3deg) scale(.85) rotateY(70deg); opacity: 1; }
  100% { transform: none; }
}
/* moedinhas da verba */
.px-coin { position: fixed; left: 0; top: 0; z-index: 70; width: 8px; height: 8px; margin: -4px 0 0 -4px; background: #ffc857; box-shadow: inset -2px -2px 0 #c99a2e; pointer-events: none; }
/* prédio novo subindo na casa */
.board-screen .board-gadget .tile.just-built .t-art-ink { animation: buildUp .7s cubic-bezier(.2, .9, .3, 1.3) both; transform-origin: 50% 100%; }
@keyframes buildUp { from { transform: scaleY(0); opacity: 0; } 60% { opacity: 1; } }
.board-screen .board-gadget .tile.just-built { animation: tileLand .8s ease-out .3s; }
/* virada de ano: faixa de luz varrendo a planta */
.board-gadget.year-sweep::after {
  content: ""; position: absolute; inset: 0; z-index: 5; pointer-events: none;
  background: linear-gradient(100deg, transparent 42%, rgba(242, 246, 255, .22) 50%, transparent 58%) no-repeat;
  background-size: 260% 100%;
  animation: sweep 1.8s ease-in-out forwards;
}
@keyframes sweep { from { background-position: 120% 0; } to { background-position: -40% 0; } }
/* decolagem (main.js showLaunchOverlay) */
.launch-overlay {
  background:
    radial-gradient(1px 1px at 20% 30%, #fff, transparent), radial-gradient(1px 1px at 70% 20%, #fff, transparent),
    radial-gradient(1.5px 1.5px at 45% 60%, #fff, transparent), radial-gradient(1px 1px at 85% 75%, #fff, transparent),
    radial-gradient(ellipse at 50% 120%, #1d3f86 0%, #07080b 60%);
}
.launch-overlay .count { top: 16%; font: 500 56px var(--mono); color: #f2f6ff; letter-spacing: -0.02em; }
.launch-overlay .lift { position: absolute; left: 50%; bottom: 18%; width: 64px; height: 116px; transform: translateX(-50%); }
.launch-overlay .lift svg { width: 100%; height: 100%; display: block; }
.launch-overlay .lift .lift-flame { display: none; transform-origin: 20px 50px; }
.launch-overlay .lift.go .lift-flame { display: block; animation: flameFlicker .1s steps(2) infinite; }
.launch-overlay .lift.go { animation: liftUp 1.25s cubic-bezier(.55, 0, .8, .4) forwards; }
@keyframes liftUp { 0% { transform: translateX(-50%); } 12% { transform: translateX(calc(-50% + 1px)); } 100% { transform: translate(-50%, -90vh); } }
.launch-overlay .pad { position: absolute; left: 50%; bottom: calc(18% - 8px); width: 120px; height: 8px; transform: translateX(-50%); background: #2a2f3a; }

/* ===== Funcionalidades novas da equipe, no nosso padrão ===== */
/* Tela de espectador (ui/spectate.js): faixa de "quem está jogando" e aviso de só leitura */
.spectate-banner { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; padding: 12px 16px; }
.spectate-who { display: flex; flex-direction: column; gap: 2px; }
.spectate-who .chip { align-self: flex-start; }
.spectating-chip { border-color: var(--tinta); color: var(--tinta); }
.spectating .action-bar button { opacity: 1; }
.workshop.read-only .spectate-note { margin-top: 0; }
/* Peão de quem está com a nave no ar (lançar é público) */
.pawn.in-flight { position: relative; }
.pawn .gb-flight { position: absolute; top: -6px; right: -8px; width: 15px; height: 15px; border-radius: 50%; display: grid; place-items: center; background: #f2c14e; color: #12151f; }
.pawn .gb-flight .ic { line-height: 0; }
.hint.flight-public { display: inline-flex; align-items: center; gap: 5px; color: var(--ambar); }
/* Fornecedor: preço da blueprint ao lado do nome */
.gb-price { margin-left: 8px; font: 600 11px/1 var(--mono); color: #f2c14e; }
/* Dicas de "primeira vez" sobre o cartão do próximo passo */
.guide-stack { display: grid; gap: 0; }
.guide-tip { border-left: 3px solid var(--ambar); }
.guide-tip .tip-tag { display: inline-block; margin-bottom: 2px; font: 600 11px var(--mono); letter-spacing: 0.08em; text-transform: uppercase; color: var(--ambar); }

/* ===== Responsivo ===== */
@media (max-width: 900px) {
  .hero, .workshop-grid, .report-grid, .board-layout, .workshop-vitrine, .splash-main { grid-template-columns: 1fr; }
  .side { position: static; }
  .steps-grid { grid-template-columns: 1fr; }
  .hud > .steps { display: none; }
}
@media (max-width: 900px) {
  .building-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
@media (max-width: 600px) {
  .lobby-slots { grid-template-columns: 1fr; }
  .setup-join-row { grid-template-columns: 1fr; }
  .ring.ring-16 { gap: 4px; grid-template-rows: repeat(var(--ring-n, 5), minmax(56px, auto)); }
  .ring-16 .tile { min-height: 64px; padding: 5px; }
  .ring-16 .tile .t-sub, .ring-16 .tile .t-label { display: none; }
  .pawn { width: 16px; height: 16px; font-size: 9.5px; }
  .turn-steps { grid-template-columns: repeat(2, 1fr); }
  .guide-card { padding: 10px 12px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}


/* Terreno livre: cada prédio aparece como "foto" para escolher (ui/itemArt.js) */
.build-options { display: grid; grid-template-columns: repeat(auto-fit, minmax(96px, 1fr)); gap: 8px; width: 100%; }
button.build-option, .board-screen .board-gadget button.build-option { display: flex; flex-direction: column; align-items: stretch; justify-content: flex-start; gap: 0; height: auto; padding: 0; overflow: hidden; border-radius: 8px; min-height: 0; text-align: center; white-space: normal; }
.build-option .build-photo { display: block; aspect-ratio: 160 / 100; background: #0d0e12; }
.build-option .build-photo svg { width: 100%; height: 100%; display: block; }
.build-option .build-name { display: block; padding: 6px 4px; font-size: 13px; line-height: 1.2; }
.build-option:hover:not(:disabled) .build-photo svg { transform: scale(1.06); }
.build-option .build-photo svg { transition: transform .2s ease; }
.build-option:disabled .build-photo { filter: grayscale(1); opacity: .6; }
/* Casa com prédio: a foto ocupa o quadrado da esquerda no lugar do ícone de traço */
.board-screen .board-gadget .t-art-ink.t-art-photo { width: 52px; height: 39px; }
.board-screen .board-gadget .tile-corner .t-art-ink.t-art-photo { width: 64px; height: 48px; }
@media (prefers-reduced-motion: reduce) { .build-option .build-photo svg { transition: none; } }

/* Nave em montagem (oficina): trilha de sistemas e encaixes tracejados (ui/spacecraft.js) */
.spacecraft-box .assembly-bar { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 6px 12px; margin-bottom: 4px; }
.assembly-status { display: inline-flex; align-items: center; gap: 6px; font: 600 12.5px var(--mono); color: #e7e9ee; letter-spacing: .02em; }
.assembly-steps { display: flex; flex-wrap: wrap; gap: 4px; margin: 0; padding: 0; list-style: none; }
.assembly-steps li { padding: 3px 8px; border: 1px dashed #4b5b7a; border-radius: 999px; font: 500 11px var(--mono); color: #a9b4c8; }
.assembly-steps li.ok { border-style: solid; border-color: #3f9a5d; background: rgba(63, 154, 93, .18); color: #c9f0d6; }
.spacecraft-box.whole .assembly-status { color: #f3d27a; }
.spacecraft-box.ready { border-color: #3f9a5d; box-shadow: inset 0 0 0 1px rgba(63, 154, 93, .5), 0 0 22px rgba(63, 154, 93, .25), var(--sombra-cartao); }
.spacecraft-box.ready .assembly-status { color: #8ee0a8; }
.spacecraft.assembling .sc-ghost-label { font-family: var(--mono); letter-spacing: .03em; }
.spacecraft.assembling .sc-ghosts { animation: ghostPulse 2.4s ease-in-out infinite; }
@keyframes ghostPulse { 50% { opacity: .55; } }
.spacecraft .sc-part.snap-in { animation: snapIn .6s cubic-bezier(.2, .9, .3, 1.3) both; transform-box: fill-box; transform-origin: 50% 50%; }
@keyframes snapIn { 0% { opacity: 0; transform: translateY(-14px) scale(1.12); } 60% { opacity: 1; } 100% { transform: none; } }
@media (prefers-reduced-motion: reduce) { .spacecraft.assembling .sc-ghosts, .spacecraft .sc-part.snap-in { animation: none; } }
/* Na oficina a legenda vai embaixo do desenho (antes ficava por cima do foguete) */
.spacecraft-box .assembly-bar ~ .caption { position: static; display: block; margin-top: 4px; }
/* Casa com prédio: nome do prédio inteiro numa linha, sem hifenizar */
.board-screen .board-gadget .tile.owned .t-main-row { padding: 6px 6px 6px 8px; }
.board-screen .board-gadget .tile.owned .t-label { font-size: 12px; letter-spacing: -0.01em; hyphens: none; overflow-wrap: normal; }

/* Faixa "Sua agência": foto do prédio no nível atual à esquerda de cada cartão (cresce a cada nível) */
.building-card { grid-template-columns: 104px minmax(0, 1fr); column-gap: 10px; }
.building-card > :not(.bc-photo) { grid-column: 2; }
.building-card .bc-photo { grid-column: 1; grid-row: 1 / span 4; align-self: start; display: block; width: 104px; aspect-ratio: 160 / 100; border-radius: 4px; overflow: hidden; background: #0d0e12; }
.building-card .bc-photo svg { display: block; width: 100%; height: 100%; }
.building-card.not-built .bc-photo { filter: grayscale(1); opacity: .45; }
.building-card.grew .bc-photo svg { animation: buildUp .7s cubic-bezier(.2, .9, .3, 1.3) both; transform-origin: 50% 90%; }
@media (max-width: 560px) { .building-card { grid-template-columns: 80px minmax(0, 1fr); } .building-card .bc-photo { width: 80px; } }
@media (prefers-reduced-motion: reduce) { .building-card.grew .bc-photo svg { animation: none; } }


/* =========================================================
   Celular e desempenho (branch daniel/mobile-desempenho)
   Tudo aqui é só apresentação: nenhuma regra de jogo muda. Fica no fim do arquivo para vencer as regras acima.
   ========================================================= */

/* Toque mais rápido: sem o atraso de "duplo toque para zoom" e sem o flash azul do toque no Android/iOS. */
button, a, summary, label, [role="button"], .tile { touch-action: manipulation; -webkit-tap-highlight-color: transparent; }

/* O fundo pontilhado fixo vira uma camada própria: rolar a página não obriga a repintar a malha inteira. */
body::before { will-change: transform; }

/* Altura real da tela no celular (100vh conta a barra do navegador e corta o rodapé). */
@supports (height: 100dvh) {
  .modal { max-height: calc(100dvh - 32px); }
  .main-menu { min-height: calc(100dvh - 44px); }
}

@media (max-width: 700px) {
  /* Desfoque atrás das janelas pesa muito na GPU do celular: troca por um fundo mais opaco. */
  .modal-backdrop { backdrop-filter: none; background: color-mix(in srgb, var(--fundo) 82%, transparent); }

  #app, body:has(.side-rail) #app {
    padding-left: max(12px, env(safe-area-inset-left, 0px));
    padding-right: max(12px, env(safe-area-inset-right, 0px));
    padding-top: calc(12px + env(safe-area-inset-top, 0px));
  }

  /* Topo (HUD): no celular ele ocupava metade da tela grudado em cima. Fica compacto e rola junto com a página;
     o relógio do turno continua sempre à vista (abaixo). */
  .hud { position: static; margin: 0 0 12px; padding: 8px 10px; gap: 6px; }
  .hud .spacer { display: none; }
  .hud .chip { white-space: normal; height: auto; min-height: 28px; padding-block: 4px; line-height: 1.25; max-width: 100%; }
  .hud .stat { min-height: 0; padding: 3px 8px 3px 6px; gap: 6px; }
  .hud .stat-num { font-size: 15px; }
  .hud .stat-next { display: none; } /* a previsão continua no balão (title) */
  .hud .turn-clock {
    position: fixed;
    z-index: 30;
    top: calc(8px + env(safe-area-inset-top, 0px));
    right: max(8px, env(safe-area-inset-right, 0px));
    background: var(--superficie);
    box-shadow: var(--sombra-flutua);
  }
  .hud:has(.turn-clock) { margin-top: 36px; } /* abre espaço para o relógio fixo não cobrir a 1ª linha do topo */

  /* Barra de navegação horizontal: rola de lado sem mostrar a barra de rolagem; alvos de toque maiores. */
  .side-rail { scrollbar-width: none; -webkit-overflow-scrolling: touch; }
  .side-rail::-webkit-scrollbar { display: none; }
  .rail-item { min-height: 48px; flex: 0 0 auto; }

  /* Barra do turno colada no rodapé, mais enxuta */
  .turn-dock, .launch-dock { padding: 8px 10px; gap: 8px; margin-top: 12px; border-radius: 10px 10px 0 0; }

  /* Janelas (regras, sair, etc.) cabem na tela */
  .modal { padding: 18px 16px; }
  .modal.rules-modal { padding: 20px 16px 18px; border-radius: 14px; }
  .year-card { padding: 18px 16px 14px; }

  .toast { max-width: calc(100vw - 32px); text-align: center; bottom: calc(84px + env(safe-area-inset-bottom, 0px)); }

  /* iOS dá zoom na página ao focar campo com fonte menor que 16px (ex.: código da sala) */
  input, select, textarea { font-size: 16px; }
}

@media (max-width: 600px) {
  /* Botões: altura mínima confortável para o dedo e texto que quebra linha em vez de vazar da tela. */
  button { height: auto; min-height: 40px; padding-block: 6px; white-space: normal; }
  button.small { min-height: 34px; }

  /* Tabuleiro: o miolo do anel tem só ~3 casas de largura no celular, pequeno demais para as cartas de decisão
     (dilema, terreno, fornecedor). Aqui a carta passa a cobrir o anel inteiro, como uma carta posta sobre a mesa,
     com fundo da planta; ao decidir, ela some e o tabuleiro volta. Os montes de cartas e as órbitas são só
     enfeite e saem para não brigar com a carta. */
  .board-screen .board-gadget { padding: 12px 8px 10px; border-radius: 16px; }
  .board-screen .board-gadget .ring-center { position: static; padding: 8px; }
  .board-screen .board-gadget .ring-center > .center-orbits,
  .board-gadget .center-court-decks { display: none; }
  .board-screen .board-gadget .ring-center > .center-cards {
    inset: 0;
    padding: 10px;
    border-radius: 12px;
    background: color-mix(in srgb, var(--bp-deep) 94%, transparent);
    box-shadow: 0 0 0 1px var(--bp-line);
    justify-content: flex-start;
  }
  .board-screen .board-gadget .center-cards > .tile-decision,
  .board-screen .board-gadget .center-cards > .outcome { width: 100%; }
  .build-options { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}

const RUMOR_TRUTH = 0.7;            // boatos acertam 70% das vezes

// ---------------------------------------------------------------- partida e turno

// setup = [{ name, missionId? }, ...] (1 a 4 agências); options = { sandbox, rng }
function startGame(state, setup, options = {}) {
  const rng = options.rng || Math.random;
  state.sandbox = Boolean(options.sandbox);
  state.players = setup.map((p, i) => createPlayer(i, p.name || t('act.defaultAgency', { n: i + 1 }), p.missionId || null));
  state.turn = 0;
  state.round = 1;
  state.log = [];
  state.sideFirsts = {};
  state.lots = {};
  state.dice = null;
  state.pendingTile = null;
  state.pendingDilemma = null;
  state.outcome = null;
  state.tip = null;
  state.yearChange = null;
  state.winners = [];
  state.gameOver = false;
  state.lastRoll = null;

  if (state.sandbox) {
    state.players.forEach((p) => { p.funds = SANDBOX_FUNDS; p.tech = SANDBOX_TECH; p.unlocked = allDiscoverableIds(); });
    state.screen = 'workshop';
    pushLog(state, t('act.sandboxStart'));
    return null;
  }

  const sides = drawSides(state.players.length, rng);
  state.players.forEach((p, i) => assignSide(p, sides[i]));
  if (state.players.length === 1) state.players.push(createBot(state.players[0], rng));

  pushLog(state, t('act.raceStart', { year: yearOf(MAX_ROUNDS) }));
  state.players.forEach((p) => pushLog(state, t('act.playsSide', { name: p.name, side: SIDES[p.side].name })));
  state.players.filter((p) => !p.bot).forEach((p) => {
    p.hideNeeds = true; // os mínimos de ciência e comunicação da missão começam escondidos (sim/needs.js)
    setMission(state, p, p.missionId); // kit do 1º degrau
  });
  startTurn(state);
  state.screen = humans(state).length > 1 ? 'handoff' : 'board';
  return null;
}

function assignSide(p, sideId) {
  const side = SIDES[sideId];
  p.side = sideId;
  p.launcherTech = side.launcherTech;
  p.funds += side.startFunds;
  p.missionId = side.ladder[0];
}

// Muda a missão atual (o degrau da escada). No jogo normal revela o kit do degrau (as peças mínimas
// para fechar o projeto) e já deixa a órbita da missão escolhida, que não é decisão do jogador.
// Muda a missão atual (o degrau da escada). No jogo normal a órbita da missão já vem escolhida (não é decisão do
// jogador). As PEÇAS não vêm de graça: a blueprint de cada uma é conquistada nos fornecedores (sim/suppliers.js).
function setMission(state, p, missionId) {
  p.missionId = missionId;
  if (!missionId || state.sandbox) return;
  p.spacecraft.orbitId = MISSIONS[missionId].orbit;
}

// Com a nave em voo a oficina fica fechada no jogo normal: o kit do próximo degrau só é liberado quando
// o degrau atual é cumprido (completeMission). O sandbox continua livre.
// Agir (comprar, vender, escolher foguete/órbita, ensaiar, lançar) exige o peão numa casa de oficina. Ver é livre.
const workshopLock = (state, p) =>
  (state.sandbox || atWorkshopTile(p) ? null : t('act.lock.workshop'));

const inFlightLock = (state, p) =>
  (!state.sandbox && p.flight ? t('act.lock.inFlight') : null);


// ---------------------------------------------------------------- retorno imediato ao jogador
// Depois de uma escolha ou de parar numa casa, o jogador vê na hora o que aconteceu (a UI mostra no
// centro do tabuleiro, sem pedir confirmação; some no próximo turno). Só o diário guardava isso antes.
//   changes = variações numéricas (verba, tecnologia, proteção); notes = o que mais aconteceu;
//   choice = a opção escolhida; lesson = o porquê.

const statsOf = (p) => ({ funds: p.funds, tech: p.tech, shields: p.shields, discount: p.discount || 0, launchRisk: p.launchRisk || 0 });

function changesBetween(before, after) {
  return [['funds', t('res.funds')], ['tech', t('res.tech')], ['shields', t('act.shieldLabel')]]
    .filter(([key]) => after[key] !== before[key])
    .map(([key, label]) => ({ label, value: after[key] - before[key] }));
}

// Efeitos que não são um número simples viram frases.
function extrasBetween(before, after) {
  const extras = [];
  if (after.discount > before.discount) extras.push(t('act.extra.discount', { n: after.discount }));
  if (after.launchRisk > before.launchRisk) extras.push(t('act.extra.launchRisk', { n: Math.round((after.launchRisk - before.launchRisk) * 100) }));
  return extras;
}

// Dica contextual (Etapa 5): a 1ª vez que algo acontece o jogo explica na hora, uma única vez por jogador.
// A UI só lê `state.tip` (texto em ui/guide.js); sandbox e bots não recebem.
function raiseTip(state, p, id, item = null) {
  if (state.sandbox || p.bot || p.tipsSeen.includes(id)) return;
  p.tipsSeen.push(id);
  state.tip = { playerId: p.id, id, item };
}

function setOutcome(state, p, outcome) {
  state.outcome = { playerId: p.id, choice: null, changes: [], notes: [], lesson: null, ...outcome };
}

// Bot do solo: o outro lado, cumprindo cada degrau no ano real (±1). Se o lado nunca cumpriu, nunca cumpre.
function createBot(human, rng) {
  const sideId = human.side === 'usa' ? 'ussr' : 'usa';
  const bot = createPlayer(1, t('act.rivalAgency', { side: SIDES[sideId].name }));
  bot.bot = true;
  assignSide(bot, sideId);
  bot.schedule = ladderOf(bot).map((m) => {
    const real = REAL_HISTORY[m].sides[sideId];
    return real == null ? null : real + Math.floor(rng() * 3) - 1;
  });
  return bot;
}

// Início do turno. No "Ano novo" (1ª rodada de cada ano): verba e tecnologia.
function startTurn(state) {
  const p = currentPlayer(state);
  p.rolled = false;
  p.flightAdvanced = false;
  p.launchedThisTurn = false;
  p.rehearsedThisTurn = false;
  state.dice = null;
  state.pendingTile = null;
  state.pendingDilemma = null;
  state.outcome = null;
  state.tip = null;
  if (p.bot) return;
  // A sabotagem só vale no ano em que foi armada.
  if (p.interference && p.interference.year !== yearOf(state.round)) p.interference = null;
  if (isNewYear(state.round)) {
    const income = yearlyIncome(p, yearOf(state.round));
    const { funds, tech } = income;
    p.funds += funds;
    p.tech += tech;
    pushLog(state, t('act.newYear', { name: p.name, funds, tech, level: p.tech }), p.id);
    // Registro estruturado da virada: a UI anima o calendário e mostra o que entrou (só para este jogador).
    state.yearChange = {
      playerId: p.id, round: state.round, year: yearOf(state.round),
      funds, tech, techLevel: p.tech, parts: income.parts, techParts: income.techParts,
    };
  }
}

// Turno do bot: cumpre os degraus cujo ano chegou. Tudo privado (rival escondido).
function botTurn(state) {
  const bot = currentPlayer(state);
  const year = yearOf(state.round);
  const ladder = ladderOf(bot);
  while (bot.step < ladder.length && bot.schedule[bot.step] != null && year >= bot.schedule[bot.step]) {
    const missionId = ladder[bot.step];
    bot.completed.push({ missionId, year, science: 0 });
    bot.bestStage[missionId] = flightPlan(missionId).length;
    bot.step += 1;
    bot.missionId = ladder[bot.step] || null;
    pushLog(state, t('act.botCompleted', { name: bot.name, mission: MISSIONS[missionId].name }), bot.id);
  }
}

function endTurn(state) {
  const p = currentPlayer(state);
  if (state.sandbox) {
    state.screen = p.flight ? 'flight' : 'workshop';
    return null;
  }
  if (!p.rolled) return t('gd.block.roll');
  if (state.pendingDilemma) return t('gd.block.dilemma');
  if (p.flight?.pending) return t('gd.block.flightPending');
  if (p.flight && !p.flightAdvanced) return t('gd.block.advance');
  advanceTurn(state);
  return null;
}

// Passa para o próximo jogador humano; o bot joga sozinho no caminho.
function advanceTurn(state) {
  for (;;) {
    state.turn = (state.turn + 1) % state.players.length;
    if (state.turn === 0) {
      endRound(state);
      if (state.gameOver) return;
      state.round += 1;
      if (isNewYear(state.round)) pushLog(state, t('act.yearBegins', { year: yearOf(state.round) }));
    }
    startTurn(state);
    if (!currentPlayer(state).bot) break;
    botTurn(state);
  }
  state.screen = humans(state).length > 1 ? 'handoff' : 'board';
}

// Desempate: progresso na escada, depois degraus, depois ciência entregue, depois verba.
function rankKey(p) {
  const prog = ladderProgress(p);
  return [prog.pct, prog.steps, p.completed.reduce((s, c) => s + c.science, 0), p.funds];
}
function compareRank(a, b) {
  const ka = rankKey(a);
  const kb = rankKey(b);
  for (let i = 0; i < ka.length; i += 1) if (ka[i] !== kb[i]) return kb[i] - ka[i];
  return 0;
}

// Fim da rodada: termina antes de declarar vencedor, para todos jogarem o mesmo número de turnos.
function endRound(state) {
  const done = state.players.filter((p) => ladderProgress(p).done);
  const timeUp = state.round >= MAX_ROUNDS;
  if (!done.length && !timeUp) return;
  const pool = done.length ? done : state.players;
  const sorted = [...pool].sort(compareRank);
  state.winners = sorted.filter((p) => compareRank(p, sorted[0]) === 0).map((p) => p.id);
  state.gameOver = true;
  state.endReason = done.length ? 'ladder' : 'time';
  state.screen = 'gameover';
  const names = state.winners.map((id) => state.players[id].name).join(' e ');
  pushLog(state, done.length ? t('act.endLadder', { names }) : t('act.endTime', { year: yearOf(state.round), names }));
}

// ---------------------------------------------------------------- tabuleiro

// Quem está em último na corrida recebe o choque do Sputnik e desconto no upgrade.
function isLastPlayer(state, player) {
  return state.players.every((p) => compareRank(player, p) >= 0);
}

// Rola 2 dados; o jogador escolhe qual usar (IDEIA.md v3: ainda tem sorte, mas ele sente que decidiu).
function rollDice(state, rng = Math.random) {
  const p = currentPlayer(state);
  if (state.sandbox) return t('act.noBoardSandbox');
  if (p.rolled || state.dice) return t('act.alreadyRolled');
  state.dice = [rollDie(rng), rollDie(rng)];
  return null;
}

function moveBy(state, index, rng = Math.random) {
  const p = currentPlayer(state);
  if (!state.dice) return t('act.rollFirst');
  const steps = state.dice[index];
  if (!steps) return t('act.invalidDie');
  state.dice = null;
  const moved = movePlayer(p, steps);
  const tile = TILES[moved.position];
  const { player, messages } = applyTile(moved, tile, { isLast: isLastPlayer(state, p) });
  Object.assign(p, player);
  p.rolled = true;
  state.lastRoll = steps;
  pushLog(state, t('act.movedTo', { name: p.name, steps, tile: tile.label }), p.id);
  messages.forEach((m) => pushLog(state, `${p.name}: ${m}`, p.id));

  // Retorno imediato: o que a casa deu (casas de decisão e de evento mostram a própria carta).
  if (messages.length) setOutcome(state, p, { title: t('act.stoppedAt', { tile: tile.label }), notes: messages });
  else state.outcome = null;

  if (tile.type === 'workshop') raiseTip(state, p, 'workshop');

  // Fornecedor: até 4 ofertas de blueprint (as do kit do degrau atual vêm primeiro); o jogador escolhe e paga (a 1ª é de graça).
  if (tile.type === 'shop') {
    const offers = makeOffers(p, rng);
    if (offers.length) state.pendingTile = { tileId: tile.id, kind: 'supplier', offers };
    else pushLog(state, t('act.noNewBlueprint', { name: p.name }), p.id);
  }

  if (tile.type === 'lot') {
    const lot = state.lots[tile.id];
    if (!lot) state.pendingTile = { tileId: tile.id, kind: 'build' };
    else if (lot.ownerId !== p.id) state.pendingTile = { tileId: tile.id, kind: 'use' };
    else pushLog(state, t('act.lotYours', { name: p.name, building: BUILDINGS[lot.buildingId].name }), p.id);
  }

  if (tile.type === 'spy') {
    if (state.players.length < 2) pushLog(state, t('act.noRivalsSpy', { name: p.name }), p.id);
    else if (p.lastSpyYear === yearOf(state.round)) pushLog(state, t('act.spyUsed', { name: p.name }), p.id);
    else state.pendingTile = { tileId: tile.id, kind: 'spy' };
  }

  // Evento: com a nave em voo vira imprevisto na próxima etapa; em solo, carta de dilema.
  if (tile.type === 'event') {
    if (p.flight) {
      const eventId = pickEvent(rng).id;
      p.flight.tileEvent = eventId;
      pushLog(state, t('act.flightEventIncoming', { name: p.name, event: FLIGHT_EVENTS[eventId].title }), p.id);
    } else {
      state.pendingDilemma = { id: pickDilemma(p, rng).id };
    }
  }
  return null;
}

// Atalho: rola e anda com o primeiro dado (usado nos testes).
function rollAndMove(state, rng = Math.random) {
  return rollDice(state, rng) || moveBy(state, 0, rng);
}

// `notes` (opcional) recebe frases para o retorno imediato ao jogador (aposta, boato).
function applyEffect(state, p, e, rng, notes = []) {
  if (e.gamble) {
    const won = rng() < e.gamble.chance;
    pushLog(state, `${p.name}: ${won ? t('act.gambleWonLog') : t('act.gambleLostLog')}`, p.id);
    notes.push(won ? t('act.gambleWon') : t('act.gambleLost'));
    applyEffect(state, p, won ? e.gamble.win : e.gamble.lose, rng, notes);
    return;
  }
  if (e.funds) p.funds = Math.max(0, p.funds + e.funds);
  if (e.tech) p.tech = Math.max(0, p.tech + e.tech);
  if (e.discount) p.discount = Math.max(p.discount, e.discount);
  if (e.shield) p.shields += e.shield;
  if (e.launchRisk) p.launchRisk = (p.launchRisk || 0) + e.launchRisk;
  if (e.rumor) spreadRumor(state, p, rng, notes);
}

function chooseDilemma(state, index, rng = Math.random) {
  const p = currentPlayer(state);
  const card = DILEMMAS.find((d) => d.id === state.pendingDilemma?.id);
  if (!card) return t('act.noDilemma');
  const option = card.options[index];
  if (!option) return t('act.invalidOption');
  state.pendingDilemma = null;
  pushLog(state, t('act.dilemmaLog', { name: p.name, title: card.title, label: option.label, lesson: option.lesson }), p.id);
  const before = statsOf(p);
  const notes = [];
  applyEffect(state, p, option.effect, rng, notes);
  const after = statsOf(p);
  setOutcome(state, p, {
    title: card.title,
    choice: option.label,
    changes: changesBetween(before, after),
    notes: [...notes, ...extrasBetween(before, after)],
    lesson: option.lesson,
  });
  return null;
}

// Boato: informação vaga sobre um rival, às vezes errada.
function spreadRumor(state, p, rng, notes = []) {
  const rivals = state.players.filter((r) => r.id !== p.id);
  if (!rivals.length) return;
  const rival = rivals[Math.floor(rng() * rivals.length)];
  const total = ladderOf(rival).length;
  const truth = rng() < RUMOR_TRUTH;
  const shown = truth ? rival.step : Math.max(0, Math.min(total, rival.step + (rng() < 0.5 ? -1 : 1)));
  p.intel[rival.id] = { year: yearOf(state.round), rumor: true, steps: shown, total };
  const text = t('act.rumorText', { name: rival.name, shown, total });
  pushLog(state, text, p.id);
  notes.push(text);
}

// Espionagem: paga e vê o estado real de um rival (degrau atual e quanto a nave está pronta).
// Sabotar em vez de observar (mesma casa, mesma ação anual). Contra um jogador arma uma "interferência na telemetria"
// que chega na etapa final do voo dele; contra o bot do solo atrasa o próximo degrau dele em 1 ano.
function sabotage(state, rivalId) {
  const p = currentPlayer(state);
  if (state.pendingTile?.kind !== 'spy') return t('act.notSpyTile');
  const rival = state.players.find((r) => r.id === rivalId && r.id !== p.id);
  if (!rival) return t('act.invalidRival');
  if (p.funds < SABOTAGE_COST) return t('act.sabotageCost', { cost: SABOTAGE_COST });
  if (rival.interference) return t('act.sabotageArmed', { name: rival.name });
  if (rival.bot && (rival.step >= ladderOf(rival).length || rival.schedule[rival.step] == null)) return t('act.noStepToDelay', { name: rival.name });
  if (rival.bot && rival.delayedStep === rival.step) return t('act.alreadyDelayed', { name: rival.name });
  p.funds -= SABOTAGE_COST;
  p.lastSpyYear = yearOf(state.round);
  state.pendingTile = null;
  let note;
  if (rival.bot) {
    rival.schedule[rival.step] += 1;
    rival.delayedStep = rival.step; // só um atraso por degrau (senão, 1 sabotagem por ano o seguraria para sempre)
    note = t('act.sabotageBotNote', { name: rival.name });
  } else {
    rival.interference = { fromId: p.id, year: yearOf(state.round) };
    note = t('act.sabotageNote', { name: rival.name });
  }
  pushLog(state, t('act.sabotageLog', { name: p.name, cost: SABOTAGE_COST, rival: rival.name }), p.id);
  setOutcome(state, p, {
    title: t('act.sabotageTitle', { name: rival.name }),
    changes: [{ label: t('res.funds'), value: -SABOTAGE_COST }],
    notes: [note, t('act.sabotageHint')],
  });
  return null;
}

function spyOn(state, rivalId) {
  const p = currentPlayer(state);
  if (state.pendingTile?.kind !== 'spy') return t('act.notSpyTile');
  const rival = state.players.find((r) => r.id === rivalId && r.id !== p.id);
  if (!rival) return t('act.invalidRival');
  if (p.funds < SPY_COST) return t('act.spyCost', { cost: SPY_COST });
  p.funds -= SPY_COST;
  p.lastSpyYear = yearOf(state.round);
  p.intel[rival.id] = spyReport(state, rival);
  state.pendingTile = null;
  pushLog(state, t('act.spyLog', { name: p.name, cost: SPY_COST, rival: rival.name }), p.id);
  const r = p.intel[rival.id];
  const ship = r.inFlight ? t('act.spyShipFlying', { n: r.stage + 1, total: r.stages }) : r.ready != null ? t('act.spyShipReady', { pct: Math.round(r.ready * 100) }) : r.note || '';
  setOutcome(state, p, {
    title: t('act.spyTitle', { name: rival.name }),
    changes: [{ label: t('res.funds'), value: -SPY_COST }],
    notes: [t('act.spyNote', { steps: r.steps, total: r.total, mission: r.mission ? t('act.spyAiming', { mission: r.mission }) : '', ship: ship ? `; ${ship}` : '' }), t('act.spySaved')],
  });
  return null;
}

function spyReport(state, rival) {
  const ladder = ladderOf(rival);
  const report = {
    year: yearOf(state.round),
    rumor: false,
    steps: rival.step,
    total: ladder.length,
    mission: rival.missionId ? MISSIONS[rival.missionId].name : null,
  };
  if (rival.bot) return { ...report, note: t('act.spyBotNote') };
  if (rival.flight) {
    return { ...report, mission: MISSIONS[rival.flight.missionId].name, inFlight: true, stage: rival.flight.stageIndex, stages: rival.flight.plan.length };
  }
  const checks = checkDesign(rival, { evaluate: true }).checks.filter((c) => c.hard); // o espião vê a verdade
  return { ...report, ready: checks.length ? checks.filter((c) => c.ok).length / checks.length : 0 };
}

// Terreno livre: constrói um prédio novo (nível 1). Upgrade depois é de qualquer lugar.
function buildOnLot(state, buildingId) {
  const p = currentPlayer(state);
  const pending = state.pendingTile;
  if (!pending || pending.kind !== 'build') return t('act.notFreeLot');
  if (!BUILDINGS[buildingId]) return t('act.unknownBuilding');
  if (p.buildings[buildingId] > 0) return t('act.alreadyHaveBuilding', { building: BUILDINGS[buildingId].name });
  const cost = upgradeCost(0);
  if (p.funds < cost) return t('act.buildCost', { cost });
  p.funds -= cost;
  p.buildings[buildingId] = 1;
  state.lots[pending.tileId] = { ownerId: p.id, buildingId };
  state.pendingTile = null;
  pushLog(state, t('act.builtLog', { name: p.name, building: BUILDINGS[buildingId].name }));
  setOutcome(state, p, {
    title: t('act.builtTitle', { building: BUILDINGS[buildingId].name }),
    changes: [{ label: t('res.funds'), value: -cost }],
    notes: [BUILDINGS[buildingId].effect, t('act.upgradeInPanel')],
  });
  return null;
}

const useFeeFor = (level) => USE_FEE + 2 * (level - 1);

// Prédio de outro jogador: paga a taxa ao dono e recebe o efeito uma vez. Os dois ganham.
function useRivalBuilding(state, rng = Math.random) {
  const p = currentPlayer(state);
  const pending = state.pendingTile;
  if (!pending || pending.kind !== 'use') return t('act.noRivalBuilding');
  const lot = state.lots[pending.tileId];
  const owner = state.players[lot.ownerId];
  const building = BUILDINGS[lot.buildingId];
  const fee = useFeeFor(owner.buildings[lot.buildingId]);
  if (p.funds < fee) return t('act.feeCost', { fee });
  const before = statsOf(p);
  p.funds -= fee;
  owner.funds += fee;
  applyEffect(state, p, building.useEffect, rng); // `rng` injetável: o simulador (scripts/simulate.mjs) repete partidas
  state.pendingTile = null;
  pushLog(state, t('act.usedLog', { name: p.name, fee, owner: owner.name, building: building.name }));
  const after = statsOf(p);
  setOutcome(state, p, {
    title: t('act.usedTitle', { building: building.name, owner: owner.name }),
    changes: changesBetween(before, after),
    notes: [...extrasBetween(before, after), t('act.ownerReceived', { owner: owner.name, fee })],
  });
  return null;
}

function skipTile(state) {
  state.pendingTile = null;
  return null;
}

// Fornecedor: compra uma das ofertas da visita. A blueprint é pesquisa (paga uma vez, vale para sempre); a peça física
// ainda é paga na oficina. A PRIMEIRA blueprint da partida é de graça. A visita continua aberta até acabarem as ofertas
// ou o jogador seguir (skipTile).
function buyBlueprint(state, itemId) {
  const p = currentPlayer(state);
  const pending = state.pendingTile;
  if (!pending || pending.kind !== 'supplier') return t('act.notSupplier');
  if (!pending.offers.includes(itemId)) return t('act.notInOffers');
  const free = !p.freeBlueprintUsed;
  const price = blueprintCostFor(p, itemId);
  if (p.funds < price) return t('act.blueprintCost', { price });
  p.funds -= price;
  p.freeBlueprintUsed = true;

  setOutcome(state, p, {
    title: t('act.blueprintTitle', { item: nameOf(itemId) }),
    changes: price ? [{ label: t('res.funds'), value: -price }] : [],

function upgradeBuilding(state, buildingId) {
  const p = currentPlayer(state);
  if (state.sandbox) return t('act.noBuildingsSandbox');
  const level = p.buildings[buildingId];
  if (!level) return t('act.buildFirst');
  if (level >= MAX_LEVEL) return t('act.maxLevel');
  const cost = upgradeCostFor(state, p, buildingId);
  if (p.funds < cost) return t('act.upgradeCost', { cost });
  p.funds -= cost;
  p.buildings[buildingId] = level + 1;
  pushLog(state, t('act.upgradeLog', { name: p.name, building: BUILDINGS[buildingId].name, level: level + 1, cost }), p.id);
  // Retorno imediato: o clique em "subir" mostra o custo e o que o novo nível rende.
  setOutcome(state, p, {
    title: t('act.upgradeTitle', { building: BUILDINGS[buildingId].name, level: level + 1, max: MAX_LEVEL }),
    changes: [{ label: t('res.funds'), value: -cost }],
    notes: [BUILDINGS[buildingId].effect, level + 1 >= MAX_LEVEL ? t('act.maxLevelNote') : t('act.nextLevel', { cost: upgradeCostFor(state, p, buildingId) })],
  });

}

// Quem está em último paga metade no upgrade (freio contra bola de neve).
function upgradeCostFor(state, player, buildingId) {
  const base = upgradeCost(player.buildings[buildingId]);
  const behind = state.players.length > 1 && isLastPlayer(state, player);
  return behind ? Math.round(base * CATCHUP_UPGRADE_DISCOUNT) : base;
