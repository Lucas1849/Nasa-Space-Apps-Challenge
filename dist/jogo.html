// Sem eliminação: com pouca verba, a agência pede socorro e perde tecnologia.
function requestBailout(state) {
  const p = currentPlayer(state);
  if (p.funds >= BAILOUT_LIMIT) return t('act.bailoutLimit', { limit: BAILOUT_LIMIT });
  p.funds += BAILOUT_FUNDS;
  // Piso de tecnologia 1: toda peça exige pelo menos 1. Com a pesquisa básica de 2 em 2 anos, descer a 0 trancaria a
  // agência fora da oficina por até 2 anos, e o socorro de emergência não pode ser uma armadilha.
  const lost = Math.min(BAILOUT_TECH_COST, Math.max(0, p.tech - TECH_FLOOR));
  p.tech -= lost;
  p.bailouts += 1;
  pushLog(state, t('act.bailoutLog', { name: p.name, funds: BAILOUT_FUNDS, tech: lost ? t('act.bailoutTechLost', { lost }) : t('act.bailoutNoTech') }), p.id);
  return null;
}

// ---------------------------------------------------------------- missão e oficina

// Só no sandbox: no jogo normal a missão é o degrau atual da escada.
function chooseMission(state, missionId) {
  const p = currentPlayer(state);
  if (!state.sandbox) return t('act.missionIsStep');
  if (!MISSIONS[missionId]) return t('act.unknownMission');
  if (p.flight) return t('act.waitFlightSwap');
  p.missionId = missionId;
  pushLog(state, t('act.choseMission', { name: p.name, mission: MISSIONS[missionId].name }), p.id);
  checkMilestones(state, p);
  return null;
}

function buyItem(state, itemId) {
  const p = currentPlayer(state);
  const locked = inFlightLock(state, p) || workshopLock(state, p);
  if (locked) return locked;
  const item = CATALOG[itemId];
  if (!isDiscovered(p, item)) return t('act.noBlueprint', { name: item.name });
  if (isLocked(p, item)) return t('act.itemLocked', { name: item.name, req: requiredTech(p, item), tech: p.tech });
  const price = priceFor(p, itemId);
  if (p.funds < price) return t('act.itemCost', { name: item.name, price });
  p.funds -= price;
  const bucket = INSTRUMENTS[itemId] ? p.spacecraft.instruments : p.spacecraft.parts;
  bucket.push(itemId);
  pushLog(state, t('act.boughtLog', { name: p.name, item: item.name, price }), p.id);
  raiseTip(state, p, 'part');
  p.discount = 0; // desconto de evento vale para uma compra (a Fábrica é permanente)
  checkMilestones(state, p);
  return null;
}

// Antes de voar, revende pelo valor cheio (regra do IDEIA.md).
function sellItem(state, itemId) {
  const p = currentPlayer(state);
  const locked = inFlightLock(state, p) || workshopLock(state, p);
  if (locked) return locked;
  const bucket = INSTRUMENTS[itemId] ? p.spacecraft.instruments : p.spacecraft.parts;
  const idx = bucket.indexOf(itemId);
  if (idx === -1) return t('act.itemNotOnboard');
  bucket.splice(idx, 1);
  const refund = refundFor(itemId); // sucata: metade do custo base (sim/resources.js)
  p.funds += refund;
  pushLog(state, t('act.soldLog', { name: p.name, item: CATALOG[itemId].name, refund }), p.id);
  return null;
}

function chooseLauncher(state, launcherId) {
  const p = currentPlayer(state);
  const locked = inFlightLock(state, p) || workshopLock(state, p);
  if (locked) return locked;
  const launcher = LAUNCHERS[launcherId];
  if (!isDiscovered(p, launcher)) return t('act.noBlueprint', { name: launcher.name });
  if (isLocked(p, launcher)) return t('act.itemLocked', { name: launcher.name, req: requiredTech(p, launcher), tech: p.tech });
  p.spacecraft.launcherId = launcherId;
  checkMilestones(state, p);
  return null;
}

function chooseOrbit(state, orbitId) {
  const p = currentPlayer(state);
  const locked = inFlightLock(state, p) || workshopLock(state, p);
  if (locked) return locked;
  p.spacecraft.orbitId = orbitId;
  checkMilestones(state, p);
  return null;
}

// ---------------------------------------------------------------- degraus (milestones)

// Bônus só uma vez por missão (chave `${missionId}:${milestoneId}`). Efeitos: funds, discount, shield.
function grant(state, player, milestoneId, missionId = player.missionId) {
  const key = `${missionId}:${milestoneId}`;
  if (!missionId || player.milestones.includes(key)) return;
  const ms = MISSIONS[missionId].milestones.find((m) => m.id === milestoneId);
  player.milestones.push(key);
  if (ms.effect.type === 'funds') player.funds += ms.effect.value;
  if (ms.effect.type === 'discount') player.discount = Math.max(player.discount, ms.effect.value);
  if (ms.effect.type === 'shield') player.shields += ms.effect.value;
  pushLog(state, t('act.milestoneLog', { name: player.name, ms: ms.name, effect: describeEffect(ms.effect) }), player.id);
}

function describeEffect(effect) {
  if (effect.type === 'funds') return t('act.effectFunds', { n: effect.value });
  if (effect.type === 'discount') return t('act.effectDiscount', { n: effect.value });
  return t('act.effectShield');
}

function checkMilestones(state, player) {
  if (player.missionId && !player.flight && checkDesign(player).designOk) grant(state, player, 'design_ready');
}

// ---------------------------------------------------------------- voo em etapas

// Ensaio em solo: por um custo pequeno (sem gastar foguete), diz em palavras se a nave atende aos mínimos
// escondidos da missão. Não dá o número: para isso é preciso lançar e errar (sim/needs.js).

  if (inFlight) return inFlight;
  if (!p.missionId) return t('act.ladderDone');
  if (!isHidden(p)) return t('act.reqsKnown');
  if (p.rehearsedThisTurn) return t('act.rehearseOnce');
  if (p.funds < REHEARSAL_COST) return t('act.rehearseCost', { cost: REHEARSAL_COST });
  p.funds -= REHEARSAL_COST;
  p.rehearsedThisTurn = true;
  const results = assessNeeds(p);
  const short = results.filter((r) => !r.ok);
  pushLog(state, t('act.rehearseLog', { name: p.name, mission: MISSIONS[p.missionId].name }), p.id);
  setOutcome(state, p, {
    where: 'workshop', // a oficina mostra este resultado (os da casa do tabuleiro ficam no tabuleiro)
    title: t('act.rehearseTitle'),
    changes: [{ label: t('res.funds'), value: -REHEARSAL_COST }],
    notes: [
      ...results.map((r) => `${r.label[0].toUpperCase()}${r.label.slice(1)}: ${r.status}.`),
      short.length ? t('act.rehearseShort') : t('act.rehearseOk'),
    ],
  });
  return null;
}

// Lança: paga o lançador, a nave sai da oficina e a SUBIDA é sorteada na hora (encerra o turno).
function launch(state, rng = Math.random) {
  const p = currentPlayer(state);
  if (!p.missionId) return state.sandbox ? t('act.chooseMissionFirst') : t('act.ladderDone');
  if (p.flight) return t('act.alreadyInFlight');
  const away = workshopLock(state, p);
  if (away) return away;
  if (!state.sandbox && !p.rolled) return t('act.moveBeforeLaunch');
  if (!state.sandbox && p.launchedThisTurn) return t('act.launchOnce');
  const design = checkDesign(p);
  if (!design.ok) return t('act.designPending');
  p.funds -= design.totals.launchCost;
  p.launches += 1;
  raiseTip(state, p, 'launch');
  grant(state, p, 'launched');
  const missionId = p.missionId;
  p.flight = {
    missionId,
    plan: flightPlan(missionId),
    stageIndex: 0,
    craft: p.spacecraft,
    modifiers: { sciencePenalty: 0, lifetimeDelta: 0 },
    stages: [],
    pending: null,
    tileEvent: null,
    last: null,
  };
  // A nave da oficina sai zerada (lançador e órbita ficam). No jogo normal a missão continua sendo este degrau
  // até o voo terminar: o kit do próximo só é liberado ao cumpri-lo (completeMission) e a oficina fica fechada.
  p.spacecraft = { ...emptySpacecraft(), launcherId: p.flight.craft.launcherId, orbitId: p.flight.craft.orbitId };
  p.launchedThisTurn = true;
  p.flightAdvanced = true;
  // Lançar é público (o mundo vê um foguete subir): todos ficam sabendo e o peão ganha o marcador "em voo".
  // O que continua secreto: a nave por dentro e se o voo deu certo (só o espião ou o fim da partida revelam).
  pushLog(state, t('act.launchLog', { name: p.name, mission: MISSIONS[missionId].name }));
  const stageId = p.flight.plan[0];
  const risk = stageRisk(flyer(p), stageId);
  p.launchRisk = 0; // o defeito ignorado só pesa nesta subida
  resolveStage(state, p, stageId, risk, { label: t('milestone.launched') }, rng);
  return null;
}

// Prepara a próxima etapa: imprevisto da casa de evento onde o jogador parou (ou garantido nas chegadas).
function advanceFlight(state, rng = Math.random) {
  const p = currentPlayer(state);
  if (!p.flight) return t('fl.noFlight');
  if (p.flight.pending) { state.screen = 'flight'; return null; }
  if (!state.sandbox) {
    if (!p.rolled) return t('act.moveBeforeAdvance');
    if (p.flightAdvanced) return t('act.oneAdvancePerTurn');
  }
  const stageId = p.flight.plan[p.flight.stageIndex];
  let eventId = p.flight.tileEvent;
  // Sabotagem armada por um rival: chega na etapa final, no lugar de qualquer outro imprevisto.
  if (p.interference && p.flight.stageIndex === p.flight.plan.length - 1) {
    const from = state.players.find((r) => r.id === p.interference.fromId);
    eventId = 'interference';
    pushLog(state, t('act.interferenceLog', { name: p.name }), p.id);
    if (from) pushLog(state, t('act.sabotageArrived', { from: from.name, name: p.name }), from.id);
    p.interference = null;
  }
  if (!eventId && STAGES[stageId].guaranteedEvent) eventId = pickEvent(rng).id;
  p.flight.tileEvent = null;
  p.flight.pending = { stageId, eventId: eventId || null };
  p.flightAdvanced = true;
  state.screen = 'flight';
  return null;
}

const combinePenalty = (a, b) => 1 - (1 - a) * (1 - b);

// O jogador escolheu uma opção da etapa: aplica a consequência e sorteia o risco.
function chooseStageOption(state, index, rng = Math.random) {
  const p = currentPlayer(state);
  const pending = p.flight?.pending;
  if (!pending) return t('act.noStagePending');
  const option = stageOptions(p, pending)[index];
  if (!option) return t('act.invalidOption');
  if (option.disabled) return t('act.optionNoFunds');
  const e = option.effect;
  if (e.funds) p.funds = Math.max(0, p.funds + e.funds);
  if (e.sciencePenalty) p.flight.modifiers.sciencePenalty = combinePenalty(p.flight.modifiers.sciencePenalty, e.sciencePenalty);
  if (e.lifetimeDelta) p.flight.modifiers.lifetimeDelta += e.lifetimeDelta;
  p.flight.pending = null;
  const event = pending.eventId ? FLIGHT_EVENTS[pending.eventId] : null;
  resolveStage(state, p, pending.stageId, option.risk, { event, label: option.label, lesson: option.lesson, effect: e }, rng);
  return null;
}

// Sorteia a etapa. Proteção absorve uma falha. Falha = nave perdida + dados de falha (+ consolação).
function resolveStage(state, p, stageId, risk, info, rng) {
  const stage = STAGES[stageId];
  let failed = rng() < risk.total;
  let usedShield = false;
  if (failed && p.shields > 0) {
    p.shields -= 1;
    usedShield = true;
    failed = false;
  }
  const record = {
    stageId,
    name: stage.name,
    risk: risk.total,
    riskText: describeRisk(risk),
    causes: risk.parts.filter((x, i) => i > 0 && x.value > 0).map((x) => x.text),
    success: !failed,
    usedShield,
    eventTitle: info.event?.title || null,
    choice: info.label,
    lesson: info.lesson || null,
    effect: info.effect || {},
  };
  p.flight.stages.push(record);
  p.flight.last = record;
  pushLog(state, t('act.stageLog', { name: p.name, stage: stage.name, result: failed ? t('act.stageFailed') : t('act.stagePassed'), pct: pct(risk.total), shield: usedShield ? t('rep.savedByShield') : '' }), p.id);

  if (failed) return failMission(state, p, stageId);

  p.flight.stageIndex += 1;
  const missionId = p.flight.missionId;
  p.bestStage[missionId] = Math.max(p.bestStage[missionId] || 0, p.flight.stageIndex);
  if (p.flight.stageIndex >= p.flight.plan.length) return completeMission(state, p);
  // Etapas contam: cada etapa superada já rende prestígio, mesmo que a nave falhe depois.
  p.funds += STAGE_BONUS;
  record.bonus = STAGE_BONUS;
  state.screen = 'flight';
  return null;
}

// Depois do voo, a oficina volta a mirar o degrau atual (se falhou) ou o próximo (se cumpriu).
function retarget(state, p) {
  if (!state.sandbox) setMission(state, p, ladderOf(p)[p.step] || null);
}

function failMission(state, p, stageId) {
  const stage = STAGES[stageId];
  const flight = p.flight;
  const ship = flyer(p);
  p.failureData[stage.system] = (p.failureData[stage.system] || 0) + 1;
  p.tech += 1;
  // Missão de consolação: a nave cumpre um objetivo menor e dá crédito parcial (não na subida).
  if (stage.consolation) p.funds += CONSOLATION_FUNDS;
  const last = flight.last;
  p.lastResult = {
    success: false,
    missionId: flight.missionId,
    stages: flight.stages,
    failedStage: stageId,
    system: stage.system,
    reasons: [
      t('act.failReason', { stage: stage.name, pct: pct(last.risk) }),
      ...(last.causes.length ? [t('act.failCauses', { causes: last.causes.join('; ') })] : [t('act.failNoCause')]),
    ],
    consolation: stage.consolation ? t('act.consolationText', { text: stage.consolation, funds: CONSOLATION_FUNDS }) : null,
    failureLesson: t('act.failureLesson', { system: SYSTEM_NAMES[stage.system], pct: pct(FAILURE_DATA_BONUS) }),
    checks: checkDesign(ship, { ...flight.modifiers, launched: true }).checks,
    score: 0,
    scienceDelivered: 0,
    craft: flight.craft,
  };
  p.flight = null;
  retarget(state, p);
  state.screen = 'report';
  return null;
}

function completeMission(state, p) {
  const flight = p.flight;
  const missionId = flight.missionId;
  const ship = flyer(p);
  const result = simulate(ship, { modifiers: { ...flight.modifiers, launched: true }, randomFailure: false });
  result.missionId = missionId;
  result.stages = flight.stages;
  result.craft = flight.craft;
  const year = yearOf(state.round);
  result.year = year;
  // Mínimos escondidos: depois da avaliação final eles passam a aparecer. Falhar por causa deles ensina:
  // +1 de tecnologia, só na primeira vez (não dá para abusar), e o relatório explica o que faltou.
  const wasHidden = isHidden(p, missionId);

  if (wasHidden) {
    learnNeeds(p, missionId);
    if (shortfalls.length) {
      p.tech += 1;
      const n = MISSIONS[missionId].needs;
      result.learning = t('act.learning', { science: n.science, comms: n.comms });
      pushLog(state, t('act.learnedLog', { name: p.name, mission: MISSIONS[missionId].name }), p.id);
    }
  }
  if (result.success) {
    p.completed.push({ missionId, year, science: result.scienceDelivered });
    grant(state, p, 'mission_complete', missionId);
    if (!state.sandbox && ladderOf(p)[p.step] === missionId) {
      p.step += 1;
      // Primeiro do lado leva o bônus cheio; quem chega depois no mesmo lado leva menos.
      const key = `${p.side}:${missionId}`;
      const first = state.sideFirsts[key] == null;
      if (first) state.sideFirsts[key] = p.id;
      const bonus = first ? STEP_BONUS_FIRST : STEP_BONUS_LATER;
      p.funds += bonus;
      result.stepBonus = { bonus, first };
    }
  }
  pushLog(state, t('act.missionResultLog', { name: p.name, mission: MISSIONS[missionId].name, result: result.success ? t('act.missionDone') : t('act.missionShort') }), p.id);
  p.lastResult = result;
  p.flight = null;
  // Cumprir o degrau passa a mirar o próximo; falhar mantém o degrau atual. As blueprints vêm dos fornecedores.
  retarget(state, p);
  state.screen = 'report';
  return null;
}

  const names = { board: t('step.board'), workshop: t('step.workshop'), flight: t('step.flight'), report: t('step.report') };
  const roundInYear = ((state.round - 1) % ROUNDS_PER_YEAR) + 1;
  // Recursos sempre à vista, em números grandes, com a previsão do próximo Ano novo (de onde vem o recurso).
  // Na interface enxuta a previsão fica só no balão, para não somar texto no começo.
  const roundsLeft = ROUNDS_PER_YEAR - ((state.round - 1) % ROUNDS_PER_YEAR);
  const income = state.sandbox || !player.side ? null : yearlyIncome(player, yearOf(state.round + roundsLeft)); // o próximo Ano novo
  const when = t(roundsLeft === 1 ? 'hud.inRounds.one' : 'hud.inRounds.other', { n: roundsLeft });
  const stat = (cls, iconName, label, value, title, next = null) => el('div', { class: `stat ${cls}`, title }, [
    icon(iconName, { size: 22, label }),
    el('div', { class: 'stat-body' }, [
      el('span', { class: 'stat-num num' }, value),
      el('span', { class: 'stat-label' }, label),
      next && !simple ? el('small', { class: 'stat-next' }, next) : null,
    ]),
  ]);
  return el('div', { class: 'hud' }, [
    state.sandbox ? el('span', { class: 'chip' }, [icon('flask', { size: 15 }), t('hud.sandbox')])
      : el('span', { class: 'chip year', title: t('hud.roundOfYear', { n: roundInYear, total: ROUNDS_PER_YEAR }) }, [icon('calendar', { size: 15 }), el('span', { class: 'num' }, yearOf(state.round)), simple ? null : el('small', {}, t('hud.roundShort', { n: roundInYear, total: ROUNDS_PER_YEAR }))]),
    el('div', { class: 'who' }, [avatar(player), player.name]),
    player.side ? el('span', { class: 'chip' }, sideBadge(player)) : null,
    el('span', { class: 'chip' }, mission
      ? [missionIcon(mission.id, { size: 15 }), state.sandbox ? mission.name : t('hud.step', { n: Math.min(prog.steps + 1, prog.total), total: prog.total, mission: mission.name }), player.flight ? t('hud.inFlightSuffix') : '']
      : state.sandbox ? [icon('target', { size: 15 }), t('hud.choosingMission')] : [icon('flag', { size: 15 }), t('hud.ladderComplete')]),
    stat('funds', 'coins', t('res.funds'), player.funds,
      income ? t('hud.fundsNext', { n: income.funds, parts: Object.entries({ [t('hud.part.budget')]: income.parts.base, [t('hud.part.side')]: income.parts.side, [t('hud.part.sponsor')]: income.parts.sponsor }).filter(([, v]) => v).map(([k, v]) => `${k} ${v > 0 ? '+' : ''}${v}`).join(', ') }) : t('res.funds'),
      income ? `+${income.funds} ${when}` : null),
    state.sandbox ? null : stat('tech', 'chip', t('res.tech'), player.tech,
      income ? t('hud.techNext', { n: income.tech, slow: income.techParts.base ? '' : t('hud.techSlow') }) : t('res.techTitle'),
      income ? `+${income.tech} ${when}` : null),
    player.shields || (!simple && !state.sandbox) ? stat('shield', 'shield', t('res.shields'), player.shields, t('res.shieldsTitle')) : null,
    actions ? turnClock(state) : null,
    el('span', { class: 'spacer' }),
    // Sem `actions` (tela só de leitura) a trilha de etapas fica no topo; com `actions` ela vira a navegação
    // da barra lateral.
    !actions && !simple ? el('div', { class: 'steps' }, steps.map((s) => el('span', { class: s === step ? 'on' : '' }, names[s]))) : null,
    actions ? sideRail(state, player, step, actions, steps, names, simple) : null,
  ]);
}

// Barra lateral fixa (padrão de aplicativos de trabalho: navegação em cima, utilidades embaixo).
// Em cima, as telas da partida (a atual marcada; Voo e Relatório só acendem quando a partida está neles).
// Embaixo: regras, dicas, tema e sair.
const RAIL_ICONS = { board: 'die', workshop: 'wrench', flight: 'rocket', report: 'clipboard' };
function sideRail(state, player, step, actions, steps, names, simple) {
  const item = (iconName, label, title, run, cls = '') => el('button', { type: 'button', class: `rail-item ${cls}`, title, onclick: run }, [icon(iconName, { size: 20 }), el('span', { class: 'rail-label' }, label)]);
  const canNavigate = !(step === 'flight' && player.flight?.pending); // decisão de voo pendente: resolva antes
  // Com a nave em voo a oficina fica fechada (sim/actions.js, inFlightLock): o atalho some da barra.
  const navSteps = steps.filter((s) => !(s === 'workshop' && player.flight && !state.sandbox && step !== 'workshop'));
  const nav = navSteps.map((s) => {
    const current = s === step;
    const b = item(RAIL_ICONS[s], names[s], names[s], () => { if (!current) actions.go(s); }, current ? 'on' : '');
    if (current) b.setAttribute('aria-current', 'page');
    else if (!canNavigate || s === 'flight' || s === 'report') b.disabled = true;
    return b;
  });
  const guide = item('compass', t('rail.guide'), guideOn() ? t('rail.guideOnTitle') : t('rail.guideOffTitle'), () => actions.toggleGuide(), `guide-toggle ${guideOn() ? 'on-soft' : ''}`);
  guide.setAttribute('aria-pressed', String(guideOn()));
  const theme = themeToggle();
  theme.className = 'rail-item theme-toggle';
  const en = getLang() === 'en';
  const langItem = item('globe', en ? 'EN' : 'PT', en ? t('lang.switchToPt') : t('lang.switchToEn'), () => actions.toggleLang(), 'lang-toggle');
  langItem.setAttribute('aria-label', en ? t('lang.switchToPt') : t('lang.switchToEn'));
  return el('nav', { class: 'side-rail', 'aria-label': t('rail.nav') }, [
    el('span', { class: 'rail-brand', 'aria-hidden': 'true' }, icon('rocket', { size: 20 })),
    // a classe `steps` (trilha de etapas) só entra fora da interface enxuta (test/ui-simple.test.mjs)
    el('div', { class: simple ? 'rail-nav' : 'rail-nav steps' }, nav),
    el('span', { class: 'rail-spacer' }),
    item('bulb', t('rail.rules'), t('rail.rulesTitle'), () => openRulesModal()),
    guide,
    langItem,
    theme,
    item('arrowLeft', t('rail.exit'), t('rail.exitTitle'), () => openExitDialog(actions), 'rail-exit'),
  ]);
}

// Sair da partida: confirmação própria (o navegador não mostra confirm() dentro do visualizador).
// Online, sai também da sala; se for o anfitrião, a partida termina para todos.
function openExitDialog(actions) {
  const close = () => { backdrop.remove(); document.removeEventListener('keydown', onKey); };
  const onKey = (e) => { if (e.key === 'Escape') close(); };
  const online = Boolean(actions.isOnline && actions.isOnline());
  const leave = () => {
    close();
    if (online) actions.lobby.leave();
    actions.newGame();
  };
  const backdrop = el('div', { class: 'modal-backdrop', onclick: close }, [
    el('div', { class: 'modal exit-dialog', role: 'dialog', 'aria-label': t('exit.title'), onclick: (e) => e.stopPropagation() }, [
      el('h2', { class: 'modal-title' }, t('exit.question')),
      el('p', {}, online ? t('exit.online') : t('exit.local')),
      el('div', { class: 'row modal-actions' }, [
        button(t('exit.leave'), leave, { class: 'danger' }),
        button(t('exit.stay'), close, { class: 'primary' }),
      ]),
    ]),
  ]);
  document.addEventListener('keydown', onKey);
  document.body.appendChild(backdrop);
}

// Modal "Como funciona": passos da partida, lados e escadas, glossário. Abre pela tela inicial e pelo menu.
function openRulesModal() {
  const close = () => { backdrop.remove(); document.removeEventListener('keydown', onKey); };
  const onKey = (e) => { if (e.key === 'Escape') close(); };
  // Um turno em três passos, desenhado como fluxo (o que vem depois do quê), com os ícones do tabuleiro.
  const step = (art, title, text) => el('li', { class: 'rm-step' }, [
    el('span', { class: 'rm-step-art', html: art }),
    el('strong', {}, title),
    el('small', {}, text),
  ]);
  // A escada de cada lado como linha do tempo: um degrau por missão, o último é a vitória.
  const side = (s) => el('section', { class: 'rm-side' }, [
    el('header', { class: 'rm-side-head' }, [
      el('span', { class: 'rm-side-ic' }, icon(s.icon, { size: 18 })),
      el('div', {}, [el('strong', {}, s.name), el('small', {}, s.focus)]),
    ]),
    el('ol', { class: 'rm-ladder' }, s.ladder.map((m, i) => el('li', { class: i === s.ladder.length - 1 ? 'goal' : '' }, [
      missionIcon(m, { size: 15 }), el('span', {}, MISSIONS[m].name),
    ]))),
    el('ul', { class: 'rm-traits' }, [
      el('li', { class: 'plus' }, [icon('arrowUp', { size: 14 }), el('span', {}, s.advantage)]),
      el('li', { class: 'minus' }, [icon('trendDown', { size: 14 }), el('span', {}, s.weakness)]),
    ]),
  ]);
  const backdrop = el('div', { class: 'modal-backdrop', onclick: close }, [
    el('div', { class: 'modal rules-modal', role: 'dialog', 'aria-label': t('rules.title'), onclick: (e) => e.stopPropagation() }, [
      el('div', { class: 'rm-head' }, [
        el('div', {}, [
          el('h2', { class: 'modal-title' }, t('rules.title')),
          el('p', { class: 'rm-lead' }, t('rules.lead')),
        ]),
        button(icon('x', { size: 16 }), close, { class: 'small ghost', title: t('common.close') }),
      ]),
      el('h3', { class: 'rm-label' }, t('rules.flowTitle')),
      el('ol', { class: 'rm-flow' }, [
        step(TILE_ART.start, t('step.board'), t('rules.step1', { rounds: ROUNDS_PER_YEAR })),
        step(TILE_ART.workshop, t('step.workshop'), t('rules.step2')),
        step(TILE_ART.tech, t('step.flight'), t('rules.step3')),
      ]),
      el('h3', { class: 'rm-label' }, t('rules.sidesTitle')),
      el('div', { class: 'rm-sides' }, Object.values(SIDES).map(side)),
      glossary(),
      el('p', { class: 'rm-foot' }, t('rules.footer')),
    ]),
  ]);
  document.addEventListener('keydown', onKey);
  document.body.appendChild(backdrop);
}


// Botão que alterna entre o tema Claro (papel quente Íris) e Escuro (grafite neutro Íris).
function themeToggle() {
  const renderContent = (b) => {
    const dark = themeOf() === 'escuro';
    b.innerHTML = '';
    b.appendChild(icon(dark ? 'sun' : 'moon', { size: 15 }));
    b.appendChild(document.createTextNode(dark ? t('theme.light') : t('theme.dark')));
    b.setAttribute('aria-pressed', String(dark));
    b.title = dark ? t('theme.toLight') : t('theme.toDark');
  };
  const b = el('button', {
    class: 'small ghost theme-toggle',
    onclick: () => { toggleTheme(); renderContent(b); },
  });
  renderContent(b);
  return b;
}

// Botão de idioma: alterna entre português e inglês. Precisa de `actions.toggleLang` (em main.js),
// porque trocar o idioma redesenha a tela inteira (todo texto muda), não só o botão.
function langToggle(actions) {
  const en = getLang() === 'en';
  const b = button([icon('globe', { size: 16 }), en ? 'EN' : 'PT'], () => actions.toggleLang(), {
    class: `small ghost lang-toggle ${en ? 'en' : ''}`,
    title: en ? t('lang.switchToPt') : t('lang.switchToEn'),
  });
  b.setAttribute('aria-label', en ? t('lang.switchToPt') : t('lang.switchToEn'));
  return b;
}

// Botão que liga e desliga as orientações (preferência salva no navegador).
function guideToggle(actions) {
  const on = guideOn();
  const b = button([icon('compass', { size: 16 }), on ? t('guide.on') : t('guide.off')], () => actions.toggleGuide(), {
    class: `small ghost guide-toggle ${on ? 'on' : ''}`,
    title: on ? t('guide.onTitle') : t('guide.offTitle'),
  });
  b.setAttribute('aria-pressed', String(on));
  return b;
}

// Título de painel com ícone.
const panelTitle = (iconName, text) => el('h3', { class: 'panel-title' }, [icon(iconName, { size: 18 }), text]);

// Aba expansível da lateral: cabeçalho clicável (abre/fecha) + corpo. O estado fica salvo por `id`,
// então cada jogador escolhe o que deixa aberto. `hint` é um subtítulo curto, sempre visível.
// Como toda a tela é redesenhada a cada ação, o abrir/fechar guarda a preferência em vez de re-render.
function sidePanel(id, iconName, title, children, { defaultOpen = true, hint = null, extraClass = '' } = {}) {
  const d = el('details', { class: `panel collapsible ${extraClass}`.trim() }, [
    el('summary', { class: 'panel-head' }, [
      icon(iconName, { size: 18, className: 'head-icon' }),
      el('div', { class: 'head-text' }, [el('strong', {}, title), hint ? el('small', { class: 'hint' }, hint) : null]),
      icon('chevronDown', { size: 16, className: 'chev' }),
    ]),
    el('div', { class: 'panel-body' }, children),
  ]);
  if (panelOpen(id, defaultOpen)) d.open = true;
  d.addEventListener('toggle', () => setPanelOpen(id, d.open));
  return d;
}

function progressBar(fraction, status = 'ok') {
  return el('div', { class: `pbar ${status}` }, [el('div', { class: 'fill', style: `width:${Math.round(Math.max(0, Math.min(1, fraction)) * 100)}%` })]);
}

// Escada de missões do lado do jogador, com o ano em que o lado cumpriu cada degrau na história real.
function ladderPanel(state, player) {
  const ladder = ladderOf(player);
  const prog = ladderProgress(player);
  return sidePanel('ladder', SIDES[player.side]?.icon || 'ladder', t('ladder.title', { side: sideLabel(player) }), [
    progressBar(prog.pct, prog.done ? 'done' : 'ok'),
    el('ol', { class: 'ladder' }, ladder.map((m, i) => {
      const done = player.completed.find((c) => c.missionId === m);
      const real = REAL_HISTORY[m].sides[player.side];
      const flying = player.flight?.missionId === m;
      const cls = i < player.step ? 'done' : i === player.step ? 'now' : '';
      const status = done ? t('ladder.doneYear', { year: done.year }) : flying ? t('ladder.flyingStage', { n: player.flight.stageIndex + 1, total: player.flight.plan.length }) : i === player.step ? t('ladder.current') : '';
      return el('li', { class: cls }, [
        el('span', { class: 'ladder-name' }, [done ? icon('check', { size: 16 }) : missionIcon(m, { size: 16 }), MISSIONS[m].name]),
        el('small', { class: 'hint' }, [status, status ? '. ' : '', t('ladder.realHistory', { year: real ?? t('ladder.never') })]),
      ]);
    })),
    el('p', { class: 'hint' }, t('ladder.note')),
  ], { hint: t('ladder.hint', { steps: prog.steps, total: prog.total }) });
}

// Rival escondido (IDEIA.md v3 seção 8): só aparece o que o espião ou os boatos revelaram.
function rivalsPanel(state, player) {
  const rivals = state.players.filter((r) => r.id !== player.id);
  if (!rivals.length) return null;
  return sidePanel('rivals', 'eye', t('rivals.title'), [
    ...rivals.map((r) => {
      const info = player.intel[r.id];
      let text = t('rivals.unknown');
      if (info?.rumor) text = t('rivals.rumor', { year: info.year, steps: info.steps, total: info.total });
      else if (info) {
        const ship = info.inFlight ? t('rivals.shipFlying', { n: info.stage + 1, total: info.stages })
          : info.ready != null ? t('rivals.shipReady', { pct: pct(info.ready) }) : info.note || '';
        text = t('rivals.spy', { year: info.year, steps: info.steps, total: info.total, mission: info.mission ? t('rivals.aiming', { mission: info.mission }) : '', ship });
      }
      return el('div', { class: 'race-row' }, [
        el('div', { class: 'row', style: 'margin:0;gap:8px' }, [avatar(r, 26), el('strong', {}, r.name), el('span', { class: 'chip small' }, sideBadge(r))]),
        el('small', { class: `hint ${info && !info.rumor ? 'intel' : ''}` }, text),
        // Público: o lançamento foi anunciado a todos. O resultado do voo e a nave por dentro continuam secretos.
        r.flight ? el('small', { class: 'hint flight-public' }, [icon('rocket', { size: 12 }), t('rivals.flightPublic')]) : null,
      ]);
    }),
  ], { defaultOpen: rivals.some((r) => r.flight), hint: t(rivals.length === 1 ? 'rivals.hint.one' : 'rivals.hint.other', { n: rivals.length }) + (rivals.some((r) => r.flight) ? t('rivals.hintFlying') : '') });
}

// Faixa da agência, sempre visível sob o tabuleiro e os botões de ação: os 4 prédios em cartões (nível,
// o que dão e o botão de subir com o custo) e o socorro de emergência. Prédio não construído aparece
// esmaecido, para o jogador ver o que existe. Construir continua sendo num terreno livre do tabuleiro.
const seenLevels = new Map(); // `${jogador}:${prédio}` -> nível já mostrado (para animar quando sobe)
function agencyStrip(state, player, actions) {
  const cards = Object.values(BUILDINGS).map((b) => {
    const level = player.buildings[b.id] || 0;
    const key = `${player.id}:${b.id}`;
    const grew = seenLevels.has(key) && level > seenLevels.get(key);
    seenLevels.set(key, level);
    const built = level > 0;
    const maxed = level >= MAX_LEVEL;
    const cost = built && !maxed ? upgradeCostFor(state, player, b.id) : null;
    // "Foto" do prédio no nível atual: cresce a cada nível (ui/itemArt.js). Não construído: nível 1 apagado.
    return el('div', { class: `building-card${built ? '' : ' not-built'}${maxed ? ' maxed' : ''}${grew ? ' grew' : ''}`, 'data-level': String(level) }, [
      el('span', { class: 'bc-photo', 'aria-hidden': 'true', html: buildingPhotoSvg(b.id, { level: level || 1 }) }),
      el('div', { class: 'bc-head' }, [el('strong', {}, b.name)]),
      el('div', { class: 'bc-level' }, built
        ? [el('span', { class: 'pips' }, Array.from({ length: MAX_LEVEL }, (_, i) => el('span', { class: `pip${i < level ? ' on' : ''}` }))), el('span', {}, t('agency.level', { level, max: MAX_LEVEL }))]
        : el('span', { class: 'hint' }, t('agency.notBuilt'))),
      el('small', { class: 'hint' }, built ? b.effect : t('agency.buildHint', { cost: upgradeCost(0), effect: b.effect })),
      built && !maxed
        ? button([icon('arrowUp', { size: 14 }), t('agency.upgrade'), el('span', { class: 'num' }, cost)], () => actions.upgradeBuilding(b.id), {
          class: 'small upgrade', disabled: player.funds < cost,
          title: player.funds < cost ? t('agency.upgradeNeed', { n: cost - player.funds, level: level + 1 }) : t('agency.upgradeTitle', { level: level + 1, cost }),
        })
        : null,
      maxed ? el('span', { class: 'badge max' }, t('agency.maxed')) : null,
    ]);
  });
  return el('section', { class: 'panel agency-strip' }, [
    el('div', { class: 'strip-head' }, [
      panelTitle('building', t('agency.title')),
      player.funds < BAILOUT_LIMIT
        ? button([icon('lifebuoy', { size: 16 }), t('agency.bailout', { funds: BAILOUT_FUNDS, tech: BAILOUT_TECH_COST })], () => actions.requestBailout(), { class: 'small ghost' })
        : null,
    ]),
    el('div', { class: 'building-grid' }, cards),
  ]);
}

// Escolha de missão: só no modo sandbox (no jogo normal a missão é o degrau da escada).
function missionPicker(state, player, actions) {
  return el('div', { class: 'mission-grid' }, Object.values(MISSIONS).map((m) => button([
    el('span', { class: 'icon' }, missionIcon(m.id, { size: 26 })),
    el('strong', {}, m.name),
    el('span', { class: 'diff' }, t('mission.picker.diff', { difficulty: m.difficulty, n: flightPlan(m.id).length })),
    el('span', { class: 'goal' }, m.goal),
  ], () => actions.chooseMission(m.id), { class: `mission-card ${player.missionId === m.id ? 'selected' : ''}`, disabled: Boolean(player.flight) })));
}

// Linha do tempo das etapas do voo.
function stageTrack(plan, stages, currentIndex) {
  return el('ol', { class: 'stage-track' }, plan.map((id, i) => {
    const rec = stages[i];
    const cls = rec ? (rec.success ? 'done' : 'fail') : i === currentIndex ? 'now' : '';
    const glyph = rec ? (rec.success ? 'check' : 'x') : STAGES[id].icon;
    return el('li', { class: cls }, [el('span', { class: 's-icon' }, icon(glyph, { size: 15 })), el('span', {}, STAGES[id].name)]);
  }));
}

// Retorno imediato: o que acabou de acontecer (escolha do dilema, o que a casa deu, espião, prédio).
// Fica no centro sem pedir confirmação e some no próximo turno (state.outcome, ver sim/actions.js).
function outcomeCard(state, p) {
  const o = state.outcome;
  if (!o || o.playerId !== p.id || state.pendingDilemma) return null;
  return el('div', { class: 'outcome' }, [
    el('strong', { class: 'decision-title' }, [icon('check', { size: 18 }), o.title]),
    o.choice ? el('small', { class: 'hint' }, t('outcome.youChose', { choice: o.choice })) : null,
    o.changes.length ? el('div', { class: 'delta-row' }, o.changes.map((c) => el('span', { class: `delta ${c.value > 0 ? 'up' : 'down'}` }, [
      `${c.label} `, el('strong', { class: 'num' }, `${c.value > 0 ? '+' : ''}${c.value}`),
    ]))) : null,
    ...o.notes.map((n) => el('small', { class: 'hint' }, n)),
    o.lesson ? el('small', { class: 'outcome-lesson' }, [icon('bulb', { size: 14 }), o.lesson]) : null,
  ]);
}

// Largura de cada barra no desenho anterior: a barra nova cresce a partir dela (CSS .fill.grow),
// para o jogador ver o que a peça comprada mudou. Só visual.
const lastFill = {};

// Medidores: cada recurso contra o limite ou o mínimo, com barra e cor de alerta.
function gauges(player) {
  const t = effectiveTotals(player);
  const m = MISSIONS[player.missionId];
  const hidden = isHidden(player);
  const g = ([iconName, label], value, limit, status, fill, hint) =>
    el('div', { class: `gauge ${status}`, title: hint }, [
      el('span', { class: 'g-label' }, [icon(iconName, { size: 15 }), label]),
      el('span', { class: 'g-value' }, limit == null ? `${value}` : `${value} / ${limit}`),
      (() => {
        const width = Math.round(Math.max(0, Math.min(1, fill)) * 100);
        const key = `${player.id}:${label}`;
        const prev = lastFill[key];
        lastFill[key] = width;
        const grow = prev != null && prev !== width;
        return el('div', { class: 'bar' }, [el('div', { class: `fill ${grow ? 'grow' : ''}`, style: `width:${width}%${grow ? `;--from:${prev}%` : ''}` })]);
      })(),
    ]);
  const ratio = (a, b) => (b > 0 ? a / b : a > 0 ? 1 : 0);
  const hasLauncher = t.maxMass != null;

  return el('div', { class: 'gauges' }, [
    g(['coins', tr('gauge.launchFunds')], player.funds, hasLauncher ? t.launchCost : '—', hasLauncher && player.funds < t.launchCost ? 'bad' : 'ok',
      hasLauncher ? ratio(player.funds, t.launchCost) : 1, tr('gauge.launchFunds.title')),

function boardScreen(state, actions) {
  const p = currentPlayer(state);
  const design = p.missionId ? checkDesign(p) : { ok: false };
  const rolling = state.lastRoll != null && state.lastRoll !== lastRollSeen && p.rolled;
  if (p.rolled) lastRollSeen = state.lastRoll;
  const simple = simpleUi(state, p);

  const from = lastPositions[p.id];

    guideCard(state, 'board'),
    el('div', { class: 'board-layout' }, [
      el('div', { class: 'board-gadget-wrap' }, [
        sinceCard(state),
        el('div', { class: 'board-gadget' }, [

            el('div', { class: 'ring ring-16', style: RING_STYLE }, [...tiles, centerPanel(state, p, actions, rolling)]),

        showRivals ? rivalsPanel(state, p) : null,

    myPeerId: () => net.getMyPeerId(),
    hostPeerId: () => net.getHostPeerId(),
    isHost: () => net.isHost(),
    claim: (slot, name) => net.claim(slot, name),
    release: () => net.release(),
    dropSlot: (slot) => net.dropSlot(slot),
    leave: () => { net.disconnect(); state.screen = 'setup'; render(); },
    // Só o host: roda o startGame de verdade e transmite estado + agência de cada um.
    start: () => {
      const error = net.startSession((players) => {
        resetSummaries();
        lastYearShown = null;
        const error = game.startGame(state, players, {});
        state.turnSeconds = timerSeconds(); // tempo por turno escolhido pelo anfitrião vale para todos
        return error;
      });
      if (typeof error === 'string') showToast(error);
      render();
    },
  },
};

// Ações da tela de espectador (fora da sua vez, online). Só navegação LOCAL entre o
// tabuleiro público e a sua oficina em modo leitura, mais o botão de dicas. Nenhuma
// jogada viaja pela rede: os botões de jogada nem são renderizados/ficam desabilitados
// e, se algo escapar, a trava de turno (net.dispatch) barra do mesmo jeito.
const blockedInSpectate = () => showToast(t('net.spectateBlocked'));
const spectatorActions = {
  openWorkshop: () => { spectateView = 'workshop'; render(); },
  go: (screen) => { spectateView = screen === 'workshop' ? 'workshop' : 'board'; render(); },
  toggleGuide: () => { setGuide(!guideOn()); render(); },
  toggleLang: () => { toggleLang(); render(); },
  buyItem: blockedInSpectate,
  sellItem: blockedInSpectate,
  chooseLauncher: blockedInSpectate,
  chooseOrbit: blockedInSpectate,
  chooseMission: blockedInSpectate,
  launch: blockedInSpectate,
  rehearse: blockedInSpectate,
  newGame: blockedInSpectate,
};

function showToast(text) {
  const t = document.createElement('div');
  t.className = 'toast';
  t.textContent = text;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 2500);
}

// Animação curta de lançamento (contagem + foguete) antes da tela de voo. Um clique pula.
function showLaunchOverlay() {
  // Decolagem: contagem, o foguete sobe com chama acesa e fumaça em pixel. Um clique pula.
  if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const o = document.createElement('div');
  o.className = 'launch-overlay';
  o.title = t('ui.launchSkip');
  o.innerHTML = `<div class="count">3</div><div class="lift"><svg viewBox="0 0 40 72" aria-hidden="true"><path class="lift-flame" d="M14 50 20 70l6-20z" fill="#ffc857" stroke="#ff7a3c" stroke-width="1.5"/><path d="M20 2c8 6 11 15 11 26v22H9V28C9 17 12 8 20 2z" fill="#f2f6ff" stroke="#10213d" stroke-width="1.6"/><path d="M9 34 2 46v8l7-4zM31 34l7 12v8l-7-4z" fill="#c4473a" stroke="#10213d" stroke-width="1.4"/><circle cx="20" cy="24" r="5" fill="#1d3f86" stroke="#10213d" stroke-width="1.4"/></svg></div><div class="pad"></div>`;
  document.body.appendChild(o);
  const count = o.querySelector('.count');
  const lift = o.querySelector('.lift');
  let smoke = null;
  const timers = [
    setTimeout(() => { count.textContent = '2'; }, 450),
    setTimeout(() => { count.textContent = '1'; }, 900),
    setTimeout(() => {
      count.textContent = t('ui.launchGo');
      lift.classList.add('go');
      smoke = setInterval(() => { const r = lift.getBoundingClientRect(); puff(r.left + r.width / 2, r.bottom - 6, 3, 'launch-smoke'); }, 50);
    }, 1350),
    setTimeout(() => { clearInterval(smoke); o.remove(); }, 2600),
  ];
  o.addEventListener('click', () => { timers.forEach(clearTimeout); clearInterval(smoke); o.remove(); });
}

// Calendário da virada de ano (ui/yearOverlay.js): ~6 s, some sozinho, um clique pula, sem confirmar.
// Com movimento reduzido mostra só o ano novo e os ganhos, sem o ano antigo saindo.
function showYearOverlay(yc) {
  document.querySelector('.year-overlay')?.remove();
  const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const node = yearOverlayNode(yc, { reduced });
  document.body.appendChild(node);
  // uma faixa de luz varre a planta do tabuleiro quando o ano vira
  const board = document.querySelector('.board-gadget');
  if (board && !reduced) { board.classList.remove('year-sweep'); void board.offsetWidth; board.classList.add('year-sweep'); setTimeout(() => board.classList.remove('year-sweep'), 2200); }
  const timer = setTimeout(() => node.remove(), reduced ? YEAR_OVERLAY_REDUCED_MS : YEAR_OVERLAY_MS);
  node.addEventListener('click', () => { clearTimeout(timer); node.remove(); });
}

// Relógio do turno (ui/turnClock.js): só o aparelho de quem está jogando conta e dispara o tempo esgotado
// (no online, os outros estão na tela de espera e não podem disparar pela vez de outra agência).
setInterval(() => {
  if (net.isPlaying() && state.turn !== net.getMyPlayerId()) return;
  tickClock(state, () => actions.turnTimeout());
}, 250);

// Exposto para depuração no console do navegador.
window.__game = { get state() { return state; }, actions };

render();

// Entrar direto numa sala por link de convite (?sala=<codigo>, ver docs/PLANO-SALAS.md):
// cai no lobby da sala, sem passar pela tela de setup.
const roomCode = new URLSearchParams(window.location.search).get('sala');
if (roomCode) {
  showToast(t('net.connecting'));
  actions.joinOnline(roomCode);
}

return {  };
})();
})();
</script>
</body>
